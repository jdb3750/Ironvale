<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Vale — the Hall of Records, a scene</title>
<!-- Design mockup for the Hall of Records (static/js/hall.js). Nothing is wired
     up: no fetches, no state, no app code. The eight-tab bar and its 29 stacked
     .win panels are re-staged as a corridor of fixtures you walk. All chrome,
     fonts, tokens and sprite plumbing come from _harness.js. -->
<script src="_harness.js"></script>
<body>
<script>
IV.injectStyles();

/* =============================================================================
   0. SPRITE CONSTRUCTION HELPERS
   Every fixture is authored 32 pixels wide. Rows are built by centring a core
   string inside that width so no row can drift out of alignment by a character.
   ========================================================================== */
var W = 32;
function R(n, ch) { return (ch || '.').repeat(Math.max(0, n)); }
function C(w, core, fill) {
  fill = fill || '.';
  if (core.length >= w) return core.slice(0, w);
  var pad = w - core.length, l = Math.floor(pad / 2);
  return fill.repeat(l) + core + fill.repeat(pad - l);
}

/* ---- 1. THE CASE (body) — a glass case on a stone plinth, seen three-quarter.
   The brass box is drawn with a receding top face and a narrow right side face,
   so it has depth; the front is glass, with two specular bars in the clear
   upper-left corner and a standing figure on a low pedestal behind it. ------- */
var fx_case = (function () {
  var p = { B: '#e6c87e', b: '#a07a44', m: '#5e4526', G: '#1b2231', g: '#28324a',
            H: '#9dc0e8', f: '#e8bb92', h: '#6a4428', k: '#241b28', t: '#5f81b8',
            T: '#3d5f8e', l: '#6a6a8e', L: '#4a4a68', S: '#9a9aa8', s: '#6c6c78',
            D: '#42424c', K: '#101018', P: '#84848f' };
  /* the figure inside — hair, face, arms, hands, legs, boots; 10 columns wide.
     Gaps are filled with glass, not left transparent, so the case reads solid. */
  var FIG = {
    1: '..hhhhhh..', 2: '.hhhhhhhh.', 3: '.hffffffh.', 4: '.hfkffkfh.',
    5: '.hffffffh.', 6: '..ffffff..', 7: '...ffff...', 8: '..tttttt..',
    9: '.tttttttt.', 10: '.ttTTTTtt.', 11: '.ttTTTTtt.', 12: '.ffTTTTff.',
    13: '..llllll..', 14: '..ll..ll..', 15: '..ll..ll..', 16: '..LL..LL..',
  };
  var rows = [];
  /* the top of the case, receding up and to the right */
  rows.push(R(7) + R(23, 'B') + R(2));
  rows.push(R(5) + R(25, 'B') + R(2));
  rows.push(R(3) + R(27, 'b') + R(2));
  rows.push(R(2) + R(28, 'B') + R(2));
  for (var y = 0; y < 19; y++) {
    var front = C(22, (FIG[y] || '').replace(/\./g, 'G'), 'G').split('');
    if (y === 17) front = C(22, R(14, 'P'), 'G').split('');
    if (y === 18) front = C(22, R(14, 's'), 'G').split('');
    var shine = function (x) { if (x >= 0 && x < 22 && front[x] === 'G') front[x] = 'H'; };
    if (y >= 1 && y <= 6) { shine(7 - y); shine(8 - y); }   /* the long bar, clear of the figure */
    if (y >= 9 && y <= 13) { shine(y + 6); }                /* its short partner, lower right */
    rows.push(R(2) + 'b' + front.join('') + 'm' + 'ggg' + 'b' + R(2));
  }
  rows.push(R(2) + R(28, 'b') + R(2));
  rows.push(R(1) + R(30, 'S') + R(1));
  rows.push(R(1) + R(30, 's') + R(1));
  rows.push(R(1) + 'S' + R(28, 's') + 'S' + R(1));
  rows.push(R(1) + R(30, 's') + R(1));
  rows.push(R(1) + R(30, 'D') + R(1));
  rows.push(R(32, 'K'));
  return { p: p, r: rows };
})();

/* ---- 2. THE CHART WALL (vitals) — six framed plates hung on two rails ------ */
function chartPlate(vals, ch) {
  var rows = [];
  for (var y = 0; y < 8; y++) {
    var s = '';
    for (var x = 0; x < 8; x++) s += (vals[x] === y ? ch : 'p');
    rows.push('b' + s + 'b');
  }
  return rows;
}
var pA = chartPlate([5, 4, 5, 3, 4, 2, 3, 2], 'g');
var pB = chartPlate([2, 3, 2, 4, 3, 5, 4, 5], 'r');
var pC = chartPlate([4, 4, 3, 3, 2, 3, 2, 1], 'u');
var pD = chartPlate([6, 5, 5, 4, 3, 3, 2, 2], 'y');
var pE = chartPlate([3, 3, 4, 4, 4, 5, 5, 5], 'v');
var pF = chartPlate([3, 5, 2, 4, 3, 4, 2, 3], 'u');
var fx_chartwall = (function () {
  var p = { b: '#8a6a40', p: '#e8e0cc', g: '#7ab55c', r: '#c85050', u: '#6aa0c8',
            y: '#f0d080', v: '#a06ac8', w: '#5a4428' };
  var r = [C(W, R(30, 'w')), C(W, R(30, 'b'))];
  for (var y = 0; y < 8; y++) r.push(C(W, pA[y] + pB[y] + pC[y]));
  r.push(C(W, R(30, 'b')));
  r.push(C(W, ''));
  r.push(C(W, R(30, 'w')));
  r.push(C(W, R(30, 'b')));
  for (var y2 = 0; y2 < 8; y2++) r.push(C(W, pD[y2] + pE[y2] + pF[y2]));
  r.push(C(W, R(30, 'b')));
  return { p: p, r: r };
})();

/* ---- 3. THE MAP TABLE (deeds) — the Long Road unrolled on a trestle.
   A table, not a picture: a wooden top with a lit front lip and visible
   thickness, two splayed trestles braced by a long stretcher, feet on the
   floor — and the map lying ON the top, its ends still rolled. ------------- */
var fx_maptable = (function () {
  var p = { W: '#b28a52', w: '#8a6636', d: '#5c4220', k: '#33240f',
            p: '#efe7cf', q: '#d3c7a3', r: '#b05e26', n: '#6e3a12', y: '#f8dc90' };
  var rows = [C(W, ''), C(W, R(22, 'w'))];
  for (var my = 0; my < 9; my++) {
    var s = '';
    for (var mx = 0; mx < 18; mx++) {
      /* two full bends across the sheet, so it winds like a road and not like a
         mountain: one hump would read as a framed landscape */
      var ry = Math.round(4 + 2.4 * Math.sin((mx + 1) / 1.7));
      var ch;
      if (mx < 2 || mx > 15) ch = (my === 0 || my === 8) ? 'n' : 'q';  /* still-rolled ends */
      else if (my === ry) ch = (mx % 5 === 3) ? 'y' : 'r';             /* the Road, with its landmarks */
      else if (my === ry + 1) ch = 'n';
      else if ((mx * 3 + my * 5) % 11 === 4) ch = 'q';
      else ch = 'p';
      s += ch;
    }
    rows.push(C(W, 'www' + s + 'www'));
  }
  rows.push(C(W, R(26, 'W')));   /* the lit front lip of the top */
  rows.push(C(W, R(28, 'w')));   /* its thickness */
  rows.push(C(W, R(28, 'd')));   /* the shadow it throws */
  for (var i = 0; i < 11; i++) {
    var row = [];
    for (var x = 0; x < W; x++) row.push('.');
    var spread = Math.round(i * 0.42);
    var put = function (px, ch2) { if (px >= 0 && px < W) row[px] = ch2; };
    [7, 24].forEach(function (base) {
      put(base - spread, 'W'); put(base - spread + 1, 'w');
      put(base + spread, 'W'); put(base + spread + 1, 'w');
    });
    if (i === 4) for (var xs = 8; xs <= 24; xs++) { if (row[xs] === '.') row[xs] = 'd'; }
    if (i === 7) {
      for (var xa = 7 - spread; xa <= 7 + spread + 1; xa++) put(xa, 'w');
      for (var xb = 24 - spread; xb <= 24 + spread + 1; xb++) put(xb, 'w');
    }
    rows.push(row.join(''));
  }
  var feet = [];
  for (var fx2 = 0; fx2 < W; fx2++) feet.push('.');
  for (var a = 2; a <= 13; a++) feet[a] = 'd';
  for (var b = 19; b <= 30; b++) feet[b] = 'd';
  rows.push(feet.join(''));
  rows.push(C(W, R(30, 'k')));
  return { p: p, r: rows };
})();

/* ---- 4. THE IRON RACK (iron) — plates on pegs, the ledger on the top shelf -- */
var fx_ironrack = (function () {
  var p = { i: '#8a8a9a', I: '#b0b0c0', m: '#3a3a46', k: '#1a1a24', W: '#8a6a40',
            w: '#6a4e2c', p: '#efe7cf', q: '#c8bc9a', R: '#8a3020', y: '#e0b850',
            o: '#c0402a' };
  var disc10 = ['..IIIIII..', '.IIiiiiII.', 'IIiimmiiII', 'IIiimmiiII', '.IIiiiiII.', '..IIIIII..'];
  var disc8 = ['..IIII..', '.IiiiiI.', 'IiimmiiI', 'IiimmiiI', '.IiiiiI.', '..IIII..'];
  /* the ledger, lying closed on the top shelf: stamped cover, page block at the
     front edge, a ribbon marker hanging out of it */
  var book = [
    '..RRRRRRRRRRRR..',
    '.RRRRRRRRRRRRRR.',
    '.RRyyyyyyyyyyRR.',
    '.RRRRRRRRRRRRRR.',
    '.kkkkkkkkkkkkkk.',
    '.pppppppppppppp.',
    '.qqqqqqqoqqqqqq.',
    '..kkkkkkokkkkk..',
  ];
  var rack = function (core) { return C(W, 'w' + C(26, core, '.') + 'w'); };
  var plank = C(W, 'w' + R(26, 'W') + 'w');
  var r = [C(W, '')];
  book.forEach(function (b) { r.push(C(W, b)); });
  r.push(plank); r.push(C(W, 'w' + R(26, 'w') + 'w'));
  for (var y = 0; y < 6; y++) r.push(rack(disc10[y] + '..' + disc10[y]));
  r.push(plank); r.push(C(W, 'w' + R(26, 'w') + 'w'));
  for (var y2 = 0; y2 < 6; y2++) r.push(rack(disc8[y2] + '.' + disc8[y2] + '.' + disc8[y2]));
  r.push(plank);
  r.push(C(W, R(28, 'k')));
  return { p: p, r: r };
})();

/* ---- 5. THE LOOM (calendar) — warp threads above a year of woven stitches --- */
var fx_loom = (function () {
  var p = { W: '#8a6a40', w: '#6a4e2c', d: '#4a3419', n: '#55506a', e: '#191928',
            g: '#7ab55c', u: '#6aa0c8', c: '#e07030', s: '#c85050',
            m: '#a06ac8', a: '#5cb5a5', z: '#4a90d0', o: '#9a9aa8' };
  var CATS = 'guscmazo';
  var r = [C(W, R(28, 'W')), C(W, R(28, 'd'))];
  var warp = '';
  for (var t = 0; t < 12; t++) warp += 'n.';
  for (var y = 0; y < 7; y++) r.push(C(W, 'W' + warp + 'W'));
  for (var cy = 0; cy < 9; cy++) {
    var s = '';
    for (var x = 0; x < 24; x++) {
      var k = (x * 5 + cy * 3 + ((x * x + cy) % 4)) % 11;
      s += (k < 7) ? CATS[(x + cy * 3) % 8] : 'e';
    }
    r.push(C(W, 'W' + s + 'W'));
  }
  r.push(C(W, R(28, 'W')));
  r.push(C(W, R(28, 'd')));
  for (var l = 0; l < 5; l++) r.push(C(W, 'ww' + R(24) + 'ww'));
  r.push(C(W, R(28, 'd')));
  return { p: p, r: r };
})();

/* ---- 6. THE SHELF (compendium) — three shelves of bound volumes ------------ */
var fx_shelf = (function () {
  var p = { w: '#6a4e2c', W: '#8a6a40', d: '#4a3419',
            r: '#8a3020', g: '#3e6234', u: '#3a5a8a', v: '#6a3a8a',
            y: '#a8802c', t: '#2a5a5a', o: '#a04828' };
  var SP = 'rguvyto';
  function shelfRows(seed, hgt) {
    var cols = [], i = seed, x = 0;
    while (x < 28) {
      var c = SP[(i * 3 + seed) % SP.length];
      var wid = 2 + ((i * 5) % 2);
      var top = (i * 5) % 3;
      for (var j = 0; j < wid && x < 28; j++, x++) cols.push({ c: c, top: top });
      if ((i % 4) === 2 && x < 28) { cols.push({ c: null, top: 0 }); x++; }
      i++;
    }
    var rows = [];
    for (var y = 0; y < hgt; y++) {
      var s = '';
      for (var x2 = 0; x2 < 28; x2++) {
        var cc = cols[x2];
        s += (!cc || !cc.c || y < cc.top) ? '.' : cc.c;
      }
      rows.push('w' + s + 'w');
    }
    return rows;
  }
  var plank = C(W, R(30, 'W'));
  var r = [plank, C(W, R(30, 'd'))];
  [1, 5, 9].forEach(function (seed) {
    shelfRows(seed, 7).forEach(function (row) { r.push(C(W, row)); });
    r.push(plank);
  });
  r.push(C(W, R(30, 'd')));
  return { p: p, r: r };
})();

/* ---- 7. THE LECTERN (almanac) — this moon's edition, open ------------------ */
var fx_lectern = {
  p: { p: '#e8e0cc', q: '#d0c6a8', k: '#2a2018', W: '#8a6a40', w: '#6a4e2c', d: '#4a3419' },
  r: [
    C(W, ''),
    C(W, R(6, 'p') + 'kk' + R(6, 'p')),
    C(W, R(8, 'p') + 'kk' + R(8, 'p')),
    C(W, 'p' + R(3, 'k') + 'pp' + R(3, 'k') + 'p' + 'kk' + 'p' + R(3, 'k') + 'pp' + R(3, 'k') + 'p'),
    C(W, R(11, 'p') + 'kk' + R(11, 'p')),
    C(W, 'pp' + R(4, 'k') + 'pp' + R(3, 'k') + 'p' + 'kk' + 'p' + R(3, 'k') + 'pp' + R(4, 'k') + 'pp'),
    C(W, R(13, 'W') + 'kk' + R(13, 'W')),
    C(W, R(28, 'w')),
    C(W, R(28, 'd')),
    C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'),
    C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'),
    C(W, R(12, 'W')),
    C(W, R(18, 'w')),
    C(W, R(22, 'W')),
    C(W, R(22, 'd')),
  ],
};

/* ---- 8. THE SCROLL (chronicle) — spooling from the wall into a basket ------ */
var fx_scroll = (function () {
  var p = { S: '#7a7a88', s: '#5a5a68', k: '#14141c', p: '#e8e0cc', q: '#cfc4a6',
            W: '#8a6a40', w: '#6a4e2c', d: '#4a3419' };
  var r = [
    C(W, R(22, 'S')),
    C(W, 'S' + R(20, 's') + 'S'),
    C(W, 'S' + R(4, 's') + R(12, 'k') + R(4, 's') + 'S'),
    C(W, R(22, 's')),
  ];
  for (var y = 0; y < 16; y++) {
    var off = Math.round(2.2 * Math.sin(y / 3.0));
    var s = '';
    for (var x = 0; x < 26; x++) {
      var rel = x - (7 + off);
      if (rel >= 0 && rel < 12) s += (y % 3 === 1 && rel > 1 && rel < 11) ? 'q' : 'p';
      else s += '.';
    }
    r.push(C(W, s));
  }
  r.push(C(W, R(20, 'q')));
  r.push(C(W, R(22, 'd')));
  for (var b = 0; b < 5; b++) {
    var bs = '';
    for (var bx = 0; bx < 22; bx++) bs += ((bx + b) % 2 === 0) ? 'W' : 'w';
    r.push(C(W, bs));
  }
  r.push(C(W, R(22, 'd')));
  return { p: p, r: r };
})();

/* ---- corner-glyph + prop sprites ------------------------------------------ */
var glyph_arch = {
  p: { S: '#a8a8bc', s: '#6a6a80', d: '#2e2a44', f: '#8a6a3a', y: '#f0d080' },
  r: [
    '............', '....SSSS....', '..SSssssSS..', '.SSssddssSS.',
    '.SsddddddsS.', '.SsddddddsS.', '.SsddyyddsS.', '.SsddyyddsS.',
    '.SsddddddsS.', '.SsffffffsS.', '.SsffffffsS.', '.SSSSSSSSSS.',
  ],
};
/* the player, standing on the floor of the hall. The header's 12px `hero` glyph
   is too small to carry limbs; at 4x on the floor the figure needs arms, hands,
   legs and boots, and trousers that do not vanish into the plank colour. */
var walker = {
  p: { h: '#6a4428', f: '#e8bb92', k: '#241b28', t: '#5f81b8', T: '#3d5f8e',
       b: '#3a2a18', L: '#4d5a78', l: '#37405a', e: '#5b5570', d: '#221c2a' },
  r: [
    '....hhhhhh....',
    '...hhhhhhhh...',
    '...hffffffh...',
    '...hfkffkfh...',
    '...hffffffh...',
    '....ffffff....',
    '.....ffff.....',
    '..tttttttttt..',
    '.tttttttttttt.',
    '.ttTTTTTTTTtt.',
    '.ttTTTTTTTTtt.',
    '.ttTTTTTTTTtt.',
    '.ffTTTTTTTTff.',
    '..bbbbbbbbbb..',
    '..LLLLLLLLLL..',
    '..LLLL..LLLL..',
    '..LLLL..LLLL..',
    '..LLLL..LLLL..',
    '..llll..llll..',
    '..eeee..eeee..',
    '..dddd..dddd..',
    '.ddddd..ddddd.',
  ],
};
/* a hard-edged pixel shadow — nothing else in the hall is anti-aliased */
var walker_shadow = {
  p: { S: '#150e08', s: '#241a0e' },
  r: [
    '.....ssssssssss.....',
    '..sSSSSSSSSSSSSSSs..',
    '.sSSSSSSSSSSSSSSSSs.',
    '...ssSSSSSSSSSSss...',
  ],
};
var hall_lamp = {
  p: { m: '#3a3a46', i: '#8a8a9a', o: '#e07030', y: '#f0d060', w: '#fff0c0' },
  r: [
    '........', '..oyyo..', '.oywwyo.', '.oywwyo.', '..oyyo..',
    '..iiii..', '..iiii..', '...ii...', '..mmmm..', '...mm...',
  ],
};
/* Maud, the Curator — an owl in spectacles, lifted verbatim from static/js/pixel.js */
var maud = {
  p: { b: '#6a4e2c', B: '#8a6a40', w: '#e8e0d0', k: '#1a1410', y: '#e0a030', g: '#c9a24b', f: '#c8a878' },
  r: [
    '................', '..bb........bb..', '..bbb......bbb..', '...bbbbbbbbbb...',
    '..bBBBBBBBBBBb..', '..bBgggBBgggBb..', '..bgwwwgBgwwwgb.', '..bgwkwgggwkwgb.',
    '..bgwwwgBgwwwgb.', '..bBgggByBgggBb.', '..bBBBByyyBBBb..', '..bBfBBByBBfBb..',
    '...bffBBBBBff...', '...bBBBBBBBBb...', '....bb.bb.bb....', '................',
  ],
};

var SCENE_SPRITES = {
  fx_case: fx_case, fx_chartwall: fx_chartwall, fx_maptable: fx_maptable,
  fx_ironrack: fx_ironrack, fx_loom: fx_loom, fx_shelf: fx_shelf,
  fx_lectern: fx_lectern, fx_scroll: fx_scroll,
  glyph_arch: glyph_arch, hall_lamp: hall_lamp, maud: maud,
  walker: walker, walker_shadow: walker_shadow,
};
/* self-check: a ragged row would silently shift pixels, so shout about it */
Object.keys(SCENE_SPRITES).forEach(function (k) {
  var rows = SCENE_SPRITES[k].r, w = rows[0].length;
  rows.forEach(function (row, i) {
    if (row.length !== w) console.error('SPRITE ROW MISMATCH', k, 'row', i, row.length, 'expected', w);
  });
});
IV.addSprites(SCENE_SPRITES);

/* =============================================================================
   1. SCENE CSS — appended AFTER the harness sheet so it can extend it.
   ========================================================================== */
var SCENE_CSS = `

  box-shadow:0 0 0 2px #0a0a12, 6px 6px 0 rgba(0,0,0,0.5); background:#0b0b12; }
.iv .corr-scroll { overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }

.iv .corr-scroll::-webkit-scrollbar-thumb { background:#4a3d20; }

.iv .c-vault { position:absolute; left:0; right:0; top:0; height:70px; background-repeat:repeat-x; }
.iv .c-wall  { position:absolute; left:0; right:0; top:70px; height:166px; background-repeat:repeat; }
/* the sill course: one dressed stone band running the whole length of the hall,
   at the springing of the floor. Every fixture stands on it and every fixture's
   name is set into it, so no label floats free of the building. */
.iv .c-sill { position:absolute; left:0; right:0; top:202px; height:34px; z-index:2;
  background-repeat:repeat-x; }
.iv .c-floor { position:absolute; left:0; right:0; top:236px; height:144px; background-repeat:repeat-x; }
.iv .c-floor::before { content:''; position:absolute; left:0; right:0; top:0; height:3px; background:#100c06; }
.iv .c-floor::after { content:''; position:absolute; left:0; right:0; top:3px; height:26px; pointer-events:none;
  background:linear-gradient(180deg, rgba(6,6,10,0.55), rgba(6,6,10,0)); }
.iv .c-sky { position:absolute; left:0; right:0; top:0; height:180px; pointer-events:none;
  background:linear-gradient(180deg, rgba(200,180,240,0.05), rgba(0,0,0,0)); }

.iv .shaft { position:absolute; top:26px; width:52px; height:214px; pointer-events:none;
  transform:skewX(-7deg); transform-origin:top center;
  background:linear-gradient(180deg, rgba(240,208,128,0.18), rgba(240,208,128,0.02) 78%, rgba(240,208,128,0)); }
.iv .pool { position:absolute; top:216px; width:158px; height:78px; pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%, rgba(240,208,128,0.24), rgba(240,208,128,0) 68%); }

/* =============================================================================
   2. PROCEDURAL BACKDROPS — the corridor's vault, wall and receding floor.
   ========================================================================== */
/* One bay of the hall — also the fixture pitch, and the whole reason the frame
   cuts where it does. The desktop panel gives the corridor exactly 848px of
   visible width (900 viewport - 20 app-pad margin - 20 padding - 8 corridor
   margin - 4 border), and 848 = 8 x 106: the frame's right edge lands on the
   pier at the end of the eighth bay instead of slicing a nameplate mid-word. */
var BAY = 106;
var NICHE_W = 100;   /* the arch, inside the 6px pier between two bays */
var SILL_H = 34;     /* the stone course the fixtures stand on */

/* the sill course — dressed stone, jointed at the piers and twice within the
   bay, with a lit chamfer on top and a hard shadow where it meets the boards */
function sillTile(h) {
  return IV.tileURL(BAY, h, function (ctx, w, hh) {
    ctx.fillStyle = '#37334a'; ctx.fillRect(0, 0, w, hh);
    ctx.fillStyle = '#565270'; ctx.fillRect(0, 0, w, 2);
    ctx.fillStyle = '#46425c'; ctx.fillRect(0, 2, w, 2);
    ctx.fillStyle = '#2a2739'; ctx.fillRect(0, hh - 6, w, 3);
    ctx.fillStyle = '#16141e'; ctx.fillRect(0, hh - 3, w, 3);
    var joints = [0, Math.round(w * 0.25), Math.round(w * 0.75)];
    joints.forEach(function (x) {
      ctx.fillStyle = '#1e1b28'; ctx.fillRect(x, 2, 2, hh - 5);
      ctx.fillStyle = '#413d56'; ctx.fillRect(x + 2, 4, 1, hh - 9);
    });
    /* a little weathering so it is stone and not a swatch */
    ctx.fillStyle = '#3f3b52';
    for (var i = 0; i < w; i += 7) ctx.fillRect(i + (i % 3), 7 + ((i * 5) % Math.max(1, hh - 14)), 2, 1);
  });
}

function vaultTile() {
  return IV.tileURL(BAY, 70, function (ctx, w, h) {
    ctx.fillStyle = '#0c0c16'; ctx.fillRect(0, 0, w, h);
    for (var x = 0; x < w; x++) {
      var t = x / w;
      var arc = Math.round(57 - 40 * Math.sin(Math.PI * t));
      ctx.fillStyle = '#15151f'; ctx.fillRect(x, arc, 1, h - arc);
      ctx.fillStyle = '#2e2e46'; ctx.fillRect(x, arc, 1, 2);
    }
    /* the clerestory lancet at the crown of each bay */
    var wx = Math.round(w / 2) - 8, wy = 20;
    ctx.fillStyle = '#2a2a3e'; ctx.fillRect(wx - 2, wy - 2, 20, 30);
    ctx.fillStyle = '#4a6088'; ctx.fillRect(wx, wy, 16, 26);
    ctx.fillStyle = '#7a94bc'; ctx.fillRect(wx + 1, wy + 1, 6, 11);
    ctx.fillStyle = '#9fb6d8'; ctx.fillRect(wx + 9, wy + 14, 5, 9);
    ctx.fillStyle = '#232336'; ctx.fillRect(wx + 7, wy, 2, 26); ctx.fillRect(wx, wy + 12, 16, 2);
    /* the piers the vault springs from, at both bay edges */
    ctx.fillStyle = '#26263a'; ctx.fillRect(0, 0, 3, h); ctx.fillRect(w - 3, 0, 3, h);
    ctx.fillStyle = '#3a3a54'; ctx.fillRect(1, 0, 1, h); ctx.fillRect(w - 2, 0, 1, h);
  });
}

function wallTile() {
  return IV.tileURL(64, 32, function (ctx, w, h) {
    ctx.fillStyle = '#171722'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#0f0f18';
    ctx.fillRect(0, 14, w, 2); ctx.fillRect(0, 30, w, 2);
    ctx.fillRect(30, 0, 2, 15); ctx.fillRect(0, 16, 2, 15); ctx.fillRect(62, 16, 2, 15);
    ctx.fillStyle = '#202030';
    ctx.fillRect(2, 1, 27, 12); ctx.fillRect(33, 1, 28, 12);
    ctx.fillRect(3, 17, 26, 12); ctx.fillRect(31, 17, 30, 12);
    ctx.fillStyle = '#282840';
    ctx.fillRect(2, 1, 27, 1); ctx.fillRect(33, 1, 28, 1);
    ctx.fillRect(3, 17, 26, 1); ctx.fillRect(31, 17, 30, 1);
  });
}

/* boards running along the hall, seen from a step up: the bands compress as the
   floor recedes, which is the whole depth cue */
function floorStrip(H) {
  return IV.tileURL(BAY, H, function (ctx, w, h) {
    var bands = [], y = 0, gap = 2.2;
    while (y < h) { bands.push(Math.round(y)); y += gap; gap *= 1.235; }
    bands.push(h);
    for (var i = 0; i < bands.length - 1; i++) {
      var y0 = bands[i], y1 = bands[i + 1];
      var t = 0.10 + 0.82 * (i / (bands.length - 2));
      ctx.fillStyle = IV.blendHex('#5c4123', '#221810', t);
      ctx.fillRect(0, y0, w, y1 - y0);
      /* the seam between two boards, and a faint highlight on the near face */
      ctx.fillStyle = '#150e07';
      ctx.fillRect(0, y1 - 1, w, 1);
      if (y1 - y0 > 5) {
        ctx.fillStyle = IV.blendHex('#6d5030', '#2a1e12', t);
        ctx.fillRect(0, y0, w, 1);
      }
      /* boards are long: at most one end-joint per bay, and only now and then */
      if (i % 3 === 1) {
        ctx.fillStyle = '#1d1409';
        ctx.fillRect(Math.round(((i % 2) ? 0.62 : 0.23) * w), y0, 1, Math.max(1, y1 - y0 - 1));
      }
    }
  });
}

/* a shallow arched niche cut into the wall — one room per fixture */
function nicheURL() {
  return IV.tileURL(NICHE_W, 124, function (ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    var r = w / 2;
    for (var y = 0; y < h; y++) {
      var x0 = 0, x1 = w;
      if (y < r) {
        var dx = Math.sqrt(Math.max(0, r * r - (r - y) * (r - y)));
        x0 = Math.round(r - dx); x1 = Math.round(r + dx);
      }
      if (x1 - x0 < 4) continue;
      var shade = IV.blendHex('#1c1c2c', '#101018', y / h);
      ctx.fillStyle = shade; ctx.fillRect(x0, y, x1 - x0, 1);
      ctx.fillStyle = '#33334c'; ctx.fillRect(x0, y, 2, 1); ctx.fillRect(x1 - 2, y, 2, 1);
    }
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, h - 3, w, 3);
  });
}

/* =============================================================================
   3. THE CORRIDOR — eight fixtures, one per old tab, standing along one hall.
   ========================================================================== */
var FIXTURES = [
  { key: 'fx_case',      name: 'THE CASE',       sub: 'the shape of you, under glass',      tab: 'body' },
  { key: 'fx_chartwall', name: 'THE CHART WALL', sub: 'what the heart reports',             tab: 'vitals' },
  { key: 'fx_maptable',  name: 'THE MAP TABLE',  sub: 'the Long Road, walked',              tab: 'deeds' },
  { key: 'fx_ironrack',  name: 'THE IRON RACK',  sub: 'plates, and the book of them',       tab: 'iron' },
  { key: 'fx_loom',      name: 'THE LOOM',       sub: 'a year of stitches',                 tab: 'calendar', near: true },
  { key: 'fx_shelf',     name: 'THE SHELF',      sub: 'bound volumes of honest labor',      tab: 'compendium' },
  { key: 'fx_lectern',   name: 'THE LECTERN',    sub: "this moon's edition, open",          tab: 'almanac' },
  { key: 'fx_scroll',    name: 'THE SCROLL',     sub: 'everything, in the order it fell',   tab: 'chronicle' },
];
var FX_X0 = 3;   /* the first arch, just inside the first pier */
/* the one you are walking up to — its name and line are quoted, once, by the
   hint bar under the corridor and by the plate on the phone's sill */
var NEAR_FX = FIXTURES.filter(function (f) { return f.near; })[0];

var TAG_CORRIDOR = 'THE CORRIDOR|Where the eight-tab bar stood. body / vitals / deeds / iron / calendar / compendium / chronicle / almanac were four button clusters over 29 stacked panels; here they are eight fixtures along one hall you walk.';
var TAG_LOOM = 'THE NAME IS THE BUILDING|No plate floats. Each name is on a brass plaque set into the stone sill the fixture stands on &mdash; one course, one height, running the length of the hall. The gold tap-box is the drill yard&rsquo;s own idiom: the thing you are about to handle lights up.';
var TAG_DEPTH = 'THE HALL IS A BUILDING|Boards recede, each bay carries a lit clerestory, and lamplight pools on the floor between fixtures. Depth is what makes it a place rather than a strip of icons.';
var TAG_MAUD_QUIET = 'MAUD, HUNG AT THE DOOR|A 32px bust in the near corner, over open floor, cutting no arch and no window. Untapped she is silent.';
var TAG_OPENED = 'THE RECORD, OPENED|Step into a fixture and its record unrolls below the hall &mdash; the corridor never leaves the screen.';
var TAG_FOLD = 'THE FOLD|Under 760px the corridor stops scrolling sideways and stands up: the same eight fixtures, in the same order, in the two-column grid the app already uses at phone widths &mdash; a vertical hall you walk downward.';

function corridorHtml() {
  var shafts = '', pools = '', lamps = '', fx = '';
  for (var i = 0; i < 8; i++) {
    var cx = FX_X0 + i * BAY;
    shafts += '<div class="shaft" style="left:' + (cx + 24) + 'px"></div>';
    pools += '<div class="pool" style="left:' + (cx - 29) + 'px"></div>';
    /* torches hang on the piers between bays — never half-off the frame edge */
    if (i > 0) {
      lamps += '<div class="lamp" style="left:' + (cx - 14) + 'px"><div class="lampglow"></div>'
        + IV.spriteTag('hall_lamp', 24) + '</div>';
    }
    var f = FIXTURES[i];
    var tag = f.near ? ' data-seam="LOOM" data-tag="' + TAG_LOOM + '"' : '';
    fx += '<div class="fixture spot tappable' + (f.near ? ' near' : '') + '"'
      + ' style="--x:' + cx + 'px"' + tag + '>'
      + '<div class="fx-niche" data-fill="niche">'
      + IV.spriteTag(f.key, 96)
      + (f.near
        ? '<div class="tap-box"></div>'
          + '<i class="glint" style="left:6px;top:14px"></i>'
          + '<i class="glint" style="right:6px;top:14px"></i>'
        : '')
      + '</div>'
      + '<span class="fx-plate">' + f.name + '</span>'
      + '</div>';
  }
  var walkerX = FX_X0 + 4 * BAY + 22;
  return '<div class="corridor" data-seam="CORRIDOR" data-tag="' + TAG_CORRIDOR + '">'
    + '<button class="board-glyph glyph-maud" title="ask Maud"'
    + ' data-seam="MAUD" data-tag="' + TAG_MAUD_QUIET + '">'
    + IV.spriteTag('maud', 32) + '<span class="g-cap">MAUD</span></button>'
    + '<div class="corr-scroll"><div class="corr-run">'
    + '<div class="c-vault" data-fill="vault"></div>'
    + '<div class="c-wall" data-fill="wall"></div>'
    + '<div class="c-floor" data-fill="floor" data-seam="DEPTH" data-tag="' + TAG_DEPTH + '"></div>'
    + '<div class="c-sky"></div>'
    + shafts + pools + lamps
    + '<div class="c-sill" data-fill="sill"></div>'
    + '<div class="fx-row">' + fx
    + '<div class="walker" style="--x:' + walkerX + 'px">'
    + IV.spriteTag('walker', 56, 'wfig')
    + IV.spriteTag('walker_shadow', 60, 'wshadow')
    + '</div>'
    + '<div class="corr-end"><div class="archway"></div></div>'
    + '</div>'
    + '<div class="corr-fade"></div>'
    + '</div></div>'
    + '<div class="corr-hint" data-seam="FOLD" data-tag="' + TAG_FOLD + '">'
    + '<span><b>' + NEAR_FX.name + '</b> &middot; ' + NEAR_FX.sub + ' &mdash; you are walking up to it</span>'
    + '<span>eight rooms, one floor &mdash; the hall runs on, <b>walk right</b></span>'
    + '</div>'
    + '</div>';
}

function desktopScene() {
  return '<div class="app-pad">'
    + IV.header({ phone: false })
    + corridorHtml()
    + '<div class="stage-caption wide" data-seam="OPENED" data-tag="' + TAG_OPENED + '"><span class="cap">'
    + 'You stepped into <b>the loom</b>, and the year of stitches unrolled below it. '
    + 'The hall is still up there, with the lamp still lit over the arch you walked through.'
    + '</span></div>'
    + tapestryWinHtml(false)
    + '<div class="rec-cols">' + calendarHtml(false) + dayWinHtml() + '</div>'
    + IV.footer()
    + '</div>';
}

/* =============================================================================
   4. THE PHONE — the loom opened. The reading surface is the real thing.
   ========================================================================== */
var TAG_STANDING = 'WHERE YOU STAND|The fixture stays on screen above the panel, cropped and dimmed by the lamplight falling off. You never lose the room: this is the loom, seen from in front of it.';
var TAG_SURFACE = 'THE READING SURFACE|A plain .win panel &mdash; the Tapestry canvas, its legend and its counts, exactly as hall.js draws them today. The fixture is the door, not the record.';

  var cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']

    var acts = AUG_DAYS[day] || [];
    var dots = acts.map(function (a) { return '<span class="cdot cat-' + a + '"></span>'; }).join('');
    var q = AUG_QUESTS[day];
    cells += '<div class="calday' + (day === 6 ? ' today' : '') + '">'
      + '<span class="dn">' + day + '</span>'
      + (q ? '<span class="qmark">&#9733;' + (q > 1 ? q : '') + '</span>' : '')

function phoneScene() {

/* ---- hydrate: harness first, then the scene's own backdrops and canvases --- */
IV.boot();

(function paintBackdrops() {
  var VAULT = vaultTile(), WALL = wallTile(), NICHE = nicheURL();
  var apply = function (sel, url, size) {
    document.querySelectorAll(sel).forEach(function (el) {
      el.style.backgroundImage = url;
      if (size) el.style.backgroundSize = size;
    });
  };
  apply('[data-fill="vault"]', VAULT, BAY + 'px 70px');
  apply('[data-fill="wall"]', WALL, '64px 32px');
  apply('[data-fill="niche"]', NICHE, NICHE_W + 'px 124px');
  apply('[data-fill="sill"]', sillTile(SILL_H), BAY + 'px ' + SILL_H + 'px');
  apply('[data-fill="sill-tall"]', sillTile(34), BAY + 'px 34px');
  /* the floor is generated at the exact height of the band it fills, so its
     perspective series lands on the near edge instead of tiling or stretching */
  document.querySelectorAll('[data-fill="floor"]').forEach(function (el) {
    var fh = el.offsetHeight || 150;   /* offsetHeight ignores the desktop fit-scale */
    el.style.backgroundImage = floorStrip(fh);
    el.style.backgroundSize = BAY + 'px ' + fh + 'px';
  });
})();

/* ---- the Tapestry, drawn the way static/js/hall.js draws it ---------------- */
(function drawTapestry() {
  var CELL = 12, GAP = 2, TOP = 18, LEFT = 26, step = CELL + GAP;
  var COLORS = { run: '#7ab55c', ride: '#6aa0c8', climb: '#e07030', strength: '#c85050',
    mobility: '#a06ac8', walk: '#5cb5a5', swim: '#4a90d0', other: '#9a9aa8' };
  var CATS = Object.keys(COLORS);
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var n = 371, days = [];
  for (var i = 0; i < n; i++) {
    var k = (i * 7 + ((i * i) % 13) + Math.floor(i / 9)) % 17;
    days.push(k < 11 ? CATS[(i * 5 + Math.floor(i / 7)) % 8] : null);
  }
  var weeks = Math.ceil(n / 7);
  /* the run ends on 6 Aug 2026, so month labels count backwards from there */
  var end = new Date(Date.UTC(2026, 7, 6));
  document.querySelectorAll('canvas.tapestry-cv').forEach(function (cv) {
    cv.width = LEFT + weeks * step + 6;
    cv.height = TOP + 7 * step + 6;
    cv.style.width = cv.width + 'px';
    cv.style.height = cv.height + 'px';
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#0c0c14'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = '10px quanta-strike-10, monospace';
    ctx.fillStyle = '#8079a0';
    [['M', 0], ['W', 2], ['F', 4]].forEach(function (p) {
      ctx.fillText(p[0], 8, TOP + p[1] * step + CELL - 2);
    });
    days.forEach(function (cat, i) {
      var col = Math.floor(i / 7), row = i % 7;
      var x = LEFT + col * step, y = TOP + row * step;
      var d = new Date(end.getTime() - (n - 1 - i) * 86400000);
      if (d.getUTCDate() === 1) {
        ctx.fillStyle = '#958ca8';
        ctx.fillText(MONTHS[d.getUTCMonth()], x, TOP - 6);
      }
      ctx.fillStyle = cat ? COLORS[cat] : '#191928';
      ctx.fillRect(x, y, CELL, CELL);
      if (i === n - 1) {
        ctx.strokeStyle = '#f0d080';
        ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
      }
    });
  });
  /* newest stitches in view first */
  document.querySelectorAll('.tapestry-scroll').forEach(function (wrap) {
    wrap.scrollLeft = wrap.scrollWidth;
  });
})();

IV.layout();
setTimeout(IV.layout, 250);
