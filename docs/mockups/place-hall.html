<title>Iron Vale — the Hall of Records, a scene</title>
<!-- Design mockup for the Hall of Records (static/js/hall.js). Nothing is wired
     up: no fetches, no state, no app code. The eight-tab bar and its 29 stacked
     .win panels are re-staged as a corridor of fixtures you walk. All chrome,
     fonts, tokens and sprite plumbing come from _harness.js. -->
<script src="_harness.js"></script>
<body>
<script>
IV.injectStyles();

/* =============================================================================
   0. SPRITE CONSTRUCTION HELPERS
   Every fixture is authored 32 pixels wide. Rows are built by centring a core
   string inside that width so no row can drift out of alignment by a character.
   ========================================================================== */
var W = 32;
function R(n, ch) { return (ch || '.').repeat(Math.max(0, n)); }
function C(w, core, fill) {
  fill = fill || '.';
  if (core.length >= w) return core.slice(0, w);
  var pad = w - core.length, l = Math.floor(pad / 2);
  return fill.repeat(l) + core + fill.repeat(pad - l);
}

/* ---- 1. THE CASE (body) — a standing figure under glass on a stone plinth --- */
function glassRow(core) { return C(W, 'b' + C(18, core, 'G') + 'b'); }
var fx_case = {
  p: { b: '#8a6a40', B: '#c9a24b', G: '#1e2634', H: '#37485e', h: '#6a4428', f: '#e0b088',
       k: '#141018', t: '#4a6a9a', T: '#38547e', l: '#5a4028', s: '#5a5a68', S: '#7a7a88', d: '#2c2c36' },
  r: [
    C(W, ''),
    C(W, 'b' + R(18, 'B') + 'b'),
    glassRow(''), glassRow(''),
    glassRow('hhhh'),
    glassRow('hffffh'),
    glassRow('hkffkh'),
    glassRow('ffff'),
    glassRow('tttttttt'),
    glassRow('tTTTTTTTTt'),
    glassRow('tTTTTTTTTt'),
    glassRow('tTTTTTTTTt'),
    glassRow('TTTTTTTT'),
    glassRow('TTTTTT'),
    glassRow('llllll'),
    glassRow('ll' + R(2, 'G') + 'll'),
    glassRow('ll' + R(2, 'G') + 'll'),
    glassRow('kk' + R(2, 'G') + 'kk'),
    glassRow(''),
    C(W, 'b' + R(18, 'B') + 'b'),
    C(W, R(24, 'S')), C(W, R(24, 's')), C(W, R(24, 's')),
    C(W, R(26, 'S')), C(W, R(26, 's')), C(W, R(26, 'd')),
  ],
};

/* ---- 2. THE CHART WALL (vitals) — six framed plates hung on two rails ------ */
function chartPlate(vals, ch) {
  var rows = [];
  for (var y = 0; y < 8; y++) {
    var s = '';
    for (var x = 0; x < 8; x++) s += (vals[x] === y ? ch : 'p');
    rows.push('b' + s + 'b');
  }
  return rows;
}
var pA = chartPlate([5, 4, 5, 3, 4, 2, 3, 2], 'g');
var pB = chartPlate([2, 3, 2, 4, 3, 5, 4, 5], 'r');
var pC = chartPlate([4, 4, 3, 3, 2, 3, 2, 1], 'u');
var pD = chartPlate([6, 5, 5, 4, 3, 3, 2, 2], 'y');
var pE = chartPlate([3, 3, 4, 4, 4, 5, 5, 5], 'v');
var pF = chartPlate([3, 5, 2, 4, 3, 4, 2, 3], 'u');
var fx_chartwall = (function () {
  var p = { b: '#8a6a40', p: '#e8e0cc', g: '#7ab55c', r: '#c85050', u: '#6aa0c8',
            y: '#f0d080', v: '#a06ac8', w: '#5a4428' };
  var r = [C(W, R(30, 'w')), C(W, R(30, 'b'))];
  for (var y = 0; y < 8; y++) r.push(C(W, pA[y] + pB[y] + pC[y]));
  r.push(C(W, R(30, 'b')));
  r.push(C(W, ''));
  r.push(C(W, R(30, 'w')));
  r.push(C(W, R(30, 'b')));
  for (var y2 = 0; y2 < 8; y2++) r.push(C(W, pD[y2] + pE[y2] + pF[y2]));
  r.push(C(W, R(30, 'b')));
  return { p: p, r: r };
})();

/* ---- 3. THE MAP TABLE (deeds) — the Long Road unrolled on a trestle -------- */
var fx_maptable = (function () {
  var p = { W: '#8a6a40', w: '#6a4e2c', d: '#4a3419', p: '#d8cca4', q: '#c4b48c',
            r: '#8a6034', n: '#5c3f1c', y: '#f0d080', k: '#2a1a10' };
  var r = [C(W, ''), C(W, R(28, 'W'))];
  for (var y = 0; y < 10; y++) {
    var s = '';
    for (var x = 0; x < 26; x++) {
      var ry = Math.round(4.5 + 3.2 * Math.sin((x + 1) / 3.4));
      var ch = ((x + y) % 7 === 3) ? 'q' : 'p';
      if (y === ry + 1) ch = 'n';
      if (y === ry) ch = (x % 6 === 2) ? 'y' : 'r';
      s += ch;
    }
    r.push(C(W, 'W' + s + 'W'));
  }
  r.push(C(W, R(28, 'w')));
  r.push(C(W, R(28, 'd')));
  for (var i = 0; i < 6; i++) r.push(C(W, 'ww' + R(24) + 'ww'));
  r.push(C(W, R(28, 'd')));
  return { p: p, r: r };
})();

/* ---- 4. THE IRON RACK (iron) — plates on pegs, the ledger on the top shelf -- */
var fx_ironrack = (function () {
  var p = { i: '#8a8a9a', I: '#b0b0c0', m: '#3a3a46', k: '#1a1a24', W: '#8a6a40',
            w: '#6a4e2c', p: '#e8e0cc', q: '#cfc4a6', R: '#8a3020' };
  var disc10 = ['..IIIIII..', '.IIiiiiII.', 'IIiimmiiII', 'IIiimmiiII', '.IIiiiiII.', '..IIIIII..'];
  var disc8 = ['..IIII..', '.IiiiiI.', 'IiimmiiI', 'IiimmiiI', '.IiiiiI.', '..IIII..'];
  var book = ['..RRRRRRRRR.', '.RppppppppR.', '.RqqqqqqqqR.', '.RppppppppR.', '.RRRRRRRRRR.'];
  var rack = function (core) { return C(W, 'w' + C(26, core, '.') + 'w'); };
  var plank = C(W, 'w' + R(26, 'W') + 'w');
  var r = [C(W, '')];
  book.forEach(function (b) { r.push(C(W, b)); });
  r.push(plank); r.push(C(W, 'w' + R(26, 'w') + 'w'));
  for (var y = 0; y < 6; y++) r.push(rack(disc10[y] + '..' + disc10[y]));
  r.push(plank); r.push(C(W, 'w' + R(26, 'w') + 'w'));
  for (var y2 = 0; y2 < 6; y2++) r.push(rack(disc8[y2] + '.' + disc8[y2] + '.' + disc8[y2]));
  r.push(plank);
  r.push(C(W, R(28, 'k')));
  return { p: p, r: r };
})();

/* ---- 5. THE LOOM (calendar) — warp threads above a year of woven stitches --- */
var fx_loom = (function () {
  var p = { W: '#8a6a40', w: '#6a4e2c', d: '#4a3419', n: '#55506a', e: '#191928',
            g: '#7ab55c', u: '#6aa0c8', c: '#e07030', s: '#c85050',
            m: '#a06ac8', a: '#5cb5a5', z: '#4a90d0', o: '#9a9aa8' };
  var CATS = 'guscmazo';
  var r = [C(W, R(28, 'W')), C(W, R(28, 'd'))];
  var warp = '';
  for (var t = 0; t < 12; t++) warp += 'n.';
  for (var y = 0; y < 7; y++) r.push(C(W, 'W' + warp + 'W'));
  for (var cy = 0; cy < 9; cy++) {
    var s = '';
    for (var x = 0; x < 24; x++) {
      var k = (x * 5 + cy * 3 + ((x * x + cy) % 4)) % 11;
      s += (k < 7) ? CATS[(x + cy * 3) % 8] : 'e';
    }
    r.push(C(W, 'W' + s + 'W'));
  }
  r.push(C(W, R(28, 'W')));
  r.push(C(W, R(28, 'd')));
  for (var l = 0; l < 5; l++) r.push(C(W, 'ww' + R(24) + 'ww'));
  r.push(C(W, R(28, 'd')));
  return { p: p, r: r };
})();

/* ---- 6. THE SHELF (compendium) — three shelves of bound volumes ------------ */
var fx_shelf = (function () {
  var p = { w: '#6a4e2c', W: '#8a6a40', d: '#4a3419',
            r: '#8a3020', g: '#3e6234', u: '#3a5a8a', v: '#6a3a8a',
            y: '#a8802c', t: '#2a5a5a', o: '#a04828' };
  var SP = 'rguvyto';
  function shelfRows(seed, hgt) {
    var cols = [], i = seed, x = 0;
    while (x < 28) {
      var c = SP[(i * 3 + seed) % SP.length];
      var wid = 2 + ((i * 5) % 2);
      var top = (i * 5) % 3;
      for (var j = 0; j < wid && x < 28; j++, x++) cols.push({ c: c, top: top });
      if ((i % 4) === 2 && x < 28) { cols.push({ c: null, top: 0 }); x++; }
      i++;
    }
    var rows = [];
    for (var y = 0; y < hgt; y++) {
      var s = '';
      for (var x2 = 0; x2 < 28; x2++) {
        var cc = cols[x2];
        s += (!cc || !cc.c || y < cc.top) ? '.' : cc.c;
      }
      rows.push('w' + s + 'w');
    }
    return rows;
  }
  var plank = C(W, R(30, 'W'));
  var r = [plank, C(W, R(30, 'd'))];
  [1, 5, 9].forEach(function (seed) {
    shelfRows(seed, 7).forEach(function (row) { r.push(C(W, row)); });
    r.push(plank);
  });
  r.push(C(W, R(30, 'd')));
  return { p: p, r: r };
})();

/* ---- 7. THE LECTERN (almanac) — this moon's edition, open ------------------ */
var fx_lectern = {
  p: { p: '#e8e0cc', q: '#d0c6a8', k: '#2a2018', W: '#8a6a40', w: '#6a4e2c', d: '#4a3419' },
  r: [
    C(W, ''),
    C(W, R(6, 'p') + 'kk' + R(6, 'p')),
    C(W, R(8, 'p') + 'kk' + R(8, 'p')),
    C(W, 'p' + R(3, 'k') + 'pp' + R(3, 'k') + 'p' + 'kk' + 'p' + R(3, 'k') + 'pp' + R(3, 'k') + 'p'),
    C(W, R(11, 'p') + 'kk' + R(11, 'p')),
    C(W, 'pp' + R(4, 'k') + 'pp' + R(3, 'k') + 'p' + 'kk' + 'p' + R(3, 'k') + 'pp' + R(4, 'k') + 'pp'),
    C(W, R(13, 'W') + 'kk' + R(13, 'W')),
    C(W, R(28, 'w')),
    C(W, R(28, 'd')),
    C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'),
    C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'), C(W, 'wWWWWw'),
    C(W, R(12, 'W')),
    C(W, R(18, 'w')),
    C(W, R(22, 'W')),
    C(W, R(22, 'd')),
  ],
};

/* ---- 8. THE SCROLL (chronicle) — spooling from the wall into a basket ------ */
var fx_scroll = (function () {
  var p = { S: '#7a7a88', s: '#5a5a68', k: '#14141c', p: '#e8e0cc', q: '#cfc4a6',
            W: '#8a6a40', w: '#6a4e2c', d: '#4a3419' };
  var r = [
    C(W, R(22, 'S')),
    C(W, 'S' + R(20, 's') + 'S'),
    C(W, 'S' + R(4, 's') + R(12, 'k') + R(4, 's') + 'S'),
    C(W, R(22, 's')),
  ];
  for (var y = 0; y < 16; y++) {
    var off = Math.round(2.2 * Math.sin(y / 3.0));
    var s = '';
    for (var x = 0; x < 26; x++) {
      var rel = x - (7 + off);
      if (rel >= 0 && rel < 12) s += (y % 3 === 1 && rel > 1 && rel < 11) ? 'q' : 'p';
      else s += '.';
    }
    r.push(C(W, s));
  }
  r.push(C(W, R(20, 'q')));
  r.push(C(W, R(22, 'd')));
  for (var b = 0; b < 5; b++) {
    var bs = '';
    for (var bx = 0; bx < 22; bx++) bs += ((bx + b) % 2 === 0) ? 'W' : 'w';
    r.push(C(W, bs));
  }
  r.push(C(W, R(22, 'd')));
  return { p: p, r: r };
})();

/* ---- corner-glyph + prop sprites ------------------------------------------ */
var glyph_arch = {
  p: { S: '#a8a8bc', s: '#6a6a80', d: '#2e2a44', f: '#8a6a3a', y: '#f0d080' },
  r: [
    '............', '....SSSS....', '..SSssssSS..', '.SSssddssSS.',
    '.SsddddddsS.', '.SsddddddsS.', '.SsddyyddsS.', '.SsddyyddsS.',
    '.SsddddddsS.', '.SsffffffsS.', '.SsffffffsS.', '.SSSSSSSSSS.',
  ],
};
var hall_lamp = {
  p: { m: '#3a3a46', i: '#8a8a9a', o: '#e07030', y: '#f0d060', w: '#fff0c0' },
  r: [
    '........', '..oyyo..', '.oywwyo.', '.oywwyo.', '..oyyo..',
    '..iiii..', '..iiii..', '...ii...', '..mmmm..', '...mm...',
  ],
};
/* Maud, the Curator — an owl in spectacles, lifted verbatim from static/js/pixel.js */
var maud = {
  p: { b: '#6a4e2c', B: '#8a6a40', w: '#e8e0d0', k: '#1a1410', y: '#e0a030', g: '#c9a24b', f: '#c8a878' },
  r: [
    '................', '..bb........bb..', '..bbb......bbb..', '...bbbbbbbbbb...',
    '..bBBBBBBBBBBb..', '..bBgggBBgggBb..', '..bgwwwgBgwwwgb.', '..bgwkwgggwkwgb.',
    '..bgwwwgBgwwwgb.', '..bBgggByBgggBb.', '..bBBBByyyBBBb..', '..bBfBBByBBfBb..',
    '...bffBBBBBff...', '...bBBBBBBBBb...', '....bb.bb.bb....', '................',
  ],
};

var SCENE_SPRITES = {
  fx_case: fx_case, fx_chartwall: fx_chartwall, fx_maptable: fx_maptable,
  fx_ironrack: fx_ironrack, fx_loom: fx_loom, fx_shelf: fx_shelf,
  fx_lectern: fx_lectern, fx_scroll: fx_scroll,
  glyph_arch: glyph_arch, hall_lamp: hall_lamp, maud: maud,
};
/* self-check: a ragged row would silently shift pixels, so shout about it */
Object.keys(SCENE_SPRITES).forEach(function (k) {
  var rows = SCENE_SPRITES[k].r, w = rows[0].length;
  rows.forEach(function (row, i) {
    if (row.length !== w) console.error('SPRITE ROW MISMATCH', k, 'row', i, row.length, 'expected', w);
  });
});
IV.addSprites(SCENE_SPRITES);

/* =============================================================================

   ========================================================================== */
var SCENE_CSS = `

/* =============================================================================
   2. PROCEDURAL BACKDROPS — the corridor's vault, wall and receding floor.
   ========================================================================== */
var BAY = 112;   /* one bay of the hall: also the fixture pitch */

function vaultTile() {
  return IV.tileURL(BAY, 74, function (ctx, w, h) {
    ctx.fillStyle = '#0c0c16'; ctx.fillRect(0, 0, w, h);
    for (var x = 0; x < w; x++) {
      var t = x / w;
      var arc = Math.round(60 - 42 * Math.sin(Math.PI * t));
      ctx.fillStyle = '#15151f'; ctx.fillRect(x, arc, 1, h - arc);
      ctx.fillStyle = '#2e2e46'; ctx.fillRect(x, arc, 1, 2);
    }
    /* the clerestory lancet at the crown of each bay */
    var wx = Math.round(w / 2) - 8, wy = 22;
    ctx.fillStyle = '#2a2a3e'; ctx.fillRect(wx - 2, wy - 2, 20, 30);
    ctx.fillStyle = '#4a6088'; ctx.fillRect(wx, wy, 16, 26);
    ctx.fillStyle = '#7a94bc'; ctx.fillRect(wx + 1, wy + 1, 6, 11);
    ctx.fillStyle = '#9fb6d8'; ctx.fillRect(wx + 9, wy + 14, 5, 9);
    ctx.fillStyle = '#232336'; ctx.fillRect(wx + 7, wy, 2, 26); ctx.fillRect(wx, wy + 12, 16, 2);
    /* the piers the vault springs from, at both bay edges */
    ctx.fillStyle = '#26263a'; ctx.fillRect(0, 0, 3, h); ctx.fillRect(w - 3, 0, 3, h);
    ctx.fillStyle = '#3a3a54'; ctx.fillRect(1, 0, 1, h); ctx.fillRect(w - 2, 0, 1, h);
  });
}

function wallTile() {
  return IV.tileURL(64, 32, function (ctx, w, h) {
    ctx.fillStyle = '#171722'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#0f0f18';
    ctx.fillRect(0, 14, w, 2); ctx.fillRect(0, 30, w, 2);
    ctx.fillRect(30, 0, 2, 15); ctx.fillRect(0, 16, 2, 15); ctx.fillRect(62, 16, 2, 15);
    ctx.fillStyle = '#202030';
    ctx.fillRect(2, 1, 27, 12); ctx.fillRect(33, 1, 28, 12);
    ctx.fillRect(3, 17, 26, 12); ctx.fillRect(31, 17, 30, 12);
    ctx.fillStyle = '#282840';
    ctx.fillRect(2, 1, 27, 1); ctx.fillRect(33, 1, 28, 1);
    ctx.fillRect(3, 17, 26, 1); ctx.fillRect(31, 17, 30, 1);
  });
}

/* boards running along the hall, seen from a step up: the bands compress as the
   floor recedes, which is the whole depth cue */
function floorStrip(H) {
  return IV.tileURL(BAY, H, function (ctx, w, h) {
    var bands = [], y = 0, gap = 2.2;
    while (y < h) { bands.push(Math.round(y)); y += gap; gap *= 1.235; }
    bands.push(h);
    for (var i = 0; i < bands.length - 1; i++) {
      var y0 = bands[i], y1 = bands[i + 1];
      var t = 0.10 + 0.82 * (i / (bands.length - 2));
      ctx.fillStyle = IV.blendHex('#5c4123', '#221810', t);
      ctx.fillRect(0, y0, w, y1 - y0);
      /* the seam between two boards, and a faint highlight on the near face */
      ctx.fillStyle = '#150e07';
      ctx.fillRect(0, y1 - 1, w, 1);
      if (y1 - y0 > 5) {
        ctx.fillStyle = IV.blendHex('#6d5030', '#2a1e12', t);
        ctx.fillRect(0, y0, w, 1);
      }
      /* boards are long: at most one end-joint per bay, and only now and then */
      if (i % 3 === 1) {
        ctx.fillStyle = '#1d1409';
        ctx.fillRect(Math.round(((i % 2) ? 0.62 : 0.23) * w), y0, 1, Math.max(1, y1 - y0 - 1));
      }
    }
  });
}

/* a shallow arched niche cut into the wall — one room per fixture */
function nicheURL() {
  return IV.tileURL(104, 124, function (ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    var r = w / 2;
    for (var y = 0; y < h; y++) {
      var x0 = 0, x1 = w;
      if (y < r) {
        var dx = Math.sqrt(Math.max(0, r * r - (r - y) * (r - y)));
        x0 = Math.round(r - dx); x1 = Math.round(r + dx);
      }
      if (x1 - x0 < 4) continue;
      var shade = IV.blendHex('#1c1c2c', '#101018', y / h);
      ctx.fillStyle = shade; ctx.fillRect(x0, y, x1 - x0, 1);
      ctx.fillStyle = '#33334c'; ctx.fillRect(x0, y, 2, 1); ctx.fillRect(x1 - 2, y, 2, 1);
    }
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, h - 3, w, 3);
  });
}

    });
  };
  apply('[data-fill="vault"]', VAULT, BAY + 'px 74px');
  apply('[data-fill="wall"]', WALL, '64px 32px');
  apply('[data-fill="niche"]', NICHE, '104px 124px');
  /* the floor is generated at the exact height of the band it fills, so its
     perspective series lands on the near edge instead of tiling or stretching */
  document.querySelectorAll('[data-fill="floor"]').forEach(function (el) {
    var fh = el.offsetHeight || 150;   /* offsetHeight ignores the desktop fit-scale */
    el.style.backgroundImage = floorStrip(fh);
    el.style.backgroundSize = BAY + 'px ' + fh + 'px';
  });
})();

/* ---- the Tapestry, drawn the way static/js/hall.js draws it ---------------- */
(function drawTapestry() {
  var cv = document.getElementById('tapestry-cv');
  if (!cv) return;
  var CELL = 12, GAP = 2, TOP = 18, LEFT = 26, step = CELL + GAP;
  var COLORS = { run: '#7ab55c', ride: '#6aa0c8', climb: '#e07030', strength: '#c85050',
    mobility: '#a06ac8', walk: '#5cb5a5', swim: '#4a90d0', other: '#9a9aa8' };
  var CATS = Object.keys(COLORS);
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var n = 371, days = [];
  for (var i = 0; i < n; i++) {
    var k = (i * 7 + ((i * i) % 13) + Math.floor(i / 9)) % 17;
    days.push(k < 11 ? CATS[(i * 5 + Math.floor(i / 7)) % 8] : null);
  }
  var weeks = Math.ceil(n / 7);
  cv.width = LEFT + weeks * step + 6;
  cv.height = TOP + 7 * step + 6;
  cv.style.width = cv.width + 'px';
  cv.style.height = cv.height + 'px';
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#0c0c14'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = '10px quanta-strike-10, monospace';
  ctx.fillStyle = '#55506a';
  [['M', 0], ['W', 2], ['F', 4]].forEach(function (p) {
    ctx.fillText(p[0], 8, TOP + p[1] * step + CELL - 2);
  });
  /* the run ends on 6 Aug 2026, so month labels count backwards from there */
  var end = new Date(Date.UTC(2026, 7, 6));
  days.forEach(function (cat, i) {
    var col = Math.floor(i / 7), row = i % 7;
    var x = LEFT + col * step, y = TOP + row * step;
    var d = new Date(end.getTime() - (n - 1 - i) * 86400000);
    if (d.getUTCDate() === 1) {
      ctx.fillStyle = '#776f8e';
      ctx.fillText(MONTHS[d.getUTCMonth()], x, TOP - 6);
    }
    ctx.fillStyle = cat ? COLORS[cat] : '#191928';
    ctx.fillRect(x, y, CELL, CELL);
    if (i === n - 1) {
      ctx.strokeStyle = '#f0d080';
      ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
    }
  });
  var wrap = document.getElementById('tapestry-scroll');
  if (wrap) wrap.scrollLeft = cv.width;   /* newest stitches in view first */
})();

IV.layout();
setTimeout(IV.layout, 250);
</script>
