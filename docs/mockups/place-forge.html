<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Vale — Grunhilda's forge, the anvil</title>
<!-- Design mockup. Nothing here is wired up; it is drawing paper for the
     strength giver (static/js/giver.js SCREENS.giver, giver=strength), built
     on docs/mockups/_harness.js.

     THE LEDGER FORMULA, applied to the forge (Joe's decree — supersedes the
     old wide-room pass):
       1. up-close, not establishing — frame the anvil, not the smithy
       2. everything in frame displays state or does work
       3. the menu drives; the scene stages — billets are no longer buttons
       4. animation decorates a state change, never gates one
       5. NPC portraits are first-class: Joe's 32x32 portrait + typewriter
          dialogue (the app's npc-head idiom), no tap-to-speak corner busts
       6. one clickable thing, navigational only: the Drill Yard door edge
       7. materials: iron / oak / stone / canvas, dark subtle fills; gold
          stays for the touchable/earned

     The grun_portrait char map below is a stand-in transcribed from Joe's
     hand-drawn static/art/npcs/grunhilda/grunhilda_portrait.png (32x32) —
     the real PNG cannot be inlined in a mockup, so it is approximated in the
     harness char-map shape at the same size and palette. -->
<script src="_harness.js"></script>
<style id="scene-css">
/* ================= THE FORGE, UP CLOSE — one work surface =================
   One projection: you are standing across the anvil from her. Dark stone
   behind, sooty ground under the stump, the coal light from the hearth mouth
   at the left edge is the only warm light, so glows bloom left-of-center.
   No wall band, no window, no floor of props — the frame IS the crop. */
.iv .forge { position:relative; margin:12px 4px 4px; overflow:hidden;
  border:3px solid #3a3a46; box-shadow:inset 0 0 0 2px #14121a, 6px 6px 0 rgba(0,0,0,0.55);
  background-color:#16131a;
  background-image:
    radial-gradient(ellipse 60% 70% at 6% 88%, rgba(240,120,40,0.20), rgba(240,120,40,0) 70%),
    linear-gradient(180deg, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.10) 30%, rgba(0,0,0,0.05) 72%, rgba(0,0,0,0.45) 100%),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 34px, rgba(6,4,8,0.9) 34px 36px, rgba(90,90,104,0.10) 36px 37px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 57px, rgba(6,4,8,0.55) 57px 59px);
  image-rendering:pixelated; }
.iv .forge-stage { position:relative; height:372px; }
.iv-phone .forge-stage { height:250px; }
/* the sooty ground the stump stands on — a sliver, because we are close */
.iv .forge-ground { position:absolute; left:0; right:0; bottom:0; height:30px; z-index:0;
  background:linear-gradient(180deg,#241c14 0,#17110b 100%); border-top:2px solid #2e241a; }
.iv-phone .forge-ground { height:22px; }

/* coal light breathing out of the hearth mouth — the scene's one warm light */
.iv .coalglow { position:absolute; left:-40px; bottom:0; width:320px; height:190px; z-index:1;
  background:radial-gradient(ellipse at left bottom, rgba(240,120,40,0.38), rgba(240,120,40,0.08) 55%, rgba(240,120,40,0) 78%);
  pointer-events:none; animation:coalBreathe 2.6s ease-in-out infinite alternate; }
@keyframes coalBreathe { from { opacity:0.7; } to { opacity:1; } }

/* ---- the hearth mouth, cropped by the frame's left edge: stone arch, a bed
       of coals. It does work — it is where an abandoned billet goes back. */
.iv .hearth-mouth { position:absolute; left:-3px; bottom:28px; z-index:2; }
.iv .hearth-mouth .arch { position:relative; border:3px solid #4a4a56; border-left:none;
  background:#0d0a10; box-shadow:inset 0 0 0 2px #1e1e26;
  background-image:radial-gradient(ellipse 95% 80% at 35% 100%, rgba(240,120,40,0.55), rgba(200,70,20,0.14) 55%, rgba(0,0,0,0) 78%); }
.iv .hearth-mouth .coalbed { position:absolute; left:4px; right:4px; bottom:3px; line-height:0; }
.iv .hearth-mouth .coalbed canvas { filter:drop-shadow(0 0 7px rgba(240,140,50,0.8)); }
.iv .hearth-mouth .stone-cap { height:10px; border:2px solid #2a2a34; border-left:none;
  background:linear-gradient(180deg,#5a5a68,#3a3a46); }

/* ================= THE COOLING RACK — state display, never a gate =========
   Mounted just behind the anvil: two iron wall-straps, three rails between
   them, one billet per open oath lying where she left it. Heat = weight.
   None of it is tappable — the menu below chooses, and the rack answers. */
.iv .coolrack { position:absolute; z-index:2; }
.iv .cr-strap { position:absolute; top:0; bottom:0; width:10px; z-index:1;
  background:linear-gradient(90deg,#8a8a98 0 2px,#5a5a68 2px 6px,#2e2e38 6px 10px);
  box-shadow:2px 2px 0 rgba(0,0,0,0.5); }
.iv .cr-strap i { position:absolute; left:3px; width:4px; height:4px; background:#c6c6d2;
  box-shadow:0 0 0 1px #1a1a22; }
.iv .cr-strap.l { left:0; } .iv .cr-strap.r { right:0; }
.iv .cr-rail { position:absolute; left:8px; right:8px; height:11px; z-index:1;
  background:linear-gradient(180deg,#b0b0be 0 2px,#74747f 2px 4px,#43434e 4px 8px,#1e1e26 8px 11px);
  box-shadow:0 3px 0 rgba(0,0,0,0.55); }
/* the oath's name and its heat, scratched into the rail near the cold end */
.iv .cr-scratch { position:absolute; z-index:2; line-height:1.2; white-space:nowrap;
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:0.5px;
  color:#cfc6dd; text-shadow:1px 1px 0 rgba(0,0,0,0.95); }
.iv .cr-scratch small { color:#958ca8; }
.iv .cr-billet { position:absolute; z-index:3; line-height:0; }
.iv .cr-billet canvas { transform:rotate(var(--rot,0deg)); }
.iv .heat-white canvas { filter:drop-shadow(0 0 7px rgba(255,235,170,0.95)) drop-shadow(0 0 18px rgba(240,150,60,0.6)); }
.iv .heat-orange canvas { filter:drop-shadow(0 0 6px rgba(240,140,60,0.7)); }
.iv .heat-red canvas { filter:drop-shadow(0 0 5px rgba(190,60,30,0.55)); }
.iv .cr-billet.dim canvas { filter:drop-shadow(0 0 4px rgba(150,60,30,0.4)) brightness(0.8); }
/* the billet the MENU chose: lifted off its rail, brightest thing in frame */
.iv .cr-billet.lit { transform:translateY(-9px); }
.iv .cr-billet.lit canvas { filter:drop-shadow(0 0 9px rgba(255,242,190,1))
  drop-shadow(0 0 24px rgba(250,170,70,0.85)) drop-shadow(3px 6px 0 rgba(0,0,0,0.45)); }
.iv .cr-scratch.lit { color:var(--gold-bright); }

/* ================= THE ANVIL, and her hands at it ================= */
.iv .anvil-station { position:absolute; z-index:3; line-height:0; }
.iv .anvil-station .on-anvil { position:absolute; line-height:0; }
.iv .anvil-station .on-anvil canvas { filter:drop-shadow(0 0 7px rgba(230,110,50,0.85)); }
.iv .anvil-station .a-hammer { position:absolute; line-height:0;
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,0.55)); }
/* her tongs, leaned against the stump between fetches — butt on the ground,
   jaws tipped in against the wood, so they rest on something */
.iv .anvil-station .a-tongs { position:absolute; line-height:0;
  transform:rotate(-17deg); transform-origin:bottom right;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.5)); }
/* the sparks the last blow threw — decoration of a done thing, pixels only */
.iv .sparks { position:absolute; z-index:5; width:4px; height:4px; background:#fff4c8;
  box-shadow:10px -8px 0 #f0b040, -8px -12px 0 #e07030, 18px -18px 0 -1px #f0d060,
    -14px -4px 0 -1px #c04a1a, 4px -22px 0 -1px #f0b040;
  animation:sparkPop 1.3s steps(3) infinite; pointer-events:none; }
@keyframes sparkPop { 0% { opacity:1; transform:translateY(0); }
  60% { opacity:0.5; transform:translateY(-4px); } 100% { opacity:0; transform:translateY(-7px); } }

/* ---- the Drill Yard door, cropped by the frame's right edge. The ONE
       clickable thing inside the scene, and it only goes somewhere. ---- */
.iv .doorway { position:absolute; right:-3px; top:0; bottom:0; z-index:2; cursor:pointer; }
.iv .doorway .door-post { position:absolute; left:0; top:0; bottom:0; width:9px;
  background:linear-gradient(90deg,#241a0e 0 2px,#6a4e2c 2px 6px,#3c2c18 6px 9px); }
.iv .doorway .door-gap { position:absolute; left:9px; right:0; top:0; bottom:0;
  background:linear-gradient(90deg, rgba(240,190,110,0.10), rgba(240,190,110,0.30));
  border-left:2px solid #1a1208; }
.iv .doorway .door-plank { position:absolute; left:16px; right:0; top:0; bottom:0;
  background:repeating-linear-gradient(90deg,#3c2c18 0 8px,#32240f 8px 9px);
  box-shadow:inset 3px 0 0 rgba(0,0,0,0.5); }
.iv .doorway .door-plank .knob { position:absolute; left:8px; top:52%; width:6px; height:6px;
  background:#8a8a9a; box-shadow:0 0 0 1px #2a2a34; }
/* the yard is bright, and the light through the ajar edge says so */
.iv .doorway .door-light { position:absolute; left:9px; width:7px; top:0; bottom:0;
  background:linear-gradient(180deg,#f0d080,#e0a050);
  box-shadow:0 0 14px 5px rgba(240,190,110,0.5); }
.iv .doorway .door-lintel { position:absolute; top:10px; left:-12px; padding:2px 8px 3px;
  white-space:nowrap; transform:rotate(90deg); transform-origin:left bottom;
  background:linear-gradient(180deg,#7d5f36,#4a3620); border:2px solid #2a1d10;
  box-shadow:2px 3px 0 rgba(0,0,0,0.55), inset 0 1px 0 #a3814e;
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px;
  text-transform:uppercase; color:#ffeab4; text-shadow:1px 1px 0 #1c1208; }

/* the scene caption: state in words, standing on the ground sliver — kept
   right of the hearth mouth so the coals stay visible */
.iv .forge-cap { position:absolute; left:150px; bottom:5px; z-index:6; max-width:52%; }
.iv .forge-cap .cap { display:inline-block; background:rgba(20,14,10,0.92);
  border:1px solid #6a512a; border-top-color:#8a6a40; padding:4px 9px 5px; color:#cfc6b0;
  font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.35;
  box-shadow:0 4px 8px rgba(0,0,0,0.55); }
.iv .forge-cap .cap b { color:var(--gold-bright); font-weight:400; }
.iv-phone .forge-cap { left:82px; max-width:56%; }

/* ================= HER PORTRAIT + TYPEWRITER DIALOGUE =====================
   The app's own giver idiom (static/js/giver.js npc-head / static/style.css
   .dialog): the 32x32 hand-drawn portrait beside a black, gold-bordered
   typewriter box. Composed tight under the close-up so she is speaking from
   behind the anvil, not from a form. */
.iv .npchat { margin-top:10px; }
.iv .npc-head { display:flex; gap:14px; align-items:flex-start; }
.iv .npc-head canvas { flex-shrink:0; border:2px solid #4a3d20; background:#000; }
.iv .npc-dialog { flex:1; min-width:0; background:#000; border:2px solid var(--gold);
  padding:10px 12px; min-height:64px; font-family:var(--font-title); font-size:var(--type-title); }
.iv .npc-dialog .npc-name { color:var(--gold-bright); }
.iv .npc-dialog .dlg { margin-top:4px; color:var(--ink); line-height:1.4; }
.iv .npc-dialog .dlg .caret { display:inline-block; width:8px; height:13px; margin-left:2px;
  background:var(--gold-bright); vertical-align:-2px; animation:caretBlink 0.8s steps(1) infinite; }
@keyframes caretBlink { 50% { opacity:0; } }
.iv-phone .npc-head canvas { width:96px; height:96px; }

/* ================= THE OATH MENU — the driver ==============================
   A conventional .win panel, kept clean on purpose: border kits will
   re-dress menus later. Title, what it asks, pays, runs, a swear action per
   entry. Choosing here lights the matching billet on the rack above. */
.iv .oathmenu .menu-help { color:var(--dim-readable); font-family:var(--font-fine);
  font-size:var(--type-fine); margin:0 0 4px; }
.iv .oath-row { display:grid; grid-template-columns:16px minmax(0,1fr) auto; gap:4px 12px;
  align-items:center; padding:9px 8px; margin:8px 0; border:2px solid var(--edge);
  background:var(--panel2); }
.iv .oath-row.chosen { border-color:var(--gold-bright) #7a5f28 #52401c var(--gold);
  background:#1c1826; box-shadow:0 0 0 1px rgba(240,208,128,0.25); }
.iv .oath-row .heat-swatch { grid-row:1 / span 2; width:12px; height:44px; border:1px solid #1e1e26; }
.iv .oath-row .heat-swatch.sw-white { background:linear-gradient(180deg,#fffdf2,#f8b040 55%,#8a2c10); box-shadow:0 0 8px rgba(255,235,170,0.8); }
.iv .oath-row .heat-swatch.sw-orange { background:linear-gradient(180deg,#f4a03c,#a03c10 60%,#3c1004); box-shadow:0 0 6px rgba(240,140,60,0.5); }
.iv .oath-row .heat-swatch.sw-red { background:linear-gradient(180deg,#c8481a,#6a1c08 60%,#280c04); box-shadow:0 0 5px rgba(190,60,30,0.4); }
.iv .oath-row .o-head { min-width:0; }
.iv .oath-row .o-name { color:var(--gold-bright); font-family:var(--font-title); font-size:var(--type-title); }
.iv .oath-row .o-heat { display:block; color:var(--dim-readable); font-family:var(--font-fine);
  font-size:var(--type-fine); margin-top:1px; }
.iv .oath-row .o-terms { grid-column:2; min-width:0; }
.iv .oath-row .o-line { display:block; color:#c6bdd8; font-family:var(--font-fine);
  font-size:var(--type-fine); line-height:1.45; }
.iv .oath-row .o-line b { display:inline-block; min-width:34px; color:#a79dbe; font-weight:400;
  text-transform:uppercase; letter-spacing:0.5px; }
.iv .oath-row .o-line i { font-style:normal; color:var(--ink); }
.iv .oath-row .btn { grid-row:1 / span 2; grid-column:3; white-space:nowrap; }
.iv-phone .oath-row { grid-template-columns:16px minmax(0,1fr); }
.iv-phone .oath-row .btn { grid-row:auto; grid-column:2; justify-self:start; margin-top:4px; }
.iv .oathmenu .menu-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.iv .oathmenu .rk-foot { margin-top:8px; color:var(--dim); font-family:var(--font-fine); font-size:var(--type-fine); }
/* the sworn entry, post-strike: same row, now holding the oath's standing */
.iv .oath-row.sworn-row { border-color:#6a6a78 #2c2c34 #22222a #55555e; background:#1a1a24; }
.iv .oath-row .cooling { display:inline-block; margin-top:4px; padding:3px 7px;
  background:rgba(240,120,40,0.12); border:1px solid #8a5028; color:#f4b877;
  font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.35; }
</style>

    /* her hammer, head down and resting on the anvil face, her gloved fist
       still round the haft — her hand in frame; the menu decides */
    hammer_rest: { p: { k:'#1c1c24', i:'#5e5e6c', I:'#9a9aa8', L:'#c6c6d2',
                        w:'#7a5a30', W:'#a07c46', g:'#6a3e20', G:'#9a6238' }, r: [
      '..........................',
      '.kkkkk............gggggg..',
      'kLLLLLk..........gGGGGGGg.',
      'kIIIIIk..........gGGGGGGg.',
      'kIIIIIkwwwwwwwwwwGGGGGGGg.',
      'kIIIIIkWWWWWWWWWWgGGGGGGg.',
      'kiiiiik..........gGgGgGgg.',
      '.kkkkk............gggggg..',
    ]},
    /* the bed of coals in the hearth mouth, two lumps still alight */
    coalbed: { p: { k:'#141419', K:'#26262e', d:'#34343e', o:'#e07030', y:'#f0c060', r:'#c04a1a' }, r: [
      '....k....kk....k....kk....',
      '..kkKdkkokKdkkkKdkkykKkk..',
      '.kdkkkkyokkkkdkkkkrokkkdk.',
      'kKkkoykkkkdkkKkkoykkkdkKkk',
      'kkkkkkkkkkkkkkkkkkkkkkkkkk',
    ]},
  });

  /* ==========================================================================
     2. THE MARGIN NOTES
     ========================================================================== */

  var TAG_CROP = 'THE CLOSE-UP, NOT THE ROOM|'
    + 'The old pass built a smithy — wall, window, floor, five stations. Cut. The frame holds the '
    + 'work surface: anvil face, the rack behind it, her hands, one door edge. Everything in frame '
    + 'displays state or does work.';

  var TAG_RACK = 'THE RACK DISPLAYS, NEVER GATES|'
    + 'One billet per open oath, heat = weight, name scratched into the rail. No longer tappable: '
    + 'choosing happens in the menu below, and the rack answers by lifting the chosen billet into '
    + 'the light.';

  var TAG_MENU = 'THE MENU DRIVES; THE SCENE STAGES|'
    + 'Choosing and swearing live in a conventional .win panel — what it asks, pays, runs, one '
    + 'swear action per oath. Kept plain on purpose: border kits will re-dress menu chrome later. '
    + 'The chosen row is lit, and so is its billet on the rack.';

  var TAG_ANIM = 'ANIMATION DECORATES, NEVER GATES|'
    + 'On swearing in the menu, the billet leaps to the anvil and takes one blow — sparks and all — '
    + 'as decoration of an action the menu already completed. Shown here post-blow: struck iron '
    + 'cooling on the face.';

  var TAG_PORTRAIT = 'THE PORTRAIT IS THE TALKING SURFACE|'
    + 'Joe&rsquo;s hand-drawn 32&times;32 portrait beside a typewriter box &mdash; the app&rsquo;s '
    + 'own npc-head idiom (static/js/giver.js). No tap-to-speak corner bust anywhere. The portrait '
    + 'here is a char-map stand-in transcribed from grunhilda_portrait.png; the real PNG lands '
    + 'with Joe&rsquo;s art pass.';

  var TAG_DOOR = 'ONE CLICKABLE THING, NAVIGATIONAL ONLY|'
    + 'The Drill Yard door edge, ajar at the crop, yard light through the gap. The only tap target '
    + 'inside the scene — and all it does is go somewhere.';

  var TAG_ABANDON = 'ABANDON IS A MENU ACTION|'
    + 'Not a red pile, not a tappable prop: a plain action on the sworn oath&rsquo;s menu row. The '
    + 'scene decorates the result — her tongs return the billet to the coals at the frame&rsquo;s '
    + 'left edge.';

  /* ==========================================================================
     3. THE SCENE — the anvil close-up
     ========================================================================== */

  function doorEdge(w) {
    return `<div class="doorway" style="width:${w}px" data-seam="DOOR" data-tag="${TAG_DOOR}">
      <div class="door-gap"></div>
      <div class="door-light"></div>
      <div class="door-plank"><span class="knob"></span></div>
      <div class="door-post"></div>
      <div class="door-lintel">the drill yard &raquo;</div>
    </div>`;
  }

  function hearthMouth(w, h, coalPx) {
    return `<div class="hearth-mouth" style="width:${w}px">
      <div class="stone-cap"></div>
      <div class="arch" style="height:${h}px">
        <div class="coalbed">${IV.spriteTag('coalbed', coalPx)}</div>
      </div>
    </div>`;
  }

  function strap(side, bolts) {
    var dots = '';
    for (var i = 0; i < bolts; i++) dots += `<i style="top:${8 + i * 46}px"></i>`;
    return `<span class="cr-strap ${side}">${dots}</span>`;
  }

  /* one rail of the rack: the rail, the oath's name scratched near the cold
     end, and the billet lying across it. lit = the menu chose this one. */
  function rail(top, billetKey, heat, px, opt) {
    return `<div class="cr-rail" style="top:${top}px"></div>
      <span class="cr-scratch ${opt.lit ? 'lit' : ''}" style="left:${opt.sx}px;top:${top - 14}px">${opt.name}${
        opt.heat ? ` <small>&mdash; ${opt.heat}</small>` : ''}</span>
      <span class="cr-billet ${heat} ${opt.lit ? 'lit' : ''} ${opt.dim ? 'dim' : ''}"
        style="left:${opt.x}px;top:${top - px * 6 / 26 + 3}px;--rot:${opt.rot}">
        ${IV.spriteTag(billetKey, px)}
      </span>`;
  }

  /* --- the desktop close-up: CHOOSING. Nothing on the anvil yet; the menu's
         chosen row has lifted the white-hot billet off its rail. --------- */
  function forgeChoosing() {
    return `<div class="forge" data-seam="CROP" data-tag="${TAG_CROP}">
      <div class="forge-stage">
        <div class="forge-ground"></div>
        <div class="coalglow"></div>
        ${hearthMouth(128, 110, 112)}

        <div class="coolrack" style="left:60px;right:150px;top:16px;height:158px"
             data-seam="RACK" data-tag="${TAG_RACK}">
          ${strap('l', 3)}${strap('r', 3)}
          ${rail(46, 'billet_white', 'heat-white', 130,
                 { x:390, rot:'-2deg', sx:14, name:'The Iron Communion', heat:'white-hot, the heaviest, the briefest', lit:true })}
          ${rail(96, 'billet_orange', 'heat-orange', 130,
                 { x:70, rot:'1.5deg', sx:230, name:'The Patient Edge', heat:'orange, a middling weight' })}
          ${rail(146, 'billet_red', 'heat-red', 130,
                 { x:350, rot:'-1.5deg', sx:14, name:'The Long Anneal', heat:'dull red, the lightest, the longest' })}
        </div>

        <div class="anvil-station" style="left:50%;bottom:22px;transform:translateX(-52%)"
             data-seam="ANVIL" data-tag="${TAG_ANIM}">
          ${IV.spriteTag('anvil_big', 264)}
          <div class="a-hammer" style="left:76px;top:-16px">${IV.spriteTag('hammer_rest', 130)}</div>
          <div class="a-tongs" style="left:188px;bottom:0">${IV.spriteTag('tongs', 72)}</div>
        </div>

        ${doorEdge(96)}
        <div class="forge-cap"><span class="cap">Her anvil, and <b>three billets</b> cooling on the rack behind it
          &mdash; one per open oath, the hotter the heavier. The white-hot one is up because the menu below chose it.</span></div>
      </div>
    </div>`;
  }

  /* --- the phone close-up: SWORN. The white-hot billet has been struck and
         cools on the anvil face; two billets left dim on the rack. -------- */
  function forgeSworn() {
    return `<div class="forge" data-seam="CROP" data-tag="${TAG_CROP}">
      <div class="forge-stage">
        <div class="forge-ground"></div>
        <div class="coalglow" style="width:220px;height:130px"></div>
        ${hearthMouth(74, 74, 60)}

        <div class="coolrack" style="left:84px;right:88px;top:12px;height:96px">
          ${strap('l', 2)}${strap('r', 2)}
          ${rail(36, 'billet_orange', 'heat-orange', 78,
                 { x:104, rot:'1.5deg', sx:0, name:'The Patient Edge', heat:'', dim:true })}
          ${rail(78, 'billet_red', 'heat-red', 78,
                 { x:106, rot:'-1.5deg', sx:0, name:'The Long Anneal', heat:'', dim:true })}
        </div>

        <div class="anvil-station" style="left:34px;bottom:16px"
             data-seam="ANVIL" data-tag="${TAG_ANIM}">
          ${IV.spriteTag('anvil_big', 176)}
          <div class="on-anvil" style="left:30px;top:-14px">${IV.spriteTag('billet_struck', 104)}</div>
          <span class="sparks" style="left:80px;top:-20px"></span>
          <div class="a-hammer" style="left:118px;top:-40px;transform:rotate(-20deg)">${IV.spriteTag('hammer_rest', 104)}</div>
        </div>

        ${doorEdge(58)}
        <div class="forge-cap"><span class="cap"><b>Struck once, sworn.</b> It cools on the face; two billets
          wait dim on the rack.</span></div>
      </div>
    </div>`;
  }

  /* ==========================================================================
     4. HER PORTRAIT + DIALOGUE — the app's giver idiom, under the close-up
     ========================================================================== */

  function grunChat(line, px) {
    return `<div class="win tight npchat" data-seam="PORTRAIT" data-tag="${TAG_PORTRAIT}">
      <div class="npc-head">
        ${IV.spriteTag('grun_portrait', px || 128)}
        <div class="npc-dialog">
          <div class="npc-name">Grunhilda Iron-Bell, Keeper of the Heavy Things</div>
          <div class="dlg">${line}<span class="caret"></span></div>
        </div>
      </div>
    </div>`;
  }

  /* ==========================================================================
     5. THE OATH MENU — the driver
     ========================================================================== */

  function oathRow(opt) {
    return `<div class="oath-row ${opt.cls || ''}">
      <span class="heat-swatch ${opt.sw}"></span>
      <div class="o-head">
        <span class="o-name">${opt.name}</span>
        <span class="o-heat">${opt.heat}</span>
      </div>
      ${opt.btn ? `<button class="btn small">${opt.btn}</button>` : ''}
      <div class="o-terms">${opt.terms.map(function (t) {
        return `<span class="o-line"><b>${t[0]}</b> ${t[1]}</span>`;
      }).join('')}${opt.extra || ''}</div>
    </div>`;
  }

  function menuChoosing() {
    return `<div class="win oathmenu" data-seam="MENU" data-tag="${TAG_MENU}">
      <span class="win-title">Open oaths &mdash; the forge</span>
      <div class="menu-help">Three on her rack. Choose here; the rack behind the anvil only shows what is open.
        Swearing lays the billet on the anvil for one blow.</div>

      ${oathRow({ cls:'chosen', sw:'sw-white', name:'The Iron Communion',
        heat:'white-hot &middot; the heaviest of the three, and the briefest', btn:'SWEAR IT',
        terms: [
          ['asks', 'Back Squat, Overhead Press, Barbell Row &mdash; <i>four sets of five</i> apiece, heavy and low'],
          ['pays', '<i>forty gold</i> &middot; <i>ninety marks</i> &middot; two vigor back, three if you finish it clean'],
          ['runs', 'until sundown &mdash; <i>one day</i>, then the heat is out of it'],
        ]})}

      ${oathRow({ sw:'sw-orange', name:'The Patient Edge',
        heat:'orange &middot; a middling weight', btn:'SWEAR IT',
        terms: [
          ['asks', 'Front Squat, Bench Press, Chin-Ups &mdash; <i>three sets of eight</i> apiece'],
          ['pays', '<i>twenty-five gold</i> &middot; <i>sixty marks</i> &middot; one vigor back'],
          ['runs', '<i>two days</i> before the colour goes'],
        ]})}

      ${oathRow({ sw:'sw-red', name:'The Long Anneal',
        heat:'dull red &middot; the lightest, and the longest', btn:'SWEAR IT',
        terms: [
          ['asks', 'Goblet Squat, Push-Ups, Farmer&rsquo;s Carry &mdash; <i>two rounds</i>, unhurried'],
          ['pays', '<i>fifteen gold</i> &middot; <i>forty marks</i> &middot; one vigor back'],
          ['runs', '<i>four days</i> &mdash; slow iron holds its heat'],
        ]})}

      <div class="menu-actions">
        <button class="btn small">DOCTRINES &amp; ROUTINES</button>
      </div>
      <div class="rk-foot">Ravens carried nothing new since half past five. The rack is as she left it.</div>
    </div>`;
  }

  function menuSworn() {
    return `<div class="win oathmenu" data-seam="MENU" data-tag="${TAG_MENU}">
      <span class="win-title">Your oath &mdash; the forge</span>

      ${oathRow({ cls:'sworn-row', sw:'sw-orange', name:'The Iron Communion',
        heat:'sworn on the white-hot billet &mdash; struck once, cooling on her anvil',
        terms: [
          ['asks', 'twelve sets in all &mdash; <i>none struck yet</i>'],
          ['pays', '<i>forty gold</i> &middot; <i>ninety marks</i> &middot; two vigor at the end of it'],
        ],
        extra: '<span class="cooling">it cools at sundown &mdash; about six hours of heat left in it</span>' })}

      <div class="menu-actions" data-seam="ABANDON" data-tag="${TAG_ABANDON}">
        <button class="btn small">ABANDON &mdash; BACK TO THE FIRE</button>
        <button class="btn small">DOCTRINES &amp; ROUTINES</button>
      </div>
      <div class="rk-foot">Abandoning returns the billet to the coals at the hearth mouth &mdash; the scene will
        show it; this menu does it. The tally is kept through the yard door.</div>
    </div>`;
  }

  /* ==========================================================================
     6. THE TWO FRAMES
     ========================================================================== */

  function sceneDesktop() {
    return `<div class="app-pad">
      ${IV.header({ phone: false })}
      ${forgeChoosing()}
      ${grunChat('&ldquo;Three heats on the rack. The hottest is the heaviest &mdash; and the briefest. '
        + 'Pick from the list and I&rsquo;ll do the striking.&rdquo;')}
      ${menuChoosing()}
      ${IV.footer()}
    </div>`;
  }

  function scenePhone() {
    return `<div class="app-pad">
      ${IV.header({ phone: true })}
      ${forgeSworn()}
      ${grunChat('&ldquo;Sworn. It cools at sundown &mdash; bring me twelve sets before the '
        + 'colour&rsquo;s out of it.&rdquo;', 96)}
      ${menuSworn()}
      ${IV.footer()}
    </div>
    ${IV.dock()}`;
  }

  /* ==========================================================================
     7. THE WALL
     ========================================================================== */

  IV.page({
    title: 'Iron Vale — Grunhilda’s forge, the anvil',
    subtitle: 'visual mockup, nothing wired up · the ledger formula applied to the forge · static/js/giver.js SCREENS.giver, giver=strength',
    note: '<b>The thesis.</b> The ledger formula, applied to the forge: <b>up-close, menu-driven, scene as state</b>. '
      + 'The previous pass built a room — wall, window, floor, five stations — and made the billets the buttons. '
      + 'This one frames the work surface instead: anvil face, her hands, the cooling rack behind holding one billet '
      + 'per open oath (heat = weight), and nothing that neither displays state nor does work. A conventional '
      + '<b>.win menu panel chooses and swears</b>; the rack only answers — the chosen row lights its billet, and on '
      + 'swearing the billet leaps to the anvil for one blow as <b>decoration of a done thing</b>, never a gate. '
      + 'Grunhilda talks through her hand-drawn 32&times;32 portrait beside a typewriter box — the app&rsquo;s own '
      + 'giver idiom, no corner bust. One clickable thing remains in the scene, and it only navigates: the Drill '
      + 'Yard door edge at the crop.',
    legend: [
      { label: 'THE CROP', text: 'the frame holds the work surface, not the smithy' },
      { label: 'THE MENU', text: 'a plain .win panel chooses and swears — the driver' },
      { label: 'THE RACK', text: 'one billet per open oath, heat = weight — state, not buttons' },
      { label: 'THE BLOW', text: 'the strike decorates the sworn oath, it never gates it' },
      { label: 'THE PORTRAIT', text: 'Joe’s 32×32 portrait + typewriter box, the app’s giver idiom' },
      { label: 'THE DOOR', text: 'one clickable edge, navigational only' },
    ],
    frames: {
      phone: {
        title: 'Phone — 414px bezel — THE SWORN STATE',
        sub: 'the same close-up folded: struck billet cooling on the anvil face, two dim on the rack, her word under the scene, and the menu below holding the sworn oath with abandon as a menu action',
        chips: ['struck and cooling', 'two dim on the rack', 'abandon = menu action', 'door edge kept'],
        html: scenePhone(),
      },
      desktop: {
        title: 'Desktop — 900px viewport, scaled to fit — THE CHOOSING STATE',
        sub: 'the anvil close-up: rack behind holding three billets at three heats, her tongs and hammer in frame, the white-hot billet lifted because the menu’s chosen row says so, and the oath menu below doing the driving',
        chips: ['the close-up crop', 'menu drives', 'rack displays state', 'portrait + typewriter', 'the yard door edge'],
        url: 'ironvale.local:8322/#giver?giver=strength — the forge',
        html: sceneDesktop(),
      },
    },
  });

  IV.boot();
</script>
</body>
