/* ================= THE GIVER HUT — an interior you stand in ================= */
.iv .hut { position:relative; border:2px solid #4a3d20; margin:12px 4px 4px;

.iv .hut.tod-day .hut-wall::after { background:linear-gradient(180deg, rgba(180,210,240,0.10), rgba(0,0,0,0.30)); }
.iv .hut.tod-day .lightfall { background:linear-gradient(180deg, rgba(200,225,245,0.20), rgba(200,225,245,0)); }

.iv .hut.tod-sunset .win-sky { background:linear-gradient(180deg,#f0b062 0,#e07840 38%,#c04a44 70%,#6a2c48 100%); }
.iv .hut.tod-sunset .hut-wall::after { background:linear-gradient(180deg, rgba(240,150,70,0.16), rgba(0,0,0,0.40)); }

/* the window — a hole in the wall carrying the hour */

  border:4px solid #4a3524; box-shadow:inset 0 0 0 2px #1a1208, 3px 3px 0 rgba(0,0,0,0.5);

/* ================= THE COOLING RACK — a stand, not a widget =================

   the rails at whatever angle she dropped them at, at whatever depth she
   reached. There is no frame around it, no header over it and no row of even
   slots inside it — the moment it gets those it stops being a rack and starts
   being a list with a wood skin. Each heat is scratched into its own rail, at
   the end where the cold iron lies, so the name is a mark on the object.
   ========================================================================== */
.iv .cr-stand { position:relative; width:220px; height:164px; margin:0 auto; }

.iv .cr-post.r { right:2px; transform:scaleX(-1); }

  background:linear-gradient(180deg,#b0b0be 0 2px,#74747f 2px 5px,#43434e 5px 9px,#1e1e26 9px 12px);
  box-shadow:0 2px 0 rgba(0,0,0,0.55); }
.iv .billet .b-scratch { position:absolute; bottom:0; height:12px; line-height:13px;
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:0.5px;
  white-space:nowrap; color:#f2f2f8; text-shadow:1px 1px 0 rgba(0,0,0,0.95);
  transform:rotate(-1.5deg); }
.iv .billet .b-bar { position:absolute; bottom:8px; line-height:0; }

.iv .billet.heat-white .b-bar canvas { filter:drop-shadow(0 0 7px rgba(255,235,170,0.95)) drop-shadow(0 0 18px rgba(240,150,60,0.6)); }
.iv .billet.heat-orange .b-bar canvas { filter:drop-shadow(0 0 6px rgba(240,140,60,0.7)); }
.iv .billet.heat-red .b-bar canvas { filter:drop-shadow(0 0 5px rgba(190,60,30,0.55)); }
.iv .billet.heat-white .b-scratch { color:#ffe9a8; text-shadow:1px 1px 0 rgba(0,0,0,0.95); }
/* the chosen billet has been lifted off its rail and into the light */

  /* ==========================================================================
     3. THE MARGIN NOTES
     ========================================================================== */

  var TAG_ROOM = 'A ROOM, NOT A VOID|'
    + 'Replaces two gold panels on the flat void. Wall, floor, one window carrying the hour — '
    + 'the bones all four huts share.';

  var TAG_RACK = 'THE BILLETS ARE THE OFFERS|'
    + 'Replaces the offer-card list. A forked stand, three rails, iron lying where she dropped '
    + 'it — no frame, no header, no even rows. Each heat is scratched into its own rail. Hotter '
    + 'is heavier. Nothing states its terms until you touch it.';

  var TAG_TAIL = 'THE WORLD POINTS BACK|'
    + 'The panel opened from the billet you touched, and its tail is nailed to it. Touch another '
    + 'and the tail slides across.';

  var TAG_GLYPH = 'UTILITY IS A CORNER GLYPH|'
    + 'The DOCTRINES button and the &ldquo;within reach today&rdquo; dropdown, redrawn as 24px '
    + 'sprites in the weight of the app’s ✕ glyph.';

  var TAG_BUST = 'SHE SPEAKS WHEN ASKED|'
    + 'She stands at her anvil. Her bust is a small tappable portrait on the far corner, silent '
    + 'until tapped. Shown mid-speech.';

  var TAG_DOOR = 'THE DRILL YARD IS A DOOR|'
    + 'The routine builder is not a route. It is the next room, with the yard’s light under the '
    + 'door. Every hut gets one.';

  var TAG_STRIKE = 'SWEARING IS ONE BLOW|'
    + 'Replaces ACCEPT QUEST under every card. You lay the billet on her anvil and she strikes '
    + 'it once.';

  var TAG_SWORN = 'THE OATH IS ON THE ANVIL|'
    + 'The same room with the iron moved — struck and cooling on the face, her hammer down off '
    + 'its peg and leaned on the stump, two billets still on the rack behind her. Nothing else '
    + 'changed.';

  var TAG_PLATE = 'A PLATE, NOT A PANEL|'
    + 'A sworn oath’s terms hang on a small plate, tail on the iron it describes. Smaller than the '
    + 'choosing panel, on purpose.';

  var TAG_ABANDON = 'BACK INTO THE FIRE|'
    + 'Replaces the red abandon button. Her tongs put the billet back in the coals. A glyph and a '
    + 'caption, never a red button.';

  /* ==========================================================================
     4. THE ROOM
     ========================================================================== */

  function windowEl(w, left, top) {
    return `<div class="window" style="left:${left};width:${w}px;top:${top}px">
        <div class="win-sky"><div class="mtns" data-fill="mtns"></div></div>
        <div class="win-bar v"></div><div class="win-bar h"></div>
      </div>`;
  }

  /* the door names itself on its own lintel board — no floating plate hanging
     in the air over the room, and nothing to collide with the tool rail */
  function doorEl(side, width, height, tagged, right) {
    return `<div class="spot doorway" style="${right ? 'right' : 'left'}:${side};width:${width}px"
        ${tagged ? `data-seam="DOOR" data-tag="${TAG_DOOR}"` : ''}>
        <div class="door-frame" style="height:${height}px">
          <div class="door-lintel"><i class="n1"></i>the drill yard<i class="n2"></i></div>
          <div class="door-plank"><span class="knob"></span></div>
          <div class="door-under"></div>
        </div>
      </div>`;
  }

  function toolRail(left, width) {
    return `<div class="wall-rail" style="left:${left};width:${width}px">
        <div class="rail-bar"></div>
        <div class="rail-hung">
          ${IV.spriteTag('hammer', 42)}
          ${IV.spriteTag('tongs', 36)}
          ${IV.spriteTag('stock_bar', 36)}
        </div>
      </div>`;
  }

  /* One billet: a rail with its heat scratched into it near the cold end, and
     the bar itself lying across that rail at the angle she left it at. The
     button is the whole rail-and-bar, because the bar is what you touch.
     opt = { top, lx, x, rot } — all of it hand-placed, because a rack that
     lays its iron out on an even grid is a list again. */
  function billet(key, heat, cls, px, opt) {
    return `<button class="billet ${cls}" style="top:${opt.top}px">
        <span class="b-rail"></span>
        ${heat ? `<span class="b-scratch" style="left:${opt.lx}px">${heat}</span>` : ''}
        <span class="b-bar" style="left:${opt.x}px;--rot:${opt.rot}">
          ${IV.spriteTag(key, px)}
        </span>
      </button>`;
  }

        <div class="door-floorglow" style="right:8px;width:200px"></div>
        <div class="coalglow" style="left:16%"></div>

          <div class="spot">

  /* --- the terms panel, opened from the white-hot billet ------------------ */

      <button class="board-glyph glyph-grun tapped" data-seam="BUST" data-tag="${TAG_BUST}">
        ${IV.spriteTag('grun_bust', 24)}
        <span class="g-cap">ASK HER</span>
        <span class="gbubble-wrap">
          <span class="gbubble">
            <span class="fb-line">&ldquo;The bell does not care how you feel. Lift it anyway.&rdquo;</span>

          </span>
        </span>
      </button>

      <div class="rk-head">
        <span class="rk-title">The Iron Communion</span>
        <span class="rk-sub">white-hot &mdash; the heaviest of the three, and the briefest</span>
      </div>

      <div class="term-row">
        <span class="t-key">what it asks</span>
        <span class="t-val">
          <b>Heavy and low.</b> Rest well between sets.
          <span class="lline">&#9656; Back Squat &mdash; <b>four sets of five</b>, at seventy kilos</span>
          <span class="lline">&#9656; Overhead Press &mdash; <b>four sets of five</b>, at forty kilos</span>
          <span class="lline">&#9656; Barbell Row &mdash; <b>four sets of five</b>, at fifty-five kilos</span>
          <span class="lline">Twelve sets in all. It leans on your legs and your back.</span>
        </span>
      </div>

      <div class="term-row">
        <span class="t-key">what it pays</span>
        <span class="t-val">
          <span class="pay">${IV.spriteTag('icon_coin', 15)} forty gold, and better if you outwork it</span>
          <span class="pay">${IV.spriteTag('icon_token', 15)} ninety marks toward the next level</span>
          <span class="lline">Two vigor returned when it is done &mdash; three if you finish it clean.</span>
        </span>
      </div>

      <div class="term-row">
        <span class="t-key">how long it runs</span>
        <span class="t-val">

        </span>
      </div>

      <div class="rk-foot">Ravens carried nothing new since half past five. The rack is as she left it.</div>
    </div>`;
  }
