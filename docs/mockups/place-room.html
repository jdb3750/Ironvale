<!doctype html>

<title>Iron Vale — your room at the inn, the desk</title>
<!-- Design mockup for Settings (static/js/misc.js:817 — SCREENS.settings),
     reworked to the ledger formula. Nothing here is wired up and nothing here
     ships: static/ is the app, this is drawing paper. Chrome, tokens, fonts
     and the sprite engine come from _harness.js.

     THIRD PASS. The first pass pinned every fixture to one flat wall; the
     second built the whole room as a one-point-perspective box — door, bed,
     boots, hearth, tree, eleven labelled fixtures ("difficult to understand
     what's happening"). This pass cuts the room tour and frames ONE work
     surface: your desk and the wall right above it. The menu drives — this is
     Settings, so the bordered .win panel is genuinely primary — and the desk
     only shows the settings back: pegs for the week, a pinned charter, a
     banded raven by a slice of window, a notched stick, a small glass. -->
<script src="_harness.js"></script>
<style id="scene-css">
/* ================== YOUR ROOM AT THE INN — the desk, up close ==============
   One projection, the ledger's: a high three-quarter view down onto the desk
   surface, the wall it stands against filling the top of the frame. One light
   (the candle at the back-left), so hard shadows fall down-and-right,
   everywhere. Materials: oak, iron, stone, canvas — dark subtle fills.
   ========================================================================== */

/* --- the two-column floor plan: the desk close-up, the menu beside it --- */
.iv-desktop .setwrap { display:grid; grid-template-columns:500px minmax(0,1fr);
  gap:0 12px; align-items:start; margin-top:12px; }
.iv-phone .setwrap { display:block; margin-top:10px; }

/* --- the stage: wall band above, desk surface below, a floor sliver --- */
.iv .deskstage { position:relative; overflow:hidden; margin:0 4px;
  border:3px solid #6a4e2c; box-shadow:inset 0 0 0 2px #1a1208, 6px 6px 0 rgba(0,0,0,0.55);
  background:#171008; }
.iv-desktop .deskstage { height:600px; }
.iv-phone .deskstage { height:248px; }

/* the wall: vertical oak boards falling off into the dark, candle-lit left */
.iv .wallband { position:absolute; left:0; right:0; top:0;
  background-color:#31220f;
  background-image:
    radial-gradient(ellipse 60% 70% at 10% 100%, rgba(248,214,132,0.16), rgba(0,0,0,0) 70%),
    linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 55%, rgba(0,0,0,0.38) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.08) 30%, rgba(0,0,0,0) 100%),
    repeating-linear-gradient(90deg, rgba(16,10,4,0.9) 0 2px, rgba(0,0,0,0) 2px 38px),
    repeating-linear-gradient(90deg, rgba(168,132,80,0.10) 0 1px, rgba(0,0,0,0) 1px 38px);
}
/* the desk surface: the ledger's plank recipe, your own wood */
.iv .desksurf { position:absolute; left:0; right:0; background-color:#3a2a17;
  background-image:
    radial-gradient(ellipse 60% 60% at 12% 12%, rgba(248,214,132,0.24), rgba(0,0,0,0) 72%),
    linear-gradient(180deg, rgba(0,0,0,0.52) 0, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 72%, rgba(0,0,0,0.34) 100%),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 40px, rgba(22,15,6,0.9) 40px 43px, rgba(140,106,60,0.30) 43px 44px),
    repeating-linear-gradient(180deg, rgba(255,224,168,0.05) 0 1px, rgba(0,0,0,0) 1px 4px, rgba(0,0,0,0.11) 4px 5px, rgba(0,0,0,0) 5px 9px);
  border-top:3px solid #150d05; }
/* the near lip you rest your wrists on */
.iv .desklip { position:absolute; left:0; right:0; height:14px; border-top:2px solid #8a6a40;
  background:linear-gradient(180deg, rgba(120,88,48,0.35) 0, rgba(0,0,0,0.55) 100%); }
/* the floor sliver under the desk — and the one board in it that gives */
.iv .floorsliver { position:absolute; left:0; right:0; bottom:0; border-top:2px solid #060402;
  background-color:#1a1109;
  background-image:repeating-linear-gradient(90deg, rgba(6,4,2,0.9) 0 2px, rgba(0,0,0,0) 2px 34px),
    linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.55)); }
.iv .floorsliver .give { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  color:#5b4a2e; font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px;
  text-shadow:0 1px 0 rgba(0,0,0,0.6); white-space:nowrap; }

/* the candle's own light, over everything near it */
.iv .candleglow { position:absolute; pointer-events:none; mix-blend-mode:screen; z-index:6;
  background:radial-gradient(ellipse at center, rgba(255,178,86,0.30), rgba(255,140,52,0.10) 45%, rgba(0,0,0,0) 72%);
  animation:glowBreathe 2.2s steps(2) infinite; }
@keyframes glowBreathe { 50% { opacity:0.82; } }

/* everything standing on the desk stands in its own contact shadow */
.iv .footed { position:absolute; line-height:0; z-index:4; }
.iv .footed > canvas { position:relative; z-index:1; }
.iv .footed .fshade { position:absolute; z-index:0; left:-10%; right:-28%; bottom:-6px; height:13px;
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,0,0.62) 0, rgba(0,0,0,0.30) 46%, rgba(0,0,0,0) 74%); }

/* --- labels: a paper tag gummed to the thing, or a brass plate on it --- */
.iv .paper-tag { position:absolute; z-index:7; background:#e8e0cc; border:1px solid #7a6244;
  color:#2a1c08; font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.3;
  padding:2px 5px; box-shadow:2px 2px 0 rgba(0,0,0,0.5); text-align:center; }
.iv .paper-tag b { color:#5a2010; font-weight:400; display:block; }
.iv .plate-tag { position:absolute; z-index:7; background:#140d05; border:2px solid var(--gold);
  color:var(--gold-bright); font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.3;
  padding:2px 6px; box-shadow:0 2px 0 rgba(0,0,0,0.6); text-align:center; }
.iv .plate-tag b { color:#fff0c0; font-weight:400; }

/* the desk's nameplate, on the far-edge band */
.iv .desk-plate { border:2px solid var(--gold); background:#1a1208; color:var(--gold-bright);
  font-family:var(--font-title); font-size:var(--type-title); letter-spacing:1px;
  text-transform:uppercase; padding:3px 12px; box-shadow:3px 3px 0 rgba(0,0,0,0.55);
  display:inline-block; margin:0 4px 8px; }
.iv .desk-plate small { display:block; margin-top:2px; color:#c0b48c; text-transform:none;
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:0.5px; }

/* the caption strip under the stage */
.iv .desk-cap { margin:8px 4px 0; text-align:center; }
.iv .desk-cap .cap { display:inline-block; background:rgba(8,8,14,0.82); border:1px solid #4a3d20;
  padding:4px 10px; color:var(--dim-readable); font-family:var(--font-fine); font-size:var(--type-fine);
  line-height:1.4; text-align:left; }
.iv .desk-cap .cap b { color:var(--ink); font-weight:400; }

/* --- the peg board: one rail, seven pegs, the week hung on it --- */
.iv .pegboard { position:absolute; z-index:3; padding:5px 6px 8px; border:2px solid #1c1206;
  background-color:#241a0c;
  background-image:linear-gradient(180deg, rgba(200,158,96,0.10), rgba(0,0,0,0.30)),
    repeating-linear-gradient(180deg, rgba(10,6,2,0.8) 0 1px, rgba(0,0,0,0) 1px 26px);
  box-shadow:3px 4px 0 rgba(0,0,0,0.55); }
.iv .pb-rail { position:relative; height:17px; border:2px solid #2c1e10;
  background:linear-gradient(180deg,#c29a5e 0 2px,#a07c4a 2px,#7a5a32 55%,#4a3520 100%);
  box-shadow:0 2px 0 rgba(0,0,0,0.45); }
.iv .pb-rail .pb-day { position:absolute; top:3px; transform:translateX(-50%);
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px;
  color:#241704; text-shadow:0 1px 0 rgba(240,212,160,0.75); }
.iv-desktop .pcord { height:12px; }
.iv .pb-rail .pb-peg { position:absolute; top:100%; margin-top:-3px; transform:translateX(-50%);
  width:9px; height:11px; z-index:2;
  background:linear-gradient(180deg,#e6c48c,#a07c4a 60%,#6a4e2c);
  border:2px solid #33240f; box-shadow:2px 2px 0 rgba(0,0,0,0.5); }
.iv .pb-cols { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; padding-top:10px; }
.iv .pb-col { display:flex; flex-direction:column; align-items:center; min-width:0; }
.iv .pcord { width:2px; height:8px; background:repeating-linear-gradient(180deg,#a8a8b8 0 2px, rgba(0,0,0,0) 2px 4px); }
.iv .ptag { width:100%; padding:3px 2px 4px; text-align:center; color:var(--ink);
  border:2px solid; border-color:#a07c4a #33240f #2a1c0e #7a5a32;
  background:linear-gradient(180deg,#664d2c,#4a3620);
  font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.2;
  box-shadow:2px 2px 0 rgba(0,0,0,0.45); margin-bottom:4px; }
.iv .ptag b { display:block; color:var(--gold-bright); font-weight:400; }
.iv .ptag small { display:block; color:#c9b98c; margin-top:1px; }
.iv-phone .ptag small { display:none; }
/* hung loose: one cord, askew — a maybe, not a plan */
.iv .ptag.loose { transform:rotate(-4deg); transform-origin:top center; }
/* freshly re-hung by the menu: still swinging. Decoration of a saved change. */
.iv .ptag.fresh { border-color:#f0a850 #7a4a20 #5c3816 #c07838;
  box-shadow:0 0 0 2px rgba(240,168,80,0.3), 2px 2px 0 rgba(0,0,0,0.5);
  transform-origin:top center; animation:pegSwing 1.8s steps(4) infinite; }
@keyframes pegSwing { 0% { transform:rotate(-4deg); } 50% { transform:rotate(2deg); } 100% { transform:rotate(-4deg); } }

/* --- the charter, pinned beside the board --- */
.iv .charter { position:absolute; z-index:3; padding:6px 7px 7px; background:#e6ddc4; color:#3c3222;
  border:1px solid #a89c7e; box-shadow:2px 3px 0 rgba(0,0,0,0.55); text-align:left;
  font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.45; }
.iv .charter::before { content:''; position:absolute; top:-3px; left:50%; margin-left:-3px;
  width:6px; height:6px; background:#c85050; box-shadow:0 0 0 1px #6a2828; }
.iv .charter b { display:block; color:#5a4a22; font-weight:400; letter-spacing:1px; }
.iv .charter i { font-style:italic; color:#6a5c40; }

/* --- the slice of window, dusk through it --- */
.iv .winslice { position:absolute; z-index:2; border:3px solid #6a4e2c; border-right:none;
  background:linear-gradient(180deg,#10162c 0,#1d2b4a 52%,#31456e 100%);
  box-shadow:inset 0 0 0 2px #241a0c, inset 6px 0 12px rgba(0,0,0,0.5); }
.iv .winslice .mull { position:absolute; left:0; right:0; height:5px; background:#6a4e2c;
  box-shadow:inset 0 1px 0 #9a7440, 0 2px 0 rgba(0,0,0,0.4); }
.iv .winslice .moon { position:absolute; width:9px; height:9px; background:#e8e0c0;
  box-shadow:0 0 0 2px rgba(232,224,192,0.18); }
.iv .winslice .star { position:absolute; width:2px; height:2px; background:#8a9ac0;
  box-shadow:14px 22px 0 #6a7aa0, -12px 38px 0 #8a9ac0, 6px 54px 0 #56668c; }
.iv .winslice .sill { position:absolute; left:-3px; right:0; bottom:0; height:8px;
  background:linear-gradient(180deg,#8a6a40,#4a3620); border-top:2px solid #a8845a; }

/* --- the measuring stick at the desk edge --- */
.iv .stick { position:absolute; z-index:5; height:12px; border:2px solid;
  border-color:#e0cba2 #7a6244 #66513a #a8895e; background:linear-gradient(180deg,#c4a97e,#ab9066);
  box-shadow:0 3px 0 rgba(0,0,0,0.42); }
.iv .stick::before { content:''; position:absolute; top:1px; bottom:4px; left:6px; right:6px;
  background:repeating-linear-gradient(90deg, rgba(60,42,18,0.65) 0 1px, rgba(0,0,0,0) 1px 7px); }
.iv .stick::after { content:''; position:absolute; top:5px; bottom:1px; left:9px; right:9px;
  background:repeating-linear-gradient(90deg, rgba(60,42,18,0.4) 0 1px, rgba(0,0,0,0) 1px 21px); }

/* --- the band-state chip by the cage --- */
.iv .bandstate { display:inline-block; border:1px solid var(--green); color:var(--green);
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px;
  text-transform:uppercase; padding:1px 5px; background:rgba(8,12,6,0.8); }

/* ==================== THE MENU — the tool itself ========================= */
.iv .setmenu { margin-top:20px; }
.iv .setmenu .menu-help { color:var(--dim-readable); font-family:var(--font-fine);
  font-size:var(--type-fine); line-height:1.45; margin:-2px 0 8px; }
.iv .setmenu .menu-help b { color:var(--ink); font-weight:400; }

/* a closed section: one row, its current value read back */
.iv .secrow { display:flex; align-items:baseline; gap:8px; padding:6px 2px;
  border-bottom:1px solid #26233a; }
.iv .secrow .sr-name { color:var(--gold-bright); font-family:var(--font-body);
  font-size:var(--type-body); text-transform:uppercase; letter-spacing:0.5px;
  width:118px; flex-shrink:0; }
.iv .secrow .sr-val { color:var(--dim-readable); flex:1; min-width:0;
  font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.35; }
.iv .secrow .sr-val i { font-style:normal; color:var(--ink); }
.iv .secrow .sr-go { color:var(--dim); font-family:var(--font-title); flex-shrink:0; }

/* the open section: raised, bevelled, the one being worked */
.iv .sec { border:2px solid; border-color:var(--edge-lit) var(--edge-shade) var(--edge-shade) var(--edge-lit);
  background:var(--panel2); padding:9px 10px 10px; margin:12px 0; box-shadow:3px 3px 0 rgba(0,0,0,0.5); }
.iv .sec .sec-title { font-family:var(--font-title); font-size:var(--type-title);
  letter-spacing:1px; text-transform:uppercase; color:var(--gold-bright); }
.iv .sec .sec-sub { color:var(--dim-readable); font-family:var(--font-fine);
  font-size:var(--type-fine); margin:2px 0 6px; line-height:1.4; }
.iv .sec .sec-foot { margin-top:8px; color:var(--dim-readable); font-family:var(--font-fine);
  font-size:var(--type-fine); line-height:1.45; }
.iv .sec .sec-foot b { color:var(--ink); font-weight:400; }

/* schedule rows inside the open week section */
.iv .schedrow { display:flex; align-items:center; gap:8px; padding:5px 2px;
  border-bottom:1px solid #2a2740; }
.iv .schedrow:last-of-type { border-bottom:none; }
.iv .schedrow .sd { width:32px; flex-shrink:0; color:var(--blue);
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px; }
.iv .schedrow .sw { flex:1; min-width:0; font-family:var(--font-fine); font-size:var(--type-fine);
  color:var(--dim-readable); line-height:1.35; }
.iv .schedrow .sw b { color:var(--ink); font-weight:400; }
.iv .schedrow .btn.small { padding:2px 7px; font-size:10px; flex-shrink:0; }
.iv .schedrow.fresh { background:rgba(240,168,80,0.10); outline:2px solid rgba(240,168,80,0.35);
  outline-offset:-1px; }
.iv .schedrow.fresh .sw i { font-style:normal; color:#f0a850; }

/* the honest inputs — a secret still has to be typed */
.iv .writ label { display:block; color:var(--blue); font-family:var(--font-body);
  font-size:var(--type-body); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.iv .writ input { width:100%; background:#000; color:var(--ink); border:2px solid var(--gold);
  font-family:var(--font-body); font-size:var(--type-body); padding:6px 8px; }
.iv .writ .whisper { display:block; margin:3px 0 10px; color:var(--dim-readable);
  font-family:var(--font-fine); font-size:var(--type-fine); }
.iv .writ .whisper b { color:var(--ink); font-weight:400; }
</style>
<body>
<script>
  IV.injectStyles();
  /* the harness stylesheet lands on injectStyles(); move the scene sheet after
     it so scene rules win on equal specificity */
  document.head.appendChild(document.getElementById('scene-css'));

  /* =========================================================================
     0. sprite helper — pad ragged rows so hand-authored art can't skew a canvas
     ========================================================================= */
  function normalize(defs) {
    var ragged = [];
    Object.keys(defs).forEach(function (k) {
      var rows = defs[k].r;
      var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
      if (rows.some(function (r) { return r.length !== w; })) ragged.push(k);
      defs[k].r = rows.map(function (r) { return r + new Array(w - r.length + 1).join('.'); });
    });
    if (ragged.length) console.warn('ragged sprite rows (padded):', ragged.join(', '));
    return defs;
  }

  /* =========================================================================
     1. THE THINGS ON THE DESK — hand-authored char-map sprites.
     ========================================================================= */
  IV.addSprites(normalize({

    /* one tallow candle — all the light this corner gets */
    candle: { p: { y:'#f0d060', o:'#e07030', r:'#c04020', k:'#2a2a34', W:'#e8e0cc', w:'#c8c0a8', m:'#8a8a9a' }, r: [
      '...y....', '...yo...', '..oyyo..', '..oyyo..', '...ro...', '...k....',
      '..WWWw..', '..WWWw..', '..WWWw..', '..WWWw..', '..WWWw..', '.WWWWWw.',
      '.WWWWWw.', 'mmmmmmmm', '.mmmmmm.', '..mmmm..',
    ]},

    /* the raven cage on the desk's end: dome, bars, the bird inside on her
       perch — and the gold band on her left leg, which is the credentials */
    cage: { p: { i:'#8a8a9a', I:'#c8c8d8', d:'#28243c', k:'#0f0f18', K:'#3a3a52',
      e:'#e8e0cc', y:'#c9a24b', Y:'#f0d080', l:'#8a7a4a', p:'#6a4e2c', w:'#4a3620', W:'#9a7440' }, r: [
      '............ii............',
      '...........i..i...........',
      '............ii............',
      '.........iiiiiiii.........',
      '.......iii......iii.......',
      '......ii..........ii......',
      '.....i..............i.....',
      '....i................i....',
      '...iiiiiiiiiiiiiiiiiiii...',
      '...iddddiddddddddiddddi...',
      '...iddddiddddddddiddddi...',
      '...iddddiddddddddiddddi...',
      '...iddddiddddddddiddddi...',
      '...iddddiddkkkkddiddddi...',
      '...iddddidkkkekydiddddi...',
      '...iddddidkkkkkkdiddddi...',
      '...iddddikkkkkkkdiddddi...',
      '...iddddikKKKkkkdiddddi...',
      '...iddddikKKKkkkdiddddi...',
      '...iddddikkkkkkkdiddddi...',
      '...iddddidkkkkkddiddddi...',
      '...iddddidYYYdlddiddddi...',
      '...iddddiddlddlddiddddi...',
      '...iddddippppppppiddddi...',
      '...iddddiddddddddiddddi...',
      '...iIIIIIIIIIIIIIIIIIIi...',
      '..wwwwwwwwwwwwwwwwwwwwww..',
      '..WWWWWWWWWWWWWWWWWWWWWW..',
    ]},

    /* the small looking-glass, propped on the desk, your face kept in it */
    glass: { p: { W:'#8a6a44', w:'#4f3a22', b:'#26364e', C:'#a8c4e2',
      s:'#e0b088', h:'#6a4428', e:'#171018', t:'#6288bc' }, r: [
      '.....wwwwwwww.....',
      '...wwWWWWWWWWww...',
      '..wWbbbbbbbbbCWw..',
      '.wWbbbbbbbbbbCbWw.',
      '.wWbbbhhhhhbbCbWw.',
      '.wWbbhhhhhhhbCbWw.',
      '.wWbbhhsssshbbbWw.',
      '.wWbbhsesesbbbbWw.',
      '.wWbbhsssssbbbbWw.',
      '.wWbbbsssssbbbbWw.',
      '.wWbbbbsssbbbbbWw.',
      '.wWbbtttttttbbbWw.',
      '.wWbtttttttttbbWw.',
      '.wWCbbbbbbbbbbbWw.',
      '..wWWWWWWWWWWWWw..',
      '...wwwwwwwwwwww...',
      '........ww........',
      '.......wWWw.......',
      '......wwwwww......',
    ]},
  }));

  /* =========================================================================
     2. THE ANNOTATIONS — the decree, pinned in the margins.
     ========================================================================= */

  var TAG_CROP = 'THE CLOSE CROP|'
    + 'The old pass drew the whole room from a vanishing point — door, bed, boots, hearth, tree, '
    + 'eleven labelled fixtures (&ldquo;difficult to understand what&rsquo;s happening&rdquo;). Cut. The frame '
    + 'holds one work surface — your desk and the wall right above it — and everything in it '
    + 'displays a setting or does work.';

  var TAG_FOLD = 'THE FOLD|'
    + 'Menu first: the desk folds to a strip — the pegs, the banded raven by the window slice, the '
    + 'notched stick on the desk edge. The glass and the charter fold into their menu rows.';

  var TAG_MENU = 'THE MENU DRIVES; THE DESK STAGES|'
    + 'Settings is the screen where the menu is genuinely primary — you do stuff through a menu, '
    + 'and border kits will dress this chrome later. One .win panel carries every section, the '
    + 'five that never had fixtures included (adventurer, sound, the siege bell, your clock, the '
    + 'daily pointer). The desk never gates any of it.';

  var TAG_PEGS = 'THE PEG BOARD SHOWS THE WEEK|'
    + 'One rail, seven pegs, a hung tag per planned bout — the schedule the menu edits, displayed. '
    + 'Nothing on the board is tappable: change the week in the menu and the board re-hangs its '
    + 'own pegs.';

  var TAG_DECOR = 'ANIMATION DECORATES, NEVER GATES|'
    + 'This row saved the moment it was set. The board answering — Saturday&rsquo;s tag re-hung '
    + 'and still swinging — is an afterimage of the change, not a step in it.';

  var TAG_CHARTER = 'THE CHARTER, PINNED|'
    + 'The focus charter as the sworn paper it is: the road first, then the iron, then the water. '
    + 'With the loop set to Scheduled the week drives and the charter rests — the menu row says '
    + 'so; the paper just hangs.';

  var TAG_CAGE = 'THE CAGE IS THE SYNC STATE|'
    + 'Ravens are sync. The band on her left leg means the intervals.icu credentials are bound; '
    + 'the caption under her is the last flight. Tie or cut the band in the menu — the scene only '
    + 'ever shows the bird wearing it.';

  var TAG_BAND = 'THE BAND, TIED|'
    + 'Credentials bound: the band is on her leg. It was tied by the menu below — the cage only '
    + 'shows it.';

  var TAG_STICK = 'THE STICK IS THE UNITS|'
    + 'A measuring stick at the desk edge, notched km along the road face and kg along the iron '
    + 'face. Pick mi or lb in the menu and the notches recut; the stick never asks.';

  var TAG_GLASS = 'THE GLASS IS THE NAME|'
    + 'A small looking-glass propped on the desk, your face in it, your name gummed under it. '
    + 'Rename yourself in the menu; the glass keeps the face.';

  var TAG_HONEST = 'A SECRET STILL HAS TO BE TYPED|'
    + 'The honest-inputs rule: an athlete id and an API key are text, and no fiction types them '
    + 'for you. Real fields, real keyboard. On saving, the scene&rsquo;s only answer is the band '
    + 'on her leg.';

  var TAG_NOTREE = 'NO HEARTH TREE HERE|'
    + 'The old room grew a hearth tree in its corner. That fixture belongs to the bazaar '
    + 'thread&rsquo;s rework now; this desk shows no branch of it.';

  /* =========================================================================
     3. THE WEEK — one source for the pegs and the menu rows.
     ========================================================================= */
  /* s = the menu row's words; ss = the shorter words on the hung tag itself */
  var WEEK = [
    { d:'MON', hang:[{ n:'the iron', s:'upper — press day', ss:'upper' }] },
    { d:'TUE', hang:[{ n:'a long run', s:'steady', ss:'steady' }] },
    { d:'WED', hang:[] },
    { d:'THU', hang:[{ n:'the iron', s:'lower — pull day', ss:'lower' }, { n:'a swim', s:'easy', ss:'easy', loose:true }] },
    { d:'FRI', hang:[{ n:'a ride', s:'brisk', ss:'brisk' }] },
    { d:'SAT', hang:[{ n:'a climb', s:'hard', ss:'hard', fresh:true }] },
    { d:'SUN', hang:[] },
  ];

  /* =========================================================================
     4. SCENE PIECES
     ========================================================================= */
  var S = IV.spriteTag;

  function stands(key, px, x, y, z) {
    return `<span class="footed" style="left:${x}px;top:${y}px${z ? ';z-index:' + z : ''}">`
      + `<span class="fshade"></span>${S(key, px)}</span>`;
  }

  function pegBoard(o) {
    var rail = WEEK.map(function (d, i) {
      var pct = ((i + 0.5) / 7 * 100).toFixed(2);
      return `<span class="pb-day" style="left:${pct}%">${o.phone ? d.d[0] : d.d}</span>`
        + `<span class="pb-peg" style="left:${pct}%"></span>`;
    }).join('');
    var cols = WEEK.map(function (d) {
      var hung = d.hang.map(function (t) {
        return `<span class="pcord"></span><span class="ptag ${t.loose ? 'loose' : ''} ${t.fresh ? 'fresh' : ''}">`
          + `<b>${t.n}</b><small>${t.ss}</small></span>`;
      }).join('');
      return `<div class="pb-col">${hung}</div>`;
    }).join('');
    return `<div class="pegboard" style="${o.style}"
        data-seam="PEG BOARD" data-tag="${TAG_PEGS}">
      <div class="pb-rail">${rail}</div>
      <div class="pb-cols">${cols}</div>
    </div>`;
  }

  function charter(style) {
    return `<div class="charter" style="${style}"
        data-seam="CHARTER" data-tag="${TAG_CHARTER}">
      <b>THE CHARTER</b>the road, first.<br>then the iron,<br>then the water.<br><i>&mdash; sworn in spring</i>
    </div>`;
  }

  function winSlice(o) {
    return `<div class="winslice" style="${o.style}">
      <span class="moon" style="right:${o.moonR}px;top:${o.moonT}px"></span>
      <span class="star" style="right:${o.moonR + 20}px;top:${o.moonT + 10}px"></span>
      <div class="mull" style="top:38%"></div>
      <div class="sill"></div>
    </div>`;
  }

  /* --- the desktop stage: the whole surface, everything in state --- */
  function stageDesktop() {
    return `<div class="deskstage" data-seam="THE CROP" data-tag="${TAG_CROP}">
      <div class="wallband" style="height:360px"></div>
      <div class="desksurf" style="top:360px;height:218px"></div>
      <div class="desklip" style="top:564px"></div>
      <div class="floorsliver" style="height:22px"><span class="give">a board that gives &mdash; if you already know it does</span></div>

      ${winSlice({ style:'right:-3px;top:26px;width:92px;height:334px', moonR:22, moonT:30 })}
      ${pegBoard({ style:'left:8px;top:16px;width:300px' })}
      ${charter('left:306px;top:44px;width:72px')}

      <span class="candleglow" style="left:-130px;top:130px;width:380px;height:380px"></span>
      ${stands('candle', 48, 30, 296)}

      <span class="footed" style="left:108px;top:348px" data-seam="THE GLASS" data-tag="${TAG_GLASS}">
        <span class="fshade"></span>${S('glass', 90)}</span>
      <div class="paper-tag" style="left:104px;top:446px;width:96px"><b>Joe</b>the face the glass keeps</div>

      <span class="footed" style="left:384px;top:286px" data-seam="RAVEN CAGE" data-tag="${TAG_CAGE}">
        <span class="fshade"></span>${S('cage', 104)}</span>
      <div class="paper-tag" style="left:372px;top:406px;width:116px"><b>the band is tied</b>
        ravens last flew a quarter-hour past &middot; every 15 min</div>

      <div class="stick" style="left:28px;top:536px;width:310px"
        data-seam="THE STICK" data-tag="${TAG_STICK}"></div>
      <div class="paper-tag" style="left:232px;top:496px"><b>notched km &middot; kg</b>mi and lb sleep on the back</div>
    </div>`;
  }

  /* --- the phone strip: the same desk folded to what a thumb can read --- */
  function stagePhone() {
    return `<div class="deskstage" data-seam="THE FOLD" data-tag="${TAG_FOLD}">
      <div class="wallband" style="height:150px"></div>
      <div class="desksurf" style="top:150px;height:86px"></div>
      <div class="desklip" style="top:222px"></div>
      <div class="floorsliver" style="height:12px"></div>

      ${winSlice({ style:'right:-3px;top:10px;width:88px;height:140px', moonR:18, moonT:18 })}
      ${pegBoard({ style:'left:6px;top:10px;width:calc(100% - 112px)', phone:true })}

      <span class="candleglow" style="left:-120px;top:40px;width:300px;height:280px"></span>

      <span class="footed" style="right:12px;top:118px;left:auto" data-seam="RAVEN CAGE" data-tag="${TAG_BAND}">
        <span class="fshade"></span>${S('cage', 78)}</span>

      <div class="stick" style="left:12px;top:204px;width:calc(100% - 136px)"></div>
      <div class="paper-tag" style="left:16px;top:172px"><b>notched km &middot; kg</b></div>
    </div>`;
  }

  /* =========================================================================
     5. THE MENU — one .win panel, every section, the open one raised.
     ========================================================================= */

  function secRow(name, val) {
    return `<div class="secrow"><span class="sr-name">${name}</span>`
      + `<span class="sr-val">${val}</span><span class="sr-go">&rsaquo;</span></div>`;
  }

  function weekSection() {
    var rows = WEEK.map(function (d) {
      var what = d.hang.length
        ? d.hang.map(function (t) {
            return `<b>${t.n}</b> &mdash; ${t.s}${t.loose ? ' &middot; hung loose' : ''}`;
          }).join(', and ')
        : 'a rest &mdash; the peg stays bare';
      var fresh = d.hang.some(function (t) { return t.fresh; });
      return `<div class="schedrow ${fresh ? 'fresh' : ''}"
          ${fresh ? `data-seam="THE SWING" data-tag="${TAG_DECOR}"` : ''}>
        <span class="sd">${d.d}</span>
        <span class="sw">${what}${fresh ? ' &middot; <i>hung a moment ago</i>' : ''}</span>
        <button class="btn small">${d.hang.length ? 'CHANGE' : 'HANG'}</button>
      </div>`;
    }).join('');
    return `<div class="sec">
      <div class="sec-title">the week</div>
      <div class="sec-sub">hang work on a day; a bare peg is a day of rest. saving here is the whole act.</div>
      ${rows}
      <div class="sec-foot"><b>The board on the desk wall already re-hung Saturday&rsquo;s peg</b> &mdash;
        the tag is still swinging. The swing is decoration; the save was this row.</div>
    </div>`;
  }

  function ravensSection() {
    return `<div class="sec">
      <div class="sec-title">the ravens</div>
      <div class="sec-sub">they carry your runs, climbs, lifts and rest home from the loft at intervals.icu.
        the band on her leg is how she knows which loft is yours.</div>
      <div style="margin:2px 0 8px"><span class="bandstate">the band is tied</span>
        <span class="fine muted" style="margin-left:6px">last flight a quarter-hour past &middot; every 15 min</span></div>
      <div class="writ" data-seam="HONEST INPUTS" data-tag="${TAG_HONEST}">
        <label for="set-aid">the loft she answers to</label>
        <input type="text" id="set-aid" value="i48211">
        <span class="whisper">your <b>athlete id</b> at intervals.icu &mdash; Settings &rarr; Developer</span>
        <label for="set-key">the mark that proves the loft yours</label>
        <input type="password" id="set-key" value="XXXXXXXXXXXXXXXX">
        <span class="whisper">your <b>api key</b>, already worn &mdash; leave it blank to keep the one she carries</span>
      </div>
      <button class="btn wide">TIE THE BAND &amp; SEND RAVENS</button>
      <div class="sec-foot">the first flight fetches four hundred days, and takes a while.
        on saving, the cage above only shows the band &mdash; nothing up there is a step.</div>
    </div>`;
  }

  function settingsMenu(open) {
    return `<div class="win setmenu" data-seam="THE MENU" data-tag="${TAG_MENU}">
      <span class="win-title">Settings &mdash; your room</span>
      <div class="menu-help">Everything is set <b>here</b>; the desk only shows it back.
        (Plain chrome on purpose &mdash; border kits will dress the menus later.)</div>

      ${secRow('name', '<i>Joe</i> &middot; to change your look, tap your portrait')}
      ${secRow('the lock', 'a pin is set &mdash; four digits keep this save yours')}
      ${secRow('adventurer', 'switch &mdash; three keep rooms at this inn')}
      ${secRow('sound', '<i>on</i>')}
      ${secRow('units', '<i>km</i> on the road &middot; <i>kg</i> at the rack')}
      ${secRow('the siege bell', '<i>UTC</i> &mdash; one bell rings the whole realm&rsquo;s week')}
      ${secRow('your clock', 'automatic from this device')}
      ${secRow('ambition', '<i>Forge</i> &mdash; how hard the givers push')}
      ${secRow('loop style', '<i>Scheduled</i> &mdash; the week below drives')}
      ${open === 'week' ? weekSection() : secRow('the week', 'five days hung, two rest &middot; Saturday just changed')}
      ${secRow('daily pointer', '<i>on</i> &mdash; one nudge at dawn')}
      ${secRow('the charter', 'the road, first &mdash; resting while the week drives')}
      ${open === 'ravens' ? ravensSection() : secRow('the ravens', 'the band is tied &middot; they fly every 15 min')}
    </div>`;
  }

  /* =========================================================================
     6. THE TWO FRAMES
     ========================================================================= */

  function sceneDesktop() {
    return `<div class="app-pad">
      ${IV.header({ phone: false })}
      <div class="setwrap">
        <div>
          <div style="margin-top:18px"><span class="desk-plate">Your room at the inn
            <small>the desk under the window &mdash; where your life is pinned, hung and notched</small></span></div>
          ${stageDesktop()}
          <div class="desk-cap" data-seam="NO TREE" data-tag="${TAG_NOTREE}">
            <span class="cap"><b>Your desk, up close.</b> The week on its pegs, the charter beside it,
            the raven banded by the window, the stick notched at the edge, your face in the glass.
            No hearth tree &mdash; the bazaar owns it now.</span></div>
        </div>
        <div>${settingsMenu('week')}</div>
      </div>
      ${IV.footer()}
    </div>`;
  }

  function scenePhone() {
    return `<div class="app-pad">
      ${IV.header({ phone: true })}
      <div class="setwrap">
        ${stagePhone()}
        <div class="desk-cap"><span class="cap"><b>the band is tied</b> &middot;
          ravens last flew a quarter-hour past &middot; they fly every 15 min</span></div>
        ${settingsMenu('ravens')}
      </div>
      ${IV.footer()}
    </div>
    ${IV.dock()}`;
  }

  /* =========================================================================
     7. THE WALL
     ========================================================================= */
  IV.page({
    title: 'Iron Vale — your room at the inn, the desk',
    subtitle: 'visual mockup, nothing wired up · the ledger formula applied to Settings · static/js/misc.js SCREENS.settings',
    note: '<b>The thesis.</b> The ledger formula, applied to Settings: <b>up-close, menu-driven, scene as state</b>. '
      + 'The previous pass built the whole room as a perspective box — door, bed, boots, hearth, tree, eleven '
      + 'labelled fixtures — and made the fixtures the controls. This one frames <b>your desk and the wall above '
      + 'it</b>, and puts the controls where Settings honestly wants them: <b>one bordered .win menu</b> with every '
      + 'section, the five that never had fixtures included. The desk shows the settings back — pegs for the week, '
      + 'a pinned charter, a banded raven by a slice of window with the last flight as her caption, a stick notched '
      + 'km/kg at the edge, your face in a small glass. Editing the week re-hangs the pegs; binding credentials '
      + 'ties the band; changing units recuts the notches — <b>decoration of a done thing, never a gate</b>. '
      + 'Credentials stay real typed fields. No NPC lives here, so no portrait; no hearth tree either — the '
      + 'bazaar&rsquo;s rework owns it. The menu is the tool; the desk shows your life.',
    legend: [
      { label: 'THE CROP', text: 'the frame holds your desk, not your room' },
      { label: 'THE MENU', text: 'one bordered .win panel sets everything — the driver' },
      { label: 'THE DESK', text: 'pegs, charter, band, notches, glass — settings shown back, never gates' },
      { label: 'THE SWING', text: 'the re-hung tag swings — animation decorates a saved change' },
      { label: 'HONEST INPUTS', text: 'a secret still has to be typed — real fields, real keyboard' },
      { label: 'NO TREE', text: 'the hearth tree moved to the bazaar thread&rsquo;s rework' },
    ],
    frames: {
      phone: {
        title: 'Phone — 414px bezel — THE RAVENS OPEN',
        sub: 'menu-first: the desk folds to a strip — pegs, banded raven, notched stick — and the credentials section stands open below, band shown tied',
        chips: ['the fold', 'menu first', 'credentials open', 'the band, tied'],
        html: scenePhone(),
      },
      desktop: {
        title: 'Desktop — 900px viewport, scaled to fit — THE WEEK OPEN',
        sub: 'the desk close-up with the menu beside it: schedule section open, pegs matching, Saturday&rsquo;s tag re-hung and still swinging',
        chips: ['the close crop', 'menu beside the desk', 'the week open', 'pegs match the rows', 'no tree'],
        url: 'ironvale.local:8322/#settings — your room',
        html: sceneDesktop(),
      },
    },
  });

  IV.boot();
</script>
</body>
