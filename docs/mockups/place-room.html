<title>Iron Vale — your own room, a scene</title>
<!-- Design mockup for Settings (static/js/misc.js:817) recast as a place: the
     room you keep at the inn. Nothing here is wired up; it is drawing paper.
     Chrome, tokens, fonts, sprite engine and tiles all come from _harness.js.

     SECOND PASS. The first pass drew a corkboard: every fixture pinned at eye
     height on one flat wall, a 7px floor strip, no corner, no ceiling, no light.
     This pass builds the room as a box — back wall meeting two side walls at
     visible corners, a ceiling with beams, a floor with real depth carrying a
     third of the frame, and ONE light source (the hearth) that falls on the
     surfaces near it. Furniture stands on the floor on its own legs; only the
     things you would actually hang are hung. -->
<script src="_harness.js"></script>

     0. sprite helper — pad ragged rows so hand-authored art can't skew a canvas
     ------------------------------------------------------------------------- */
  function normalize(defs) {
    var ragged = [];
    Object.keys(defs).forEach(function (k) {
      var rows = defs[k].r;
      var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
      if (rows.some(function (r) { return r.length !== w; })) ragged.push(k);
      defs[k].r = rows.map(function (r) { return r + new Array(w - r.length + 1).join('.'); });
    });
    if (ragged.length) console.warn('ragged sprite rows (padded):', ragged.join(', '));
    return defs;
  }

  /* ---------------------------------------------------------------------------
     3. THE ROOM AS A BOX — surfaces derived from one vanishing point.
        The back wall is the frame scaled about the VP; every corner line runs
        from a frame corner to the matching back-wall corner, so the floor's
        board seams, the wall joins and the ceiling beams all agree.
     ------------------------------------------------------------------------- */

  /* the back wall's horizontal boards, plus a dado rail */
  function wallArt(w, h) {
    return IV.tileURL(w, h, function (ctx, W, H) {
      var board = 13;
      for (var y = 0; y < H; y++) {
        var t = y / H;
        ctx.fillStyle = IV.blendHex('#6b4d2c', '#33240f', 0.66 - 0.20 * t);
        ctx.fillRect(0, y, W, 1);
      }
      for (var by = 0; by < H; by += board) {
        ctx.fillStyle = 'rgba(20,12,6,0.85)'; ctx.fillRect(0, by + board - 1, W, 1);
        ctx.fillStyle = 'rgba(168,132,80,0.18)'; ctx.fillRect(0, by, W, 1);
      }
      /* studs behind the boards, and a nail here and there */
      for (var x = 9; x < W; x += 61) {
        ctx.fillStyle = 'rgba(18,11,5,0.35)'; ctx.fillRect(x, 0, 2, H);
        for (var ny = 6; ny < H; ny += board * 3) {
          ctx.fillStyle = '#8a8a9a'; ctx.fillRect(x, ny, 1, 1);

    });

  /* the side walls: the same boards, but seen edge-on, so the board lines run
     back toward the vanishing point and the far end sits in shadow */
  function sideArt(w, h, toward) {
    return IV.tileURL(w, h, function (ctx, W, H) {
      for (var x = 0; x < W; x++) {
        var t = toward === 'left' ? x / W : 1 - x / W;   /* 1 = deep end */
        ctx.fillStyle = IV.blendHex('#523a24', '#20170b', 1 - 0.62 * t);
        ctx.fillRect(x, 0, 1, H);
      }
      ctx.globalAlpha = 0.5;
      for (var i = 0; i < 16; i++) {
        var y0 = (i / 15) * H, y1 = 0.18 * H + (i / 15) * 0.64 * H;
        ctx.strokeStyle = '#120c06'; ctx.lineWidth = 1;
        ctx.beginPath();
        if (toward === 'left') { ctx.moveTo(0, y0); ctx.lineTo(W, y1); }
        else { ctx.moveTo(W, y0); ctx.lineTo(0, y1); }

    });

  function floorArt(W, H, xl, xr) {
    return IV.tileURL(W, H, function (ctx, w, h) {
      for (var y = 0; y < h; y++) {

        ctx.fillStyle = IV.blendHex('#7a5a34', '#2a1e10', 0.12 + 0.48 * t);

        data-tag="A SECRET STILL HAS TO BE TYPED|The one place the fiction must not lie. An athlete id and an API key are text; no amount of world-building types them for you. So these stay real fields with real keyboards &mdash; the room changes where you are standing while you type them, not that you type them.">

  /* ---------------------------------------------------------------------------

  var PG = { w: 362, h: 900, xl: 40, xr: 322, yc: 44, yb: 430, fx: 75, fy: 382, shade: 268, mt: 12 };

      + rtag({ x: 40, y: 164, w: 96, n: 'the raven cage', s: 'tapped &mdash; opened below' })

      + carve({ x: 196, y: 161, w: 108, t: 'THE WEEK' })

      + rtag({ x: 30, y: 282, w: 96, n: 'the looking-glass', s: 'your name, your face' })

      + rtag({ x: 120, y: 348, w: 88, n: 'the hearth tree', s: 'what hangs, works', cls: 'up' })

    return roomBox(PG, inner) + bandPanel('ph-panel');

  function scene(phone) {
    return `<div class="app-pad">
      ${IV.header({ phone: phone })}
      ${phone ? phoneRoom() : desktopRoom()}
      ${IV.footer({ ravens: '2026-08-06 17:40' })}

  /* ---------------------------------------------------------------------------
     7. HANG IT ON THE WALL
     ------------------------------------------------------------------------- */
  IV.page({
    title: 'Iron Vale — your own room, a scene',
    subtitle: 'settings (misc.js:817) as the room you keep at the inn — visual mockup, nothing wired up',
    legend: [
      { label: 'THE BOX', text: 'back wall, two side walls, a corner each side, beams overhead, boards underfoot' },
      { label: 'ONE LIGHT', text: 'the hearth. everything warm in the frame is thrown by it' },
      { label: 'LABELS', text: 'tags on cords and text cut into the wood — a plate only where nothing can carry it' },
      { label: 'VOICE', text: 'ravens are sync; strike from the record is delete; no emoji, pixels only' },
    ],
    note: `<b>The thesis.</b> Settings is the densest form in the app — three tabs, eleven controls and a
      four-step modal picker hiding inside one of them — and it is the one screen with the most obvious
      diegetic home: <b>the room you keep at the inn</b>. Every setting already is a physical thing.
      The lock on the door is the PIN. The notches on the frame are the units. The band on the raven's
      leg is the intervals.icu link, because ravens are sync. The pegs over the desk are the week.
      <b>Nothing about the settings changed</b> — same values, same endpoints, same two text fields for a
      secret that genuinely has to be typed. What changed is where you are standing when you set them.
      <b>Second pass:</b> it is now a room rather than a wall — furniture stands on the floor on its own
      legs, only hung things hang, the floor carries a third of the frame, and the fire is the reason
      anything in here is lit.`,
    frames: {
      phone: {
        title: 'Phone — 414px bezel',
        sub: 'the same room, taller and narrower: you scroll down it from the beams to the near boards',
        chips: ['the same box', 'cage opened', 'the band', 'an honest form'],
        html: scene(true),
      },
      desktop: {
        title: 'Desktop — 900px viewport, scaled to fit',
        sub: 'the whole box: hearth and tree at the lit end, bed and pack in the dark corner, the peg rail standing open below',
        chips: ['a room, not a board', 'one light', 'peg rail opened', 'dev under the floor'],
        url: 'ironvale.local:8322 — your own room',
        html: scene(false),
      },
    },
  });

  /* aim each opened panel's tail back at the fixture it swung out of.
     offsetLeft math, not rects — the desktop frame lives inside a scale(). */
  function offLeft(el, stop) {
    var x = 0;
    while (el && el !== stop) { x += el.offsetLeft; el = el.offsetParent; }
    return x;
  }
  function aimTail(panelId, targetX, frameId) {
    var panel = document.getElementById(panelId);
    var frame = document.getElementById(frameId);
    if (!panel || !frame) return;
    panel.style.setProperty('--tailx', Math.round(targetX - offLeft(panel, frame)) + 'px');
  }
  function aimTails() {
    /* the peg rail sits inside the desktop room; the cage inside the phone room */
    var dkRoom = document.querySelector('#frame-desktop .room');
    var phRoom = document.querySelector('#frame-phone .room');
    if (dkRoom) aimTail('dk-panel', offLeft(dkRoom, document.getElementById('frame-desktop')) + 338 + 72, 'frame-desktop');
    if (phRoom) aimTail('ph-panel', offLeft(phRoom, document.getElementById('frame-phone')) + 52 + 30, 'frame-phone');
  }

  /* paint the five surfaces of both rooms */
  function hydrateRoom() {
    [DG, PG].forEach(function (g, i) {
      var root = document.getElementById(i === 0 ? 'frame-desktop' : 'frame-phone');
      if (!root) return;
      var back = root.querySelector('[data-rfill="back"]');
      var sideL = root.querySelector('[data-rfill="sideL"]');
      var sideR = root.querySelector('[data-rfill="sideR"]');
      var floor = root.querySelector('[data-rfill="floor"]');
      if (back) {
        back.style.backgroundImage = wallArt(g.xr - g.xl, g.yb - g.yc);
        back.style.backgroundSize = (g.xr - g.xl) + 'px ' + (g.yb - g.yc) + 'px';
      }
      if (sideL) {
        sideL.style.backgroundImage = sideArt(Math.max(2, g.xl), g.h, 'left');
        sideL.style.backgroundSize = g.xl + 'px ' + g.h + 'px';
        sideL.style.backgroundRepeat = 'no-repeat';
      }
      if (sideR) {
        var rw = g.w - g.xr;
        sideR.style.backgroundImage = sideArt(Math.max(2, rw), g.h, 'right');
        sideR.style.backgroundSize = rw + 'px ' + g.h + 'px';
        sideR.style.backgroundPosition = 'right top';
        sideR.style.backgroundRepeat = 'no-repeat';
      }
      if (floor) {
        floor.style.backgroundImage = floorArt(g.w, g.h - g.yb, g.xl, g.xr);
        floor.style.backgroundSize = g.w + 'px ' + (g.h - g.yb) + 'px';
        floor.style.backgroundRepeat = 'no-repeat';
      }
    });
  }

  var baseLayout = IV.layout;
  IV.layout = function () { baseLayout(); aimTails(); };

  IV.boot();
  hydrateRoom();
  IV.layout();
</script>
