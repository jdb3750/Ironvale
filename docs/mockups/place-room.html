     0. sprite helper — pad ragged rows so hand-authored art can't skew a canvas
     ------------------------------------------------------------------------- */
  function normalize(defs) {
    var ragged = [];
    Object.keys(defs).forEach(function (k) {
      var rows = defs[k].r;
      var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
      if (rows.some(function (r) { return r.length !== w; })) ragged.push(k);
      defs[k].r = rows.map(function (r) { return r + new Array(w - r.length + 1).join('.'); });
    });
    if (ragged.length) console.warn('ragged sprite rows (padded):', ragged.join(', '));
    return defs;
  }

  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1px; text-transform:uppercase; padding:1px 6px; }

.iv .writ label { display:block; color:var(--blue); font-family:var(--font-body); font-size:var(--type-body);
  text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.iv .writ input { width:100%; background:#000; color:var(--ink); border:2px solid var(--gold);

    var el = document.createElement('style');
    el.id = 'room-styles';

  /* ---------------------------------------------------------------------------
     3. SCENE PIECES
     ------------------------------------------------------------------------- */
  var S = IV.spriteTag;

  function glyphs(strikeLabel) {
    return `<span class="board-glyph glyph-l">${S('glyph_quill', 22)}<span class="g-cap">${strikeLabel}</span></span>
      <span class="board-glyph glyph-r">${S('glyph_close', 22)}<span class="g-cap">leave it be</span></span>`;
  }

  /* the week, hung on pegs — this whole panel stands in for the multi-step
     schedule chooser at misc.js:561 */
  var WEEK = [
    { day: 'MON', tags: [{ n: 'the iron', s: 'upper — press day' }] },
    { day: 'TUE', tags: [{ n: 'a long run', s: 'steady' }] },
    { day: 'WED', tags: [] },
    { day: 'THU', tags: [{ n: 'the iron', s: 'lower — pull day' }, { n: 'a swim', s: 'easy', loose: true }] },
    { day: 'FRI', tags: [{ n: 'a ride', s: 'brisk' }] },
    { day: 'SAT', tags: [{ n: 'a climb', s: 'hard', hand: true }] },
    { day: 'SUN', tags: [] },
  ];

  function pegDay(d) {
    var hung = d.tags.map(function (t) {
      return `<span class="cord"></span>
        <span class="hangtag ${t.loose ? 'loose' : ''} ${t.hand ? 'inhand' : ''}">
          <b>${t.n}</b><small>${t.s}</small></span>`;
    }).join('');
    return `<div class="pegday">
      <span class="pd-day">${d.day}</span>
      <span class="pd-rail"></span>
      <span class="peg"></span>
      <div class="pd-hang">${hung || '<span class="pd-rest">bare peg —<br>the day rests</span>'}</div>
      ${d.tags.some(function (t) { return t.loose; }) ? '<span class="pd-note">hung loose —<br>if the day allows</span>' : ''}
      ${d.tags.some(function (t) { return t.hand; }) ? '<span class="pd-note">in hand —<br>let it go to hang it</span>' : ''}
    </div>`;
  }

  function pegPanel(idAttr) {
    return `<div class="rack tail-up opened" id="${idAttr}"
        data-seam="PEG BOARD"
        data-tag="THE PEG BOARD|The weekly counsel schedule, whole, on one board. Today every slot opens a four-step modal picker (misc.js:561). Here you move a peg &mdash; no steps, no picker, no stacked dialogs.">
      ${glyphs('strike the week from the record')}
      <div class="rk-head">
        <div class="rk-title">the peg board</div>
        <div class="rk-sub">seven pegs over the desk. hang work on a day; lift it off to unhang it. a bare peg is a day of rest.</div>
      </div>
      <div class="pegwall">${WEEK.map(pegDay).join('')}</div>
      <div class="rk-foot">sworn paths kept this week: 3 of 5 &middot; the board is the plan; nothing is saved twice.</div>
    </div>`;
  }

  function bandPanel(idAttr) {
    return `<div class="rack tail-up opened" id="${idAttr}"
        data-seam="RAVEN CAGE"
        data-tag="THE BAND ON THE RAVEN'S LEG|The intervals.icu credentials. Ravens are sync, so the credentials are simply how your raven knows whose loft to fly to — bound or unbound is whether the band is on. Same two values, same endpoint, read off a bird instead of an API tab.">
      ${glyphs('strike the band from the record')}
      <div class="rk-head">
        <div class="rk-title">the band on her leg</div>
        <div class="rk-sub">she carries your runs, climbs, lifts and rest home from the loft at intervals.icu. the band is how she knows which loft is yours.</div>
      </div>
      <div class="bandrow">
        ${S('fx_raven', 110, 'mark')}
        <div style="text-align:center">
          ${S('fx_band', 72)}
          <div style="margin-top:5px"><span class="bandstate">the band is tied</span></div>
        </div>
      </div>
      <div class="writ"
        data-seam="HONEST FORM"
        data-tag="A SECRET STILL HAS TO BE TYPED|The one place the fiction must not lie. An athlete id and an API key are text; no amount of world-building types them for you. So these stay real fields with real keyboards — the room changes where you are standing while you type them, not that you type them.">
        <label for="band-loft">the loft she answers to</label>
        <input type="text" id="band-loft" value="i48211">
        <span class="whisper">your <b>athlete id</b> at intervals.icu &mdash; Settings &rarr; Developer</span>
        <label for="band-mark">the mark that proves the loft yours</label>
        <input type="password" id="band-mark" value="XXXXXXXXXXXXXXXX">
        <span class="whisper">your <b>api key</b>, already worn &mdash; leave it blank to keep the one she carries</span>
      </div>
      <button class="btn wide" style="margin-top:2px">TIE THE BAND &amp; LET HER FLY</button>
      <div class="rk-foot flight">ravens last flew a quarter-hour past; they fly every fifteen minutes.<br>
        the first flight fetches four hundred days, and takes a while.</div>
    </div>`;
  }

  /* ---------------------------------------------------------------------------
     4. THE DESKTOP ROOM — the whole room in one view
     ------------------------------------------------------------------------- */
  function desktopRoom() {
    return `<div class="room">
      <div class="wall" data-fill="wood">
        <div class="bays">

          <div class="fx tappable" style="width:132px"
            data-seam="DOOR"
            data-tag="THE LOCK ON THE DOOR|The PIN. Setting one is turning the key; the plate reads locked or unlocked and there is nothing else to read.">
            <span class="splate">the door<small>the lock keeps this save yours</small></span>
            <div class="fx-art" style="gap:0">
              <span data-seam="STICK"
                data-tag="THE MEASURING STICK|Units. Notched both ways down the frame; tap to flip which notches are read. One stick answers km/miles and kg/lb.">${S('fx_stick', 32, 'mark')}</span>
              ${S('fx_door', 100, 'mark')}
            </div>
          </div>

          <div class="fx tappable" style="width:74px"
            data-seam="MIRROR"
            data-tag="THE MIRROR|Display name and appearance. One act, one object: you look at yourself and change what you see.">
            <span class="splate">the looking-glass<small>your name, your face</small></span>
            <div class="fx-art" style="flex-direction:column; align-items:center; gap:20px; padding-bottom:58px">
              ${S('fx_lantern', 30)}
              ${S('fx_mirror', 70, 'mark')}
            </div>
          </div>

          <div class="fx tappable" style="width:152px"
            data-seam="BED &amp; PACK"
            data-tag="THE PACK BY THE BED|Ambition &mdash; Mend, Keep, Forge, Conquer. How much you mean to carry, so you heft a pack instead of picking a row of buttons.">
            <span class="splate">the pack<small>how much you mean to carry</small></span>
            <div class="fx-art">${S('fx_bed', 112)}${S('fx_pack', 36, 'mark')}</div>
          </div>

          <div class="fx tappable" style="width:144px"
            data-seam="DESK"
            data-tag="THE CHARTER, PINNED|The focus charter, primary and secondary. Handwritten paper above the desk &mdash; which is what a charter already is.">
            <span class="splate">the desk<small>board above it, charter pinned</small></span>
            <div class="fx-art" style="flex-direction:column; align-items:center; gap:5px">
              <div class="charter"><b>THE CHARTER</b>the road, first.<br>then the iron, then<br>the water. <i>&mdash; sworn in spring</i></div>
              <div id="dk-board">${S('fx_pegboard', 140, 'mark')}</div>
              ${S('fx_desk', 130)}
            </div>
          </div>

          <div class="fx tappable" style="width:162px"
            data-seam="WINDOW"
            data-tag="THE CAGE BY THE WINDOW|Ravens are sync, so the intervals.icu link lives in the cage: band on her leg means bound. Opened on the phone frame.">
            <span class="splate">the raven cage<small>she flies every fifteen minutes</small></span>
            <div class="fx-art" style="gap:6px">
              <div style="padding-bottom:40px">${S('fx_window', 96)}</div>
              ${S('fx_cage', 60, 'mark')}
            </div>
          </div>

          <div class="fx tappable" style="width:130px"
            data-seam="HEARTH TREE"
            data-tag="THE HEARTH TREE|Placed, not redesigned. What hangs on the tree works; what sleeps in the box only sleeps. Build the room once and it serves both features &mdash; plugins take the corner, settings take the walls, neither needs its own screen.">
            <span class="splate">the hearth tree<small>what hangs, works</small></span>
            <div class="fx-art" style="gap:2px">
              ${S('fx_tree', 72, 'mark')}
              ${S('fx_ornbox', 54)}
            </div>
          </div>

        </div>
      </div>
      <div class="floorline"></div>
      <div class="rmfloor" data-fill="planks">
        <div class="bays">

          <div class="fx tappable" style="width:132px"
            data-seam="BOOTS"
            data-tag="THE BOOTS BY THE DOOR|Game-loop style &mdash; Considered, Choose-your-own, Scheduled. How you like to travel. The pack said how far; the boots say how.">
            <span class="splate">the boots<small>how you like to travel</small></span>
            <div class="fx-art">${S('fx_boots', 54, 'mark')}</div>
          </div>

          <div style="flex:1"></div>

          <div class="fx hushed" style="width:180px"
            data-seam="LOOSE BOARD"
            data-tag="THE LOOSE FLOORBOARD|Dev mode. Drawn at the tone of the floor, its plate barely lit: you find it because you already know it is there.">
            <span class="splate">a board that gives<small>(it does not announce itself)</small></span>
            <div class="fx-art">${S('fx_loose', 156)}</div>
          </div>

        </div>
      </div>
    </div>
    ${pegPanel('dk-panel')}`;
  }

  /* ---------------------------------------------------------------------------
     5. THE PHONE FOLD — the same room, stacked, with the cage open instead
     ------------------------------------------------------------------------- */
  function card(opts) {
    return `<div class="fxcard ${opts.cls || ''}" data-fill="wood" ${opts.id ? `id="${opts.id}"` : ''} ${opts.attrs || ''}>
      <div class="fx-art">${opts.art}</div>
      <span class="splate">${opts.name}<small>${opts.sub}</small></span>
    </div>`;
  }

  function phoneRoom() {
    return `<div class="fold"
        data-seam="THE FOLD"
        data-tag="THE SAME ROOM, FOLDED|Nothing dropped, nothing renamed &mdash; the bays become cards in reading order and the floorline still runs under them. A player who learned the room on a desk knows it on a phone.">
      ${card({ name: 'the door', sub: 'the lock keeps this save yours', art: S('fx_door', 40) })}
      ${card({ name: 'the stick', sub: 'read in km &amp; kg', art: S('fx_stick', 24) })}
      ${card({ name: 'the looking-glass', sub: 'your name, your face', art: S('fx_mirror', 42) })}
      ${card({ name: 'the pack', sub: 'how much you mean to carry', art: S('fx_bed', 84) + S('fx_pack', 24) })}
      ${card({ name: 'the boots', sub: 'how you like to travel', art: S('fx_boots', 54) })}
      ${card({ name: 'the charter', sub: 'what you swore to work toward',
        art: '<div class="charter" style="width:104px"><b>THE CHARTER</b>the road, first.<br>then the iron,<br>then the water.</div>' })}
      ${card({ name: 'the peg board', sub: 'the week, hung', art: S('fx_pegboard', 84) })}
      ${card({ name: 'the hearth tree', sub: 'what hangs, works', art: S('fx_tree', 48) + S('fx_ornbox', 36) })}
      ${card({ cls: 'hushed', name: 'a board that gives', sub: '(it does not announce itself)', art: S('fx_loose', 104) })}
      ${card({ name: 'the lantern', sub: 'the room is warm enough', art: S('fx_lantern', 30) })}
      ${card({ cls: 'wide tapped', id: 'ph-cage', name: 'the raven cage, opened',
        sub: 'tapped &mdash; the panel below swung out of it',
        art: `<div style="padding-bottom:26px">${S('fx_window', 76)}</div>${S('fx_cage', 60, 'mark')}` })}
    </div>
    <div class="fold-floor"></div>
    ${bandPanel('ph-panel')}`;
  }

  function scene(phone) {
    return `<div class="app-pad">
      ${IV.header({ phone: phone })}
      ${phone ? phoneRoom() : desktopRoom()}
      ${IV.footer({ ravens: '2026-08-06 17:40' })}
    </div>
    ${phone ? IV.dock() : ''}`;
  }

  /* ---------------------------------------------------------------------------
     6. HANG IT ON THE WALL
     ------------------------------------------------------------------------- */
  IV.page({
    title: 'Iron Vale — your own room, a scene',
    subtitle: 'settings (misc.js:817) as the room you keep at the inn — visual mockup, nothing wired up',
    legend: [
      { label: 'DESKTOP', text: 'the whole room in one view, with the peg board open' },
      { label: 'PHONE', text: 'the same room folded, with the raven cage open' },
      { label: 'GLYPHS', text: 'utilities are corner glyphs in the ✕ weight class, never a button row' },
      { label: 'VOICE', text: 'ravens are sync; strike from the record is delete; no emoji, pixels only' },
    ],
    note: `<b>The thesis.</b> Settings is the densest form in the app — three tabs, eleven controls and a
      four-step modal picker hiding inside one of them — and it is the one screen with the most obvious
      diegetic home: <b>the room you keep at the inn</b>. Every setting already is a physical thing.
      The lock on the door is the PIN. The notches on the door frame are the units. The band on the raven's
      leg is the intervals.icu link, because ravens are sync. The pegs over the desk are the week.
      <b>Nothing about the settings changed</b> — same values, same endpoints, same two text fields for a
      secret that genuinely has to be typed. What changed is where you are standing when you set them.`,
    frames: {
      phone: {
        title: 'Phone — 414px bezel',
        sub: 'the room folded into fixture cards; the raven cage is the fixture standing open',
        chips: ['the fold', 'cage opened', 'the band', 'an honest form'],
        html: scene(true),
      },
      desktop: {
        title: 'Desktop — 900px viewport, scaled to fit',
        sub: 'bed, desk, window and cage, mirror, door with its lock and stick, the hearth tree in the corner — and the peg board standing open',
        chips: ['whole room', 'peg board opened', 'hearth tree placed', 'dev under the floor'],
        url: 'ironvale.local:8322 — your own room',
        html: scene(false),
      },
    },
  });

  /* aim each opened panel's tail back at the fixture it swung out of.
     offsetLeft math, not rects — the desktop frame lives inside a scale(). */
  function offLeft(el, stop) {
    var x = 0;
    while (el && el !== stop) { x += el.offsetLeft; el = el.offsetParent; }
    return x;
  }
  function aimTail(panelId, targetId, frameId) {
    var panel = document.getElementById(panelId);
    var target = document.getElementById(targetId);
    var frame = document.getElementById(frameId);
    if (!panel || !target || !frame) return;
    var x = offLeft(target, frame) + target.offsetWidth / 2 - offLeft(panel, frame);
    panel.style.setProperty('--tailx', Math.round(x) + 'px');
  }
  function aimTails() {
    aimTail('dk-panel', 'dk-board', 'frame-desktop');
    aimTail('ph-panel', 'ph-cage', 'frame-phone');
  }

  /* floorboards: the harness's woodTile() is vertical planks, which reads as a
     timber wall; the floor wants the same trick turned on its side. */
  function plankTile() {
    return IV.tileURL(144, 26, function (ctx, w, h) {
      ctx.fillStyle = '#503c28'; ctx.fillRect(0, 0, w, 13);
      ctx.fillStyle = '#4a3623'; ctx.fillRect(0, 13, w, 13);
      ctx.fillStyle = '#33240f';
      ctx.fillRect(0, 12, w, 1); ctx.fillRect(0, 25, w, 1);
      /* one board end per course, far apart, so it never reads as brickwork */
      ctx.fillRect(31, 0, 1, 12); ctx.fillRect(103, 13, 1, 12);
      ctx.fillStyle = '#5e4832';
      ctx.fillRect(6, 4, 22, 1); ctx.fillRect(64, 3, 30, 1);
      ctx.fillRect(20, 18, 34, 1); ctx.fillRect(110, 17, 26, 1);
      ctx.fillStyle = '#402e1c';
      ctx.fillRect(40, 8, 26, 1); ctx.fillRect(72, 21, 24, 1);
    });
  }
  function hydrateFloor() {
    var url = plankTile();
    document.querySelectorAll('[data-fill="planks"]').forEach(function (el) {
      el.style.backgroundImage = url;
      el.style.backgroundSize = '144px 26px';
    });
  }

  var baseLayout = IV.layout;
  IV.layout = function () { baseLayout(); aimTails(); };

  IV.boot();
  hydrateFloor();
  IV.layout();
</script>
