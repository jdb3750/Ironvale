<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Vale — the Bazaar Row, a scene</title>
<!-- Design mockup. Nothing here is wired up; it is drawing paper for
     docs/plugin-bazaar-plan.md §8b, built on docs/mockups/_harness.js.
     Rebuilt to fold in the author's seven boss-call rulings
     (docs/plugin-bazaar-plan.md, diff 4e7e65c) after the design critique
     at docs/plugin-bazaar-critique.md. -->
<script src="_harness.js"></script>
<body>
<script>
  IV.injectStyles();

  /* ==========================================================================
     1. SCENE CSS — the market lane. Reuses the harness's .yard/.sky/.ground/
        .hrow bones (the same "outdoor scene under one sky" grammar the town
        square and the Drill Yard both use) and adds only the row's own
        furniture: stalls, canopies, counters, signboards and the raven.
     ========================================================================== */
  (function () {
    var css = `
/* ================= THE BAZAAR ROW ================= */
.iv .row-scene { position:relative; border:2px solid #4a3d20; margin:12px 4px 4px;
  image-rendering:pixelated; overflow:hidden; }
.iv .row-sky { height:150px; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#7ea8d8 0,#a8c8e0 55%,#c8dcea 100%); }
.iv .row-sky .mtns { position:absolute; bottom:0; left:0; right:0; height:60px;
  background-repeat:repeat-x; background-position:bottom left; background-size:220px 60px; opacity:0.55; }
/* a calmer market-morning cloud dither than the full town sky: a few soft
   masses, not a wall of texture behind four stalls, four boards and a raven
   (boss call 7 — canon density, quieter atmosphere) */
.iv .row-sky .cloud { position:absolute; border-radius:50%; background:rgba(255,255,255,0.5); filter:blur(1px); }
.iv .row-ground { position:relative; padding:0 10px 14px; background-color:#5a7c3e; border-top:4px solid #2f4026; }
.iv .row-ground::before { content:''; position:absolute; inset:0; z-index:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.28), rgba(0,0,0,0.03) 40%, rgba(0,0,0,0.22));
  pointer-events:none; }
/* a normal-flow strip below the stalls — the road the hero stands on. Not
   absolutely positioned against the whole ground, so it can never collide
   with the caption that follows it in flow (craft fix: seat his feet on the
   road strip's top edge, fully inside the frame). */
.iv .foreground-row { position:relative; height:66px; margin-top:2px; z-index:2; }
.iv .foreground-row::before { content:''; position:absolute; left:-10px; right:-10px; bottom:0; height:24px;
  background:linear-gradient(180deg,#8a7a5e,#6a5c44); border-top:2px solid #4a3d20; z-index:0; }

/* the lane: four stalls at the town's own building scale (5x — the same
   register as the square's bld() art), evenly spaced along the row */
.iv .brow { display:flex; justify-content:space-evenly; align-items:flex-end;
  margin-top:-4px; position:relative; z-index:2; gap:6px; flex-wrap:wrap; }
.iv .stall { text-align:center; position:relative; cursor:pointer; }
.iv .stall:hover .canopy, .iv .stall:hover .counter { filter:brightness(1.12); }

.iv .canopy { position:relative; width:118px; height:56px; margin:0 auto;
  clip-path:polygon(4% 100%, 0 30%, 50% 0, 100% 30%, 96% 100%); }
.iv .canopy.dyer { background:repeating-linear-gradient(45deg,#8a4ac0 0 9px,#6a2ea0 9px 18px); border-bottom:3px solid #4a1e78; }
.iv .canopy.scriv { background:repeating-linear-gradient(90deg,#a83828 0 10px,#7a2418 10px 20px); border-bottom:3px solid #521608; }
.iv .canopy.tinker { background:#5a5a68; border-bottom:3px solid #2c2c34; }
.iv .canopy.bell { background:#3a6a3a; border-bottom:3px solid #1e3c1e; }
.iv .canopy-scallop { position:absolute; left:0; right:0; bottom:-6px; height:8px;
  background-repeat:repeat-x; background-size:12px 8px; }
.iv .canopy.dyer + .canopy-scallop, .canopy-scallop.dyer { background-image:linear-gradient(135deg,#6a2ea0 50%,transparent 50%); }

.iv .counter { position:relative; width:132px; height:44px; margin:-2px auto 0;
  border:2px solid #241a0e; box-shadow:2px 3px 0 rgba(0,0,0,0.45); }
.iv .counter-top { position:absolute; left:-3px; right:-3px; top:-3px; height:5px; background:#8a6a40; border:1px solid #4c3820; }

/* the stall's stage: canopy + merchant + goods + counter all live inside a
   fixed-height box, so their absolute positioning can never bleed into the
   signboard/name that follow in normal flow below */
.iv .stall-stage { position:relative; height:112px; }
.iv .stall-stage .canopy, .iv .stall-stage .counter { position:absolute; left:50%; }
.iv .stall-stage .canopy { top:0; transform:translateX(-50%); }
.iv .stall-stage .counter { bottom:0; transform:translateX(-50%); }

/* the merchant, standing behind the boards */
.iv .stall .merchant { position:absolute; bottom:40px; left:50%; margin-left:-24px; z-index:1; line-height:0; }
.iv .stall .merchant canvas { filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.45)); }

/* goods set out on the counter — plain small icons, nothing fancy */
.iv .goods-row { position:absolute; bottom:36px; left:0; right:0; display:flex;
  justify-content:center; gap:8px; z-index:2; }
.iv .goods-row canvas { filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.5)); }

/* the signboard: trade + count, and nothing more (signboard law) */
.iv .signboard { margin:8px auto 0; display:inline-block; padding:4px 10px;
  background:linear-gradient(180deg,#7d5f36,#4a3620); border:2px solid #2a1d10;
  box-shadow:2px 3px 0 rgba(0,0,0,0.5); font-family:var(--font-fine); font-size:var(--type-fine);
  letter-spacing:0.5px; color:#ffeab4; text-shadow:1px 1px 0 #1c1208; white-space:nowrap; }
.iv .signboard .fresh { display:block; margin-top:1px; color:#f0c060; font-style:italic; }
.iv .stall-name { display:block; margin-top:4px; color:var(--gold-bright);
  font-family:var(--font-body); font-size:var(--type-body); }
.iv .stall-name small { display:block; color:var(--dim-readable); font-family:var(--font-fine); font-size:var(--type-fine); }

/* the selected stall shows life with light, not a brighter checker pattern —
   a lit lantern on the crossbeam and the merchant's arm raised */
.iv .stall.selected .lantern-glow { position:absolute; top:2px; right:14px; z-index:3;
  filter:drop-shadow(0 0 6px rgba(250,210,120,0.9)); }
.iv .stall.selected .stall-name { text-shadow:0 0 6px rgba(240,208,128,0.6); }

/* ---- the raven: ONE, perched on the Bellmaker's canopy, the same 2px
   string idiom the ware-tag uses hanging its tag from its beak. No bang,
   no second signal — the raven IS the exclamation mark (tear 1). ---- */
.iv .raven-perch { position:absolute; top:-20px; right:14px; z-index:4; line-height:0; }
.iv .raven-perch canvas { filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.6)); }
.iv .raven-string { position:absolute; top:100%; left:50%; width:1px; height:16px;
  background:#c8c2a8; opacity:0.8; }
.iv .raven-tag { position:absolute; top:calc(100% + 16px); left:50%; transform:translateX(-50%);
  width:150px; padding:5px 7px; background:#efe6c2; border:1px solid #8a7a4a;
  box-shadow:3px 3px 0 rgba(0,0,0,0.55); font-family:var(--font-fine); font-size:var(--type-fine);
  color:#3a3222; line-height:1.35; text-align:left; }
.iv .raven-tag b { color:#5a1608; }

/* the hero, planted on the road strip, fully inside the frame — at the
   game's own town scale, matching the stalls (boss call 7) */
.iv .hero-step { position:absolute; left:22px; bottom:20px; z-index:1; text-align:center; }
.iv .hero-step canvas { filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.5)); }
.iv .hero-cue { margin-top:2px; display:inline-block; padding:2px 7px; background:#1a1208;
  border:2px solid #8a6a40; color:#f0d080; font-family:var(--font-fine); font-size:var(--type-fine); white-space:nowrap; }

.iv .row-cap { position:relative; z-index:4; margin:14px 0 0; max-width:600px; }
.iv .row-cap .cap { display:inline-block; background:rgba(26,16,10,0.9); border:1px solid #6a512a;
  border-top-color:#8a6a40; padding:5px 11px 6px; color:#cfc6b0;
  box-shadow:0 5px 10px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.5); }
.iv .row-cap .cap b { color:var(--gold-bright); font-weight:400; }

/* phone: the two-column town grid, stalls in pairs, nothing redesigned */
.iv-phone .brow { display:grid; grid-template-columns:1fr 1fr; gap:14px 4px; justify-items:center; }
.iv-phone .stall-stage { height:88px; }
.iv-phone .canopy { width:88px; height:42px; }
.iv-phone .counter { width:98px; height:34px; }
.iv-phone .stall .merchant { bottom:30px; margin-left:-18px; }
.iv-phone .goods-row { bottom:26px; gap:5px; }
.iv-phone .foreground-row { height:74px; margin-top:8px; }
.iv-phone .foreground-row::before { height:16px; }
.iv-phone .hero-step { left:8px; bottom:6px; }
.iv-phone .row-sky { height:118px; }
.iv-phone .raven-tag { width:120px; font-size:9px; }
.iv-phone .row-cap { max-width:none; }
`;
    var el = document.createElement('style');
    el.id = 'iv-bazaar-row-scene';
    el.textContent = css;
    document.head.appendChild(el);
  })();

  /* ==========================================================================
     2. SCENE SPRITES
     ========================================================================== */
  IV.addSprites({
    /* the raven — small, dark, ONE in the whole scene, sized to sit on a
       5x stall's canopy rather than the 7x-scale bird the critique tore up */
    raven: { p: { k:'#26222f', K:'#3a3446', y:'#f0d060' }, r: [
      '...kk.......',
      '..kkkk......',
      '.kkkkkkk....',
      'kkKKKKkkkk..',
      'kkKykKKkkkk.',
      '.kKKKKKkkkk.',
      '..kkkkkkkk..',
      '...kk..kk...',
    ]},
    /* the wares, drawn plain — one recognizable icon each, nothing gilded */
    dye_drop: { p: { p:'#8a4ac0', P:'#b47ae0', k:'#4a1e78' }, r: [
      '....P....', '...PPP...', '..PppPPp..', '.Ppppppp.', '.PppppPp.',
      '.PpppppP.', '..Pppppp.', '...ppp...', '....k....',
    ]},
    scroll_book: { p: { k:'#1a0c0a', c:'#8a2c20', p:'#efe7d2', g:'#c9a24b' }, r: [
      '.kkkkkkkk.', 'kccccccck', 'kcppppcck', 'kcpggpcck', 'kcppppcck',
      'kcccccck.', '.kkkkkkk.',
    ]},
    gear_charm: { p: { i:'#7a7a88', I:'#b4b4c0', k:'#2a2a34' }, r: [
      '.i.ii.i..', 'iIIiIIIii', '.IiiiiiI.', 'iIikkiIIi', '.Iiiiii..',
      'iIIiIIIii', '.i.ii.i..',
    ]},
    bell_charm: { p: { g:'#c9a24b', G:'#f0d080', k:'#6b5426' }, r: [
      '..gggg..', '.gGGGGg.', '.gGGGGg.', 'gGGGGGGg', 'gGkkkkGg',
      '.gGGGGg.', '...kk...',
    ]},
    /* Corvin, the Scrivener's Stall — Wick's estranged brother. Same face,
       same spectacles, same hair as Wick's own sprite (pixel.js:408); only
       the dress differs — rust trader's robe and pewter trim in place of
       Wick's blue and gold (ruling: an outland rival with Wick's own face
       in different dress). */
    corvin: { p: { h:'#8a8478', f:'#e0c0a0', K:'#1a1410', s:'#8a8a9a', r:'#6a3a2a', R:'#8a5238', q:'#c9bfa8' }, r: [
      '................', '....hhhhhhhh....', '...hhhhhhhhhh...', '..hhffffffffhh..',
      '..hfffffffffhh..', '..hfsKsffsKsfh..', '..hffffffffffh..', '..hffffssffffh..',
      '..hhffffffffhh..', '...hffffffffh...', '...rrrrrrrrrr...', '..rRRRRRRRRRRr..',
      '..rRRqqqqqqRRr..', '.rRRRqqqqqqRRRr.', '.rRRRRRRRRRRRRr.', '................',
    ]},
    /* a generic stallkeep silhouette, recolored per stall via CSS filter */
    keeper: { p: { h:'#6a4428', f:'#e0b088', K:'#1a1410', r:'#5a4a6a', R:'#726092' }, r: [
      '................', '....hhhhhhhh....', '...hhhhhhhhhh...', '..hhffffffffhh..',
      '..hfffffffffhh..', '..hfffKffKfffh..', '..hffffffffffh..', '..hhffffffhh....',
      '...rrrrrrrrrr...', '..rRRRRRRRRRRr..', '..rRRRRRRRRRRr..', '.rRRRRRRRRRRRRr.',
      '.rRRRRRRRRRRRRr.', '................',
    ]},
    lantern_small: { p: { i:'#5a5a68', y:'#f0d060', Y:'#fff4c8' }, r: [
      '..ii..', '.iYYi.', '.iyyi.', '.iYYi.', '..ii..',
    ]},
  });

  /* ==========================================================================
     3. MARGIN NOTES
     ========================================================================== */
  var TAG_SCALE = '5X, ONE VILLAGE|'
    + 'Stalls at the square’s own building scale, canonical sky, hero at his '
    + 'town scale &mdash; the Bazaar is the same village seen from its market '
    + 'lane, not a close-up staged for legibility (ruling 7).';
  var TAG_RAVEN = 'ONE RAVEN, ONE STALL|'
    + 'A single raven perches on the ware whose update it brings &mdash; here, '
    + 'the Bellmaker’s Cart. No bang, no second signal; the raven is the '
    + 'exclamation mark, and it speaks the version plainly (ruling 1).';
  var TAG_SIGN = 'THE SIGNBOARD LAW|'
    + '“A board tells the trade and the count &mdash; no more.” Trade + an '
    + 'in-world count, and nothing else printed on the board itself.';
  var TAG_CORVIN = 'WICK’S ESTRANGED BROTHER|'
    + 'The Scrivener’s Stall is run by an outland rival with Wick’s own face '
    + 'in different dress. Wick refuses to speak of him (ruling 2).';
  var TAG_SELECT = 'LIGHT, NOT CHECKER|'
    + 'The stall awaiting you shows life &mdash; a lit lantern on its crossbeam '
    + 'and the vendor’s arm raised &mdash; instead of a brighter awning pattern.';

  /* ==========================================================================
     4. THE STALLS
     ========================================================================== */

  function stall(opts) {
    var goods = (opts.goods || []).map(function (g) { return IV.spriteTag(g, opts.iconPx || 22); }).join('');
    return `<div class="spot stall ${opts.selected ? 'selected' : ''}" ${opts.seam ? `data-seam="${opts.seam}" data-tag="${opts.tag}"` : ''}>
      <div class="stall-stage">
        ${opts.raven ? `<div class="raven-perch">${IV.spriteTag('raven', opts.ravenPx || 26)}
            <div class="raven-string"></div>
            <div class="raven-tag">&ldquo;krrk. the Bellmaker has mended his Bells &mdash; <b>${opts.raven}</b>&rdquo;</div>
          </div>` : ''}
        ${opts.selected ? `<span class="lantern-glow">${IV.spriteTag('lantern_small', 16)}</span>` : ''}
        <div class="canopy ${opts.cls}"></div>
        <div class="merchant" style="filter:${opts.hue || ''}">${IV.spriteTag(opts.keeper || 'keeper', opts.keeperPx || 60)}</div>
        <div class="goods-row">${goods}</div>
        <div class="counter"><div class="counter-top"></div></div>
      </div>
      <span class="signboard">${opts.trade}<span class="fresh">${opts.fresh || ''}</span></span>
      <span class="stall-name">${opts.name}<small>${opts.sub}</small></span>
    </div>`;
  }

  function row(phone) {
    return `<div class="row-scene" data-seam="SCALE" data-tag="${TAG_SCALE}">
      <div class="row-sky">
        <div class="cloud" style="left:6%;top:14px;width:70px;height:20px"></div>
        <div class="cloud" style="left:38%;top:28px;width:56px;height:16px"></div>
        <div class="cloud" style="left:70%;top:10px;width:82px;height:22px"></div>
        <div class="mtns" data-fill="mtns"></div>
      </div>
      <div class="row-ground" data-fill="dirt">
        <div class="brow">
          ${stall({ cls:'dyer', name:'The Dyer’s Tent', sub:'cloths & colors', trade:'Dyes — five wares',
            goods:['dye_drop','dye_drop'], hue:'hue-rotate(0deg)', keeperPx:60 })}
          ${stall({ cls:'scriv', name:'The Scrivener’s Stall', sub:'doctrines & roads', trade:'Scrolls — four',
            goods:['scroll_book'], keeper:'corvin', keeperPx:66, seam:'CORVIN', tag:TAG_CORVIN, fresh:'one fresh-chalked' })}
          ${stall({ cls:'tinker', name:'The Tinker’s Bench', sub:'oddities & charms', trade:'Charms — six',
            goods:['gear_charm','gear_charm'], selected:true, seam:'SELECT', tag:TAG_SELECT })}
          ${stall({ cls:'bell', name:'The Bellmaker’s Cart', sub:'chimes & bells', trade:'Bells — three',
            goods:['bell_charm'], raven:'v1.5.0', ravenPx: phone ? 20 : 26, seam:'RAVEN', tag:TAG_RAVEN })}
        </div>
        <div class="foreground-row">
          <div class="hero-step">
            ${IV.spriteTag('hero', phone ? 48 : 58, 'hero')}
            <span class="hero-cue">step up to a stall</span>
          </div>
        </div>
        <div class="row-cap"><span class="cap">Traders from beyond the Vale <b>&mdash; every stall hangs its board.</b></span></div>
      </div>
    </div>`;
  }

  /* ==========================================================================
     5. THE TWO FRAMES
     ========================================================================== */

  function sceneDesktop() {
    return `<div class="app-pad">
      ${IV.header({ phone:false })}
      ${row(false)}
      ${IV.footer()}
    </div>`;
  }

  function scenePhone() {
    return `<div class="app-pad">
      ${IV.header({ phone:true })}
      ${row(true)}
      ${IV.footer()}
    </div>
    ${IV.dock()}`;
  }

  /* ==========================================================================
     6. THE WALL
     ========================================================================== */
  IV.page({
    title: 'Iron Vale — the Bazaar Row, a scene',
    subtitle: 'visual mockup, nothing wired up · docs/plugin-bazaar-plan.md §8b · rebuilt to fold in the author’s seven rulings',
    note: 'Rebuild of <code>bazaar-row-v2.png</code> / <code>bazaar-row-mobile.png</code> after '
      + '<code>docs/plugin-bazaar-critique.md</code>. Four stalls under one sky at the town’s own '
      + '5x building scale, the hero planted on the road at his town scale (ruling 7); one raven, '
      + 'perched over the stall it brings word of, naming the version plainly (ruling 1); the '
      + 'Scrivener’s Stall run by Wick’s estranged brother, his own face in different dress '
      + '(ruling 2); and signboards that carry only the trade and a count &mdash; nothing fancier.',
    legend: [
      { label: 'SCALE', text: '5x stalls, canonical sky, hero at town scale — one village, not a close-up' },
      { label: 'RAVEN', text: 'one raven, on the Bellmaker’s Cart, speaking plain semver' },
      { label: 'SIGNS', text: 'trade + count only, plain — no fourth text layer' },
      { label: 'CORVIN', text: 'Wick’s estranged brother runs the Scrivener’s Stall' },
    ],
    frames: {
      phone: {
        title: 'Phone — 390px — the same row, folded',
        sub: 'the two-column town grid the app already uses at phone widths — stalls stack in pairs, nothing redesigned',
        chips: ['5x scale kept', 'one raven', 'pairs, not a list'],
        html: scenePhone(),
      },
      desktop: {
        title: 'Desktop — 900px viewport, scaled to fit',
        sub: 'the full row: four stalls, the Tinker’s Bench lit as the stall awaiting you, the raven over the Bellmaker’s Cart',
        chips: ['5x scale', 'canonical sky', 'plain signboards', 'Corvin at the Scrivener’s Stall'],
        url: 'ironvale.local:8322/#bazaar — the row',
        html: sceneDesktop(),
      },
    },
  });

  IV.boot();
</script>
