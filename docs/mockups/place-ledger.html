/* ===================== THE LEDGER HOUSE — Wick's desk =====================
   The confession form, drawn as the desk it always was. Every rule below is
   scene-local; the tokens it leans on are the harness's (= static/style.css).

   ONE PROJECTION. Everything on this page is a high three-quarter view down
   onto a single wooden desk surface: planks run left-to-right, the far edge
   falls into shadow at the top, the near lip catches light at the bottom, and
   every object that stands on the desk gets a contact shadow at its base
   (.footed > .fshade). Nothing floats. The one light is the candle at the
   back-left, so hard drop shadows fall down-and-right, everywhere.
   ========================================================================== */

    radial-gradient(circle at 74% 58%, rgba(26,18,8,0.30) 0 3%, rgba(0,0,0,0) 9%),
    radial-gradient(circle at 22% 84%, rgba(26,18,8,0.26) 0 2%, rgba(0,0,0,0) 8%),
    linear-gradient(180deg, rgba(0,0,0,0.50) 0, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 74%, rgba(0,0,0,0.34) 100%),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 44px, rgba(22,15,6,0.9) 44px 47px, rgba(140,106,60,0.30) 47px 48px),
    repeating-linear-gradient(180deg, rgba(255,224,168,0.05) 0 1px, rgba(0,0,0,0) 1px 4px, rgba(0,0,0,0.11) 4px 5px, rgba(0,0,0,0) 5px 9px);
  border:3px solid #6a4e2c;
  box-shadow:inset 0 0 0 2px #1a1208, 6px 6px 0 rgba(0,0,0,0.55); }
/* the desk's far edge, falling away into the dark of the room */
.iv .desk::before { content:''; position:absolute; left:0; right:0; top:0; height:30px; z-index:0;
  pointer-events:none;
  background:linear-gradient(180deg,#150e05 0,#241a0d 45%,rgba(36,26,13,0) 100%); }
/* the desk's near lip, the bevel you rest your wrists on */
.iv .desk::after { content:''; position:absolute; left:0; right:0; bottom:0; height:15px; z-index:0;

/* --- labels. Where an object can carry its own name it does: a brass plate

<script>
  IV.injectStyles();
  /* the harness stylesheet is appended to <head> on injectStyles(); put the
     scene sheet after it so scene rules win on equal specificity */
  document.head.appendChild(document.getElementById('scene-css'));

  /* =========================================================================
     1. THE STAMPS — one per kind of deed.

        Each is a turned wooden handle, a brass collar and a die head cut in
        that kind's --activity-* colour (static/style.css:67). The emblem is
        cut into the FRONT of the die head, the way a stamp carries an index
        image so you can tell it from its neighbours in the block — so the
        same mark you see on the rack is the mark it leaves on the page.

        Emblems are 10x10 and are drawn to survive the cover-the-label test:
        a running figure, a bicycle, a flagged peak, a barbell with a bar that
        runs past its plates, a body folded double, a walker with a staff, a
        swimmer's arm over water, and a burst for everything else.
     ========================================================================= */

  var KINDS = [
    { k:'run',      name:'RUN',   col:'#7ab55c', word:'a run', em:[
      '.....kk...',
      '.....kk...',
      '..kkkkk...',
      '.k...kk...',
      '.....kkkk.',
      '....kkk...',
      '...kkk....',
      '..kk..kk..',
      '.kk....kk.',
      'kk......kk'] },
    { k:'ride',     name:'RIDE',  col:'#6aa0c8', word:'a ride', em:[
      '...kkkk...',
      '.kk.kk.kk.',
      '.k..kk..k.',
      'k...kk...k',
      'kkkkkkkkkk',
      'kkkkkkkkkk',
      'k...kk...k',
      '.k..kk..k.',
      '.kk.kk.kk.',
      '...kkkk...'] },
    { k:'climb',    name:'CLIMB', col:'#e07030', word:'a climb', em:[
      '..k.......',
      '..kkkk....',
      '..kkk.....',
      '..k.......',
      '..k.......',
      '.kkk......',
      '.kkkk..k..',
      'kkkkk.kkk.',
      'kkkkkkkkkk',
      'kkkkkkkkkk'] },
    { k:'strength', name:'IRON',  col:'#c85050', word:'the iron', em:[
      '..........',
      '..........',
      '.kkk..kkk.',
      '.kkk..kkk.',
      'kkkkkkkkkk',
      'kkkkkkkkkk',
      '.kkk..kkk.',
      '.kkk..kkk.',
      '..........',
      '..........'] },
    { k:'mobility', name:'LIMBER',col:'#a06ac8', word:'limbering', em:[
      '...kkkk...',
      '...kkkk...',
      '....kk....',
      '.kkkkkkkk.',
      '....kk....',
      '....kk....',
      '...kkkk...',
      '..kk..kk..',
      '.kk....kk.',
      'kk......kk'] },
    { k:'walk',     name:'WALK',  col:'#5cb5a5', word:'a walk', em:[
      '..kk.....k',
      '..kk.....k',
      '.kkkk....k',
      '.kkkkkkkkk',
      '..kkk....k',
      '..kkk....k',
      '.kkkkk...k',
      '.kk.kk...k',
      'kk...kk..k',
      'kk....kk.k'] },
    { k:'swim',     name:'SWIM',  col:'#4a90d0', word:'a swim', em:[
      '.......kk.',
      '......kk..',
      '.....kk...',
      '.kkk.kk...',
      'kkkkkkk...',
      '..........',
      'kk..kk..kk',
      '..kk..kk..',
      'kk..kk..kk',
      '..........'] },
    { k:'other',    name:'OTHER', col:'#9a9aa8', word:'something else', em:[
      '....kk....',
      '....kk....',
      'k...kk...k',
      '.k..kk..k.',
      '..kkkkkk..',
      'kkkkkkkkkk',
      '..kkkkkk..',
      '.k..kk..k.',
      'k...kk...k',
      '....kk....'] },
  ];

  /* five turned handles, so no two stamps in the block are the same object */
  var HANDLES = [
    /* 0 — ball knob */
    ['.....WWWWWW.....', '....WWWWWWWW....', '....WwwwwwwW....',
     '....WwwwwwwW....', '.....WwwwwW.....', '......wwww......'],
    /* 1 — flat disc */
    ['...wwwwwwwwww...', '...WWWWWWWWWW...', '....wwwwwwww....', '.....wwwwww.....'],
    /* 2 — tall taper */
    ['.......ww.......', '......wWWw......', '......wWWw......', '.....wWWWWw.....',
     '.....wWWWWw.....', '....wWWWWWWw....', '....wwwwwwww....'],
    /* 3 — beaded, turned twice */
    ['.....wwwwww.....', '....wWWWWWWw....', '.....wwwwww.....', '......wWWw......',
     '.....wwwwww.....', '....wWWWWWWw....', '.....wwwwww.....'],
    /* 4 — squat square knob */
    ['....wwwwwwww....', '....WWWWWWWW....', '....WwwwwwwW....', '....wwwwwwww....'],
  ];

  var byKind = {};
  var stampSprites = {};

  function stampRows(t, handle, shaft, wet) {
    var rows = HANDLES[handle].slice();
    for (var i = 0; i < shaft; i++) rows.push('......wWWw......');
    rows.push('.....mmmmmm.....');
    rows.push('....mmmmmmmm....');
    rows.push('.kCCCCCCCCCCCCk.');
    rows.push('.kCCCCCCCCCCCCk.');
    t.em.forEach(function (r) { rows.push('.kC' + r.replace(/\./g, 'C') + 'Ck.'); });
    rows.push('.kCCCCCCCCCCCCk.');
    rows.push('.kddddddddddddk.');
    if (wet) {
      rows.push('.iiiiiiiiiiiiii.');
      rows.push('..i.iii...ii.i..');
      rows.push('.....i.....i....');
    } else {
      rows.push('..dddddddddddd..');
    }
    return rows;
  }

  KINDS.forEach(function (t) {
    byKind[t.k] = t;
    var pal = { w:'#5a4428', W:'#8a6a40', m:'#c9a24b', C:t.col,
      d:IV.blendHex(t.col, '#000000', 0.5), k:'#1a1208', i:'#1a2438' };
    t.pal = pal;
    /* the blot the same die leaves on the page: the emblem, in ink, with the
       spatter a hand-pressed stamp always throws */
    var blot = ['...c....c...'];
    t.em.forEach(function (r) { blot.push('.' + r.replace(/k/g, 'c') + '.'); });
    blot.push('..c....cc...');
    blot.push('......c.....');
    /* the ink sits a shade deeper than the die, the way ink does on paper —
       and it has to hold its own against cream stock */
    stampSprites['blot_' + t.k] = { p: { c:IV.blendHex(t.col, '#000000', 0.74) }, r: blot };
  });

  /* the stamps that are actually on the desk, each cut to its own length.
     These are registered after the block below has already merged, so they go
     straight into IV.SPRITES rather than into the staging object. */
  function addStamp(id, kind, handle, shaft, wet) {
    var t = byKind[kind];
    var one = {}; one[id] = { p: t.pal, r: stampRows(t, handle, shaft, wet) };
    IV.addSprites(one);
  }

  /* =========================================================================
     2. THE REST OF THE DESK — hand-authored char-map sprites.
     ========================================================================= */

  IV.addSprites(Object.assign(stampSprites, {
    /* Wick, as a corner bust: white tufts over a high forehead, brass
       spectacles, scrivener's robe and collar, both hands on the desk, the
       left one stained to the knuckle with oak-gall ink */
    wick_bust: { p: { W:'#e4dfd0', f:'#e6c6a4', F:'#b78f68', K:'#191410', m:'#c9a24b',
      c:'#efe8d4', p:'#4a3a66', P:'#6c5c8c', i:'#22304e' }, r: [
      '....ffff....', '...ffffff...', '..WffffffW..', '.WWffffffWW.',
      '.WWmKmmKmWW.', '..ffffFfff..', '..fffKKfff..', '...ffffff...',
      '....FFFF....', '..cccccccc..', '.cppppppppc.', 'pppppppppppp',
      'pPppppppppPp', 'pppppppppppp', 'pp.pppppp.pp', 'Ff.pppppp.fF',
      'ff.pppppp.ff', '.f........f.', '.i..........',
    ]},
    /* the quill: a goose feather with a barbed vane either side of the
       rachis, a bare shaft, and a cut nib still holding a bead of ink */
    quill: { p: { f:'#f4eee1', F:'#a99f89', s:'#6f6250', S:'#8a8a9a', n:'#26262f', i:'#1a2438' }, r: [
      '.............s..', '............fsF.', '.........fffsFF.', '.......ffffsFFF.',
      '.........ffsFFFF', '.....fffffsFFF..', '......fffsFFFFF.', '...ffffffsFFF...',
      '....ffffsFFFF...', '..fffffsFFFF....', '....fffsFFFF....', '..ffffsFFF......',
      '..fffsFFF.......', '...ffsFF........', '...ss...........', '..ss............',
      '..ss............', '.ss.............', '.nnn............', '.nSn............',
      '.nn.............', 'nn..............', 'i...............',
    ]},
    /* the inkpot: pewter rim, oak-gall ink to the brim, a quill notch cut in
       the near lip and the ring the pot has left in the wood */
    inkpot: { p: { m:'#8a8a9a', M:'#c8c8d8', G:'#3a5480', g:'#26395c', k:'#0d1322', s:'#5a5a6a' }, r: [
      '............', '...MMMMMM...', '..MkkkkkkM..', '..MkkkkkkM..',
      '...mmmmmm...', '..GGGGGggg..', '.GGGGGGgggg.', '.GGGGGGgggg.',
      '.GGGGGGgggg.', '.kGGGGGgggk.', '.kkGGGgggkk.', '..kkkkkkkk..',
      '...ssssss...',
    ]},
    /* the hourglass, mid-drag: the upper bulb part drained, sand still falling */
    hourglass: { p: { W:'#a8865a', w:'#8a6a40', i:'#4a4a5a', g:'#20202e', s:'#e8c878' }, r: [
      '.WWWWWWWWWWWW.', '.wwwwwwwwwwww.', '..iggggggggi..', '..iggggggggi..',
      '...issssssi...', '....issssi....', '.....issi.....', '.....issi.....',
      '....i.ss.i....', '...i..ss..i...', '..i...ss...i..', '..i..ssss..i..',
      '..i.ssssss.i..', '..issssssssi..', '..issssssssi..', '..issssssssi..',
      '.wwwwwwwwwwww.', '.WWWWWWWWWWWW.',
    ]},
    /* one tallow candle, which is all the light this room gets */
    candle: { p: { y:'#f0d060', o:'#e07030', r:'#c04020', k:'#2a2a34', W:'#e8e0cc', w:'#c8c0a8', m:'#8a8a9a' }, r: [
      '...y....', '...yo...', '..oyyo..', '..oyyo..', '...ro...', '...k....',
      '..WWWw..', '..WWWw..', '..WWWw..', '..WWWw..', '..WWWw..', '.WWWWWw.',
      '.WWWWWw.', 'mmmmmmmm', '.mmmmmm.', '..mmmm..',
    ]},
    /* a raven, done for the day, standing on the slips it brought: a wedge of
       beak, a pale eye, a lifted wing, a fan of tail, and two grey legs that
       stand clear of the body */
    raven: { p: { k:'#15151f', K:'#3d3d4c', y:'#c9a24b', Y:'#8a6a20', e:'#e8e0cc', g:'#5a5a68' }, r: [
      '......kkk.....', '.....kkkkk....', '..yykkkekk....', '..YYkkkkkkk...',
      '.....kkkkkk...', '....kkkkkkkk..', '...kkkkkkkkkk.', '..kkkKKKKkkkkk',
      '..kkkKKKKkkkkk', '..kkkkKKKkkkkk', '...kkkkkkkkkkk', '....kkkkkkkk..',
      '.....g..g.....', '.....g..g.....', '....ggg.ggg...',
    ]},
  }));

  /* =========================================================================
     3. THE RACK — what is standing in the block and what is lying round it.
        Not a grid: seven stamps of four lengths and five handles, each at its
        own angle, one lying flat on the desk, and a gap in the block where
        the climbing die was pulled out.
     ========================================================================= */

  var RACK = [
    /* standing in the block */
    { k:'run',      h:0, s:5, x:0,   y:106, rot:-7, band:19 },
    { k:'strength', h:2, s:4, x:54,  y:110, rot:5,  band:22 },
    { k:'swim',     h:3, s:6, x:106, y:104, rot:-4, band:24 },
    { k:'walk',     h:1, s:4, x:158, y:108, rot:8,  band:13 },
    /* two leaning on the block, and one lying flat on the desk in front */
    { k:'ride',     h:4, s:4, x:18,  y:20, rot:-26, loose:true, tag:{ x:4,   y:0, rot:-4 } },
    { k:'mobility', h:2, s:3, x:136, y:18, rot:26,  loose:true, tag:{ x:152, y:0, rot:5 } },
    { k:'other',    h:0, s:3, x:48,  y:26, rot:94,  loose:true, tag:{ x:72,  y:0, rot:-3 } },
  ];
  /* where the block is cut: one slot per die, plus the empty one climbing came from */
  var SLOTS = [
    { x:12 }, { x:40 }, { x:68, gap:true }, { x:96 }, { x:122 }, { x:150 }, { x:178 },
  ];
  RACK.forEach(function (r, i) { r.id = 'stamp_' + r.k + '_' + i; addStamp(r.id, r.k, r.h, r.s); });
  /* the climbing die, out of the block and wet — it is over the page, not here */
  addStamp('stamp_climb_held', 'climb', 3, 3, true);

  /* the phone rack: same seven, shorter, leaning at their own angles */
  var RACK_P = [
    { k:'run',      h:0, s:3, x:0,   y:50, rot:-8 },
    { k:'strength', h:2, s:1, x:33,  y:56, rot:4 },
    { k:'swim',     h:3, s:4, x:66,  y:48, rot:-5 },
    { k:'other',    h:1, s:2, x:100, y:54, rot:8 },
    { k:'ride',     h:4, s:2, x:133, y:51, rot:-4 },
    { k:'walk',     h:0, s:1, x:167, y:57, rot:7 },
    { k:'mobility', h:2, s:3, x:199, y:47, rot:-9 },
  ];
  RACK_P.forEach(function (r, i) { r.id = 'pstamp_' + r.k + '_' + i; addStamp(r.id, r.k, r.h, r.s); });

  /* =========================================================================
     4. THE SCENE
     ========================================================================= */

  /* anything that stands on the desk stands in its own contact shadow */
  function stands(key, px, cls) {
    return `<span class="footed ${cls || ''}"><span class="fshade"></span>${IV.spriteTag(key, px)}</span>`;
  }

  /* Wick's corner: the bust alone, or the bust with what he says once tapped */
  function wickCorner(tapped) {
    var bubble = tapped ? `<div class="wick-bubble">
          <span class="fb-line">&ldquo;Press the stamp, tip the glass, and I&rsquo;ll write it down.
            No witness means seven coins in ten &mdash; I don&rsquo;t make the rule, I keep it.&rdquo;</span>
          <span class="fb-who">Wick the Scrivener &middot; tap the bust again and he goes back to his work</span>
        </div>` : '';
    return `<div class="desk-band">
      <div class="desk-plate">The Ledger House<small>Wick&rsquo;s desk &mdash; where a deed the ravens missed gets sworn</small></div>
      ${bubble}
      <div class="desk-glyph ${tapped ? 'tapped' : ''}"
           data-seam="WICK"
           data-tag="WICK, ON TAP|A bust in the &times;-glyph weight class. Silent until tapped &mdash; no standing sprite, no bubble left hanging open.">
        ${IV.spriteTag('wick_bust', tapped ? 36 : 24)}
        <span class="g-cap">${tapped ? 'Wick, asked' : 'ask Wick'}</span>
      </div>
    </div>`;
  }

  /* one already-inked line of today's page */
  function entry(kind, when, what, fine) {
    return `<div class="entry">
      <span class="emark">${IV.spriteTag('blot_' + kind, 36)}</span>
      <span class="etext">${when} &mdash; <b>${what}</b></span>
      <span class="efine">${fine}</span>
    </div>`;
  }

  /* the fresh line: the climbing die is up out of the block, wet, and held
     over the dashed square; the glass has been read; the quill has stopped */
  function freshEntry(phone) {
    return `<div class="entry entry-fresh"
         data-seam="BLOT"
         data-tag="THE BLOT IS THE SUBMIT|The inked die is already up and over the line. Bring it down on the dashed square and it is sworn. Nothing here says SUBMIT.">
      <span class="held-stamp">
        <span class="hs-shade"></span>${IV.spriteTag('stamp_climb_held', 32)}<span class="drop"></span>
      </span>
      <span class="ghost-blot"></span>
      <span class="etext">this evening &mdash; <b>a little under an hour</b></span>
      <span class="notewrite"
            data-seam="QUILL"
            data-tag="THE QUILL IS THE NOTE FIELD|Write on the line with it. The note goes where a note goes: on the page, in its own entry.">
        <span class="ntext">at the crag, and no tracker on my wrist</span><span class="nib"></span>
      </span>
      <span class="quill-rest"><span class="qshade"></span>${IV.spriteTag('quill', 48)}</span>
    </div>`;
  }

  /* the rack: a slotted block with a gap in it, and seven dies round it */
  function stampRack() {
    var slots = SLOTS.map(function (s) {
      return `<i class="${s.gap ? 'gap' : ''}" style="left:${s.x}px"></i>`;
    }).join('');
    var pieces = RACK.map(function (r) {
      var band = r.loose ? '' :
        `<span class="sband" style="top:${r.band}px">${byKind[r.k].name}</span>`;
      var tag = r.tag ? `<span class="looseband"
          style="left:${r.tag.x}px;bottom:${r.tag.y}px;transform:rotate(${r.tag.rot}deg)">${byKind[r.k].name}</span>` : '';
      return `<span class="stampx ${r.loose ? 'loose' : ''}"
        style="left:${r.x}px;bottom:${r.y}px;transform:rotate(${r.rot}deg)">
        <span class="sshade"></span>${IV.spriteTag(r.id, 48)}${band}</span>${tag}`;
    }).join('');
    return `<div class="rack-stage"
         data-seam="STAMPS"
         data-tag="STAMPS FOR THE KIND SELECT|A slotted block, seven dies of four lengths and five handles, each at its own angle &mdash; and a gap where the climbing die was pulled out. Each carries its emblem on the head and its name on the band round the shaft.">
      ${pieces}
      <div class="rack-block">
        <div class="blk-top">${slots}</div>
        <div class="blk-front"><span class="blk-plate">one die a kind</span></div>
      </div>
    </div>`;
  }

  function phoneRack() {
    /* the near edge is whatever the phone is wide, so the block's slots and the
       dies standing in them are spaced off it rather than off a fixed grid */
    var slots = SLOTS.map(function (s, i) {
      return `<i class="${s.gap ? 'gap' : ''}" style="left:calc(8px + (100% - 34px) * ${i} / 6)"></i>`;
    }).join('');
    var pieces = RACK_P.map(function (r, i) {
      return `<span class="stampx"
        style="left:calc((100% - 34px) * ${i} / 6);bottom:${r.y}px;transform:rotate(${r.rot}deg)">
        <span class="sshade"></span>${IV.spriteTag(r.id, 32)}</span>`;
    }).join('');
    return `<div class="thumb-rack">
      <div class="rack-stage"
         data-seam="STAMPS"
         data-tag="THE RACK, UNDER A THUMB|The same block on the near edge of the desk, the same gap where the climbing die came out. No names down here &mdash; the emblem cut in the head and the colour are the name.">
        ${pieces}
        <div class="rack-block">
          <div class="blk-top">${slots}</div>
          <div class="blk-front"><span class="blk-plate">one die a kind</span></div>
        </div>
      </div>
    </div>`;
  }

  /* the hourglass: set the sand by the brass slide, and it reads back */
  function hourglass(phone) {
    return `<div class="prop"
         data-seam="GLASS"
         data-tag="THE GLASS IS THE MINUTES FIELD|Run the brass slide and the sand follows it; the glass reads back what it holds, rather than asking you for a number.">
      <div class="glass-block">${stands('hourglass', 42)}</div>
      <div class="sandrail"><span class="ticks"></span><span class="fill"></span><span class="knob"></span></div>
      <div class="reading"><span class="rd">a little under an hour</span></div>
    </div>`;
  }

  function straightedge() {
    return `<div class="straightedge"><i class="l"></i><i class="r"></i></div>`;
  }

  function slips() {
    return `<div class="prop"
         data-seam="SLIPS"
         data-tag="WHAT THE RAVENS ALREADY BROUGHT|One sealed slip per deed that arrived on its own &mdash; so you can see what is left to confess.">
      ${stands('raven', 42)}
      <div class="slips">
        <div class="slipsh"><div class="slip" style="--tilt:-1.6deg"><span class="wax"></span>
          <b>a ride</b>the low bridge &middot; three quarters of an hour
          <em>by raven &mdash; no swearing needed</em></div></div>
        <div class="slipsh"><div class="slip" style="--tilt:1.3deg"><span class="wax"></span>
          <b>a walk</b>to the mill &middot; half an hour
          <em>by raven &mdash; no swearing needed</em></div></div>
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- desktop */
  function desktopScene() {
    return `<div class="app-pad">
      ${IV.header({ phone: false })}
      <div class="deskwrap">
        <div class="desk">
          ${wickCorner(true)}
          <div class="desk-floor">

            <div class="desk-col-left">
              <div class="prop" style="margin-bottom:6px">${stands('candle', 40)}</div>
              ${stampRack()}
              <div class="prop" style="margin-top:10px">
                ${stands('inkpot', 36)}
                <span class="under"><span class="paper-tag">oak-gall ink &mdash; <b>the climbing die was just dipped</b></span></span>
              </div>
            </div>

            <div class="desk-col-mid">
              <div class="ledger-book"
                   data-seam="LEDGER"
                   data-tag="THE OPEN LEDGER|Ruled, and already part-written. The list of today&rsquo;s deeds and the place you add one are one object.">
                <div class="lp lp-left">
                  <span class="scrawl"></span><span class="scrawl s2"></span>
                  <span class="scrawl s3"></span><span class="scrawl"></span>
                  <span class="scrawl s4"></span><span class="scrawl s2"></span>
                  <span class="scrawl s3"></span><span class="scrawl"></span>
                  <span class="scrawl s4"></span><span class="scrawl s2"></span>
                  <span class="scrawl"></span><span class="scrawl s3"></span>
                  <span class="scrawl s4"></span><span class="scrawl s2"></span>
                  <span class="scrawl s3"></span><span class="scrawl"></span>
                  <span class="scrawl s4"></span><span class="scrawl s3"></span>
                  <div class="lp-foot">yesterday, in a hand you can no longer read from here</div>
                </div>
                <div class="lp-spine"></div>
                <div class="lp">
                  <div class="lp-head">
                    <span class="lp-date">Today</span>
                    <span class="lp-hand">the sixth of the eighth month</span>
                  </div>
                  <div class="lines">
                    ${entry('ride', 'at first light', 'a ride out to the low bridge',
                      'three quarters of an hour &middot; <i>a raven brought it</i>')}
                    ${entry('strength', 'midday', 'back squat, five sets of five',
                      'sworn set by set at the rack')}
                    ${entry('walk', 'afternoon', 'the walk to the mill and back',
                      'half an hour &middot; <i>a raven brought it</i>')}
                    ${freshEntry(false)}
                  </div>
                  <div class="lp-foot-note"><b>Bring the inked die down on the dashed square and it is sworn.</b>
                    No witness rode with you, so Wick pays seven coins in ten &mdash; older pages:
                    the Hall of Records, then the calendar, then the day.</div>
                </div>
              </div>

              <div class="edge-rest">
                ${straightedge()}
                <span class="plate-tag">rule through a line &mdash; <b>struck from the record</b></span>
              </div>
            </div>

            <div class="desk-col-right">
              ${hourglass(false)}
              ${slips()}
            </div>

          </div>
        </div>
      </div>
      ${IV.footer()}
    </div>`;
  }

  /* ------------------------------------------------------------------ phone */
  function phoneScene() {
    return `<div class="app-pad">
      ${IV.header({ phone: true })}
      <div class="deskwrap"
           data-seam="FOLD"
           data-tag="THE FOLD|Nothing redesigned: the left page, ink, candle and slips fold away; today&rsquo;s page takes the width; the block sits on the near edge of the desk, glass beside it.">
        <div class="desk">
          ${wickCorner(false)}
          <div class="desk-floor">
            <div class="ledger-book">
              <div class="lp">
                <div class="lp-head">
                  <span class="lp-date">Today</span>
                  <span class="lp-hand">the sixth</span>
                </div>
                <div class="lines">
