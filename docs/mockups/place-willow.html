<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iron Vale — Sage Elowen's willow, a scene</title>
<!-- Design mockup. Nothing here is app code: static/ is the app, this is drawing
     paper. Everything visual comes from docs/mockups/_harness.js (tokens, fonts,
     sprite engine, tiles, gallery chrome); this file adds only the glade's own
     scenery and the two states of the screen. -->
<script src="_harness.js"></script>
<body>
<script>
IV.injectStyles();

/* ===========================================================================
   1. THE GLADE'S OWN STYLES — appended AFTER the harness sheet so these win.

   Palette note: the glade is the only night exterior in the set, so it is
   deliberately pulled toward the shared warm brown/amber family — warm-olive
   grass, an ember horizon, warm bark, and two real warm light sources (the
   post lantern and the night-watch lanterns) that spill onto the grass, the
   trunk, the water and the people standing in them.
   =========================================================================== */
var SCENE_CSS = `
/* ---------------- the glade: sky, bank, water ---------------- */
.iv .glade { position:relative; border:2px solid #4a3d20; margin:12px 4px 0; overflow:hidden;
  image-rendering:pixelated; }
.iv .glade .sky { position:relative; overflow:hidden;
  background:linear-gradient(180deg,#07060d 0,#0d0d1c 26%,#171426 54%,#241a26 78%,#3a2620 100%); }
.iv .glade .mtns { position:absolute; left:0; right:0; bottom:0; height:72px;
  background-repeat:repeat-x; background-position:bottom left; background-size:360px 72px; opacity:0.92; }
.iv .glade .haze { position:absolute; left:0; right:0; bottom:0; height:104px; pointer-events:none;
  background:linear-gradient(180deg, rgba(180,104,48,0) 0%, rgba(178,102,46,0.14) 58%, rgba(196,118,54,0.26) 100%); }
.iv .glade .stars i { position:absolute; width:2px; height:2px; background:#e8e0cc; }
.iv .glade .stars i.dim { background:#8d8474; }
.iv .glade .moon { position:absolute; z-index:0; line-height:0; }
/* drop-shadow follows the sprite's alpha; box-shadow would leave the canvas
   box unlit and print a hard dark rectangle of sky around the moon */
.iv .glade .moon canvas { filter:drop-shadow(0 0 3px rgba(255,240,205,0.60)) drop-shadow(0 0 11px rgba(235,220,190,0.30)); }
.iv .glade .bank { position:relative; background-color:#232a1a; border-top:4px solid #3c4426; }
.iv .glade .pond { position:absolute; left:0; bottom:0; background-color:#1a2130;
  border-top:2px solid #4a4432; box-shadow:inset 0 3px 0 rgba(190,150,90,0.12); }
.iv .glade .refl { position:absolute; width:12px;
  background:repeating-linear-gradient(180deg, rgba(228,232,255,0.26) 0 2px, rgba(0,0,0,0) 2px 7px); }
.iv .glade .refl.warm { width:22px;
  background:repeating-linear-gradient(180deg, rgba(255,196,104,0.34) 0 2px, rgba(0,0,0,0) 2px 6px); }
.iv .glade .prop { position:absolute; line-height:0; }
.iv .glade .fig { position:absolute; z-index:4; line-height:0; }
.iv .glade .contact { position:absolute; z-index:3; pointer-events:none; border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.30) 50%, rgba(0,0,0,0) 76%); }
/* a lantern that casts: warm light lands on grass, trunk and people */
.iv .glade .pool { position:absolute; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, rgba(255,206,124,0.34) 0%, rgba(250,182,88,0.16) 40%, rgba(240,170,70,0) 72%); }
.iv .glade .pool.small { background:radial-gradient(ellipse at 50% 50%, rgba(255,206,124,0.30) 0%, rgba(250,182,88,0.13) 44%, rgba(240,170,70,0) 74%); }
.iv .glade .fly { position:absolute; z-index:3; width:3px; height:3px; background:#fff2b0;
  box-shadow:0 0 9px 3px rgba(240,200,110,0.62); animation:flyBlink 2.4s steps(2) infinite; }
@keyframes flyBlink { 0% { opacity:1; } 50% { opacity:0.15; } }

/* warm wood along the bank — one of the two anchors that keep the glade in the
   same colour family as the forge and the hall */
.iv .glade .fence { position:absolute; z-index:1; }
.iv .glade .fence i { position:absolute; left:0; right:0; height:5px;
  background:linear-gradient(180deg,#8a6636 0 2px,#5e4220 2px 4px,#33210d 4px 5px); }
.iv .glade .fence u { position:absolute; width:6px; top:0; bottom:0;
  background:linear-gradient(90deg,#9a7340 0 2px,#6a4c24 2px 5px,#2e1d0b 5px 6px); }

/* ---------------- the willow itself ---------------- */
.iv .glade .willow { position:absolute; inset:0; pointer-events:none; z-index:2; }
.iv .glade .willow > * { pointer-events:auto; }
.iv .glade .willow canvas { position:absolute; display:block; }
/* the weeping curtain: it is the strands, not the crown, that make a willow a
   willow. They hang from the canopy's own ragged underside, thin over the
   trunk so the boughs and bark stay legible. */
.iv .glade .strand { position:absolute; width:2px; z-index:1;
  background-image:repeating-linear-gradient(180deg,#25321a 0 6px,#1a2412 6px 11px); }
.iv .glade .strand.lit { background-image:repeating-linear-gradient(180deg,#425c2c 0 5px,#2c3d1d 5px 11px); }
.iv .glade .strand.deep { background-image:repeating-linear-gradient(180deg,#161d0d 0 7px,#101609 7px 12px); }
.iv .glade .strand::after { content:''; position:absolute; left:0; bottom:-3px; width:2px; height:3px; background:#3a5228; }

/* a plate is a last resort — used only where nothing in the world can carry
   the words (an NPC's name). Everything else is written on the object. */
.iv .glade .gplate { position:absolute; z-index:5; font-family:var(--font-fine); font-size:var(--type-fine);
  color:var(--ink); background:rgba(12,9,6,0.86); border:1px solid #6a4e2c; padding:1px 6px;
  letter-spacing:0.5px; white-space:nowrap; line-height:1.4; }
.iv .glade .gplate b { color:var(--gold-bright); font-weight:400; }

/* the tally board — nights kept, carved on a plank nailed to the trunk, so the
   count lives in the world instead of on a floating black label */
.iv .glade .tally { position:absolute; z-index:5; padding:4px 8px 5px; text-align:center;
  background:linear-gradient(180deg,#a07a44 0 3px,#8a6636 3px 60%,#6e5028 60% 100%);
  border:2px solid; border-color:#c19a5c #4a3520 #3a2a18 #9a7340;
  box-shadow:3px 3px 0 rgba(0,0,0,0.55); }
.iv .glade .tally b { display:block; font-family:var(--font-fine); font-size:var(--type-fine);
  letter-spacing:1.5px; text-transform:uppercase; color:#2c1c08; font-weight:400; line-height:1.4; }
.iv .glade .tally i { display:block; font-style:normal; font-family:var(--font-fine); font-size:var(--type-fine);
  color:#523716; line-height:1.4; }
.iv .glade .tally u { display:block; height:7px; margin:3px auto 0; text-decoration:none;
  background:repeating-linear-gradient(90deg,#3a2610 0 2px, rgba(0,0,0,0) 2px 6px); }
.iv .glade .tally::before, .iv .glade .tally::after { content:''; position:absolute; top:3px; width:3px; height:3px;
  background:#d8b978; box-shadow:0 1px 0 #4a3520; }
.iv .glade .tally::before { left:3px; }
.iv .glade .tally::after { right:3px; }
.iv .glade .tally .ty-post { position:absolute; left:50%; top:100%; width:9px; margin-left:-4px;
  background:linear-gradient(90deg,#9a7340 0 2px,#6a4c24 2px 6px,#33210d 6px 9px); }

/* ---------------- the writs: folded paper tied over a bough ---------------- */
/* Every part of the premise is drawn: the bough it hangs from, the paper
   folded over that bough, the cord knotted round both, and the name written
   down the paper itself. Nothing here is a card with a label under it. */
.iv .glade .writ { position:absolute; z-index:5; background:none; border:none; padding:0; margin:0;
  cursor:pointer; font:inherit; color:inherit; text-align:center; transform-origin:50% 11px; }
/* the bough: thick where it leaves the tree, thin at the free end, and tilted
   — a straight symmetrical bar reads as a crossbar on a post */
.iv .glade .writ .wr-branch { position:absolute; top:7px; height:9px; z-index:2;
  background:linear-gradient(180deg,#a07845 0 2px,#6b4a24 2px 5px,#402a10 5px 7px,#241705 7px 9px);
  clip-path:polygon(0 6%, 46% 26%, 100% 42%, 100% 66%, 46% 84%, 0 100%); }
.iv .glade .writ.lean .wr-branch { clip-path:polygon(0 42%, 54% 26%, 100% 6%, 100% 100%, 54% 84%, 0 66%); }
.iv .glade .writ .wr-twig { position:absolute; top:5px; height:5px; z-index:2;
  background:linear-gradient(180deg,#8a6636 0 2px,#5e4220 2px 4px,#33210d 4px 5px); }
/* the free end of the paper, folded back over the top of the bough — it is the
   reverse of the sheet, so it sits in shadow and is torn along its top */
.iv .glade .writ .wr-flap { position:absolute; left:9px; right:9px; top:-9px; height:18px; z-index:1;
  background:linear-gradient(90deg,#6b5c3c 0 26%,#a08c60 26% 64%,#5d4f33 64% 100%);
  clip-path:polygon(0 14%, 26% 0, 58% 12%, 82% 2%, 100% 16%, 100% 100%, 0 100%); }
/* the knot: two turns of cord round bough and paper together, with tails */
.iv .glade .writ .wr-cord { position:absolute; left:-6px; right:-6px; top:19px; height:11px; z-index:3;
  background:linear-gradient(180deg, #8a6c3c 0 1px, #3a2a10 1px 4px, rgba(0,0,0,0) 4px 6px,
                                     #8a6c3c 6px 7px, #3a2a10 7px 10px, rgba(0,0,0,0) 10px 11px); }
/* the knot itself, sitting proud on the front of the paper */
.iv .glade .writ .wr-cord::before { content:''; position:absolute; left:50%; top:-2px; margin-left:-7px;
  width:15px; height:15px;
  background:linear-gradient(180deg,#a5854c 0 3px,#6d5430 3px 7px,#33240c 7px 10px,#6d5430 10px 15px); }
/* and its two loose tails, hanging down the sheet */
.iv .glade .writ .wr-cord::after { content:''; position:absolute; left:50%; top:13px; margin-left:-6px;
  width:13px; height:13px;
  background:linear-gradient(90deg, rgba(0,0,0,0) 0 2px, #4a3618 2px 4px, rgba(0,0,0,0) 4px 9px,
                                    #33240c 9px 11px, rgba(0,0,0,0) 11px 13px); }
/* the paper: narrow, fold-creased, shaded so one edge curls toward you, torn
   at the free end, with the writ's name inked down it */
.iv .glade .writ .wr-paper { position:relative; z-index:1; display:block; margin:11px auto 0; padding:33px 0 17px;
  background:
    repeating-linear-gradient(180deg, rgba(96,72,38,0) 0 12px, rgba(96,72,38,0.42) 12px 13px, rgba(255,246,222,0.55) 13px 14px),
    linear-gradient(180deg, rgba(0,0,0,0) 0 calc(100% - 14px), #a08a5e calc(100% - 14px) calc(100% - 10px),
                            #ecdfba calc(100% - 10px) calc(100% - 5px), #7d6c46 calc(100% - 5px) 100%),
    linear-gradient(90deg,#8b7950 0 9%,#c9b88d 9% 26%,#e2d4b0 26% 48%,#cdbc94 48% 72%,#a8956a 72% 90%,#7f6f48 90% 100%);
  border-left:1px solid #7f6f4c; border-right:1px solid #6d5f40;
  box-shadow:3px 4px 0 rgba(0,0,0,0.45);
  clip-path:polygon(20% 0, 80% 0, 100% 7%, 97% 40%, 100% 72%, 98% 97%, 74% 100%, 44% 96%, 16% 100%, 2% 96%, 4% 62%, 1% 32%, 0 7%);
  transform-origin:50% 0; animation:writSway 5.2s steps(3) infinite; }
@keyframes writSway { 0%,100% { transform:rotate(-0.9deg); } 50% { transform:rotate(1.1deg); } }
.iv .glade .writ .wr-ink { display:block; margin:0 auto; writing-mode:vertical-rl; text-orientation:mixed;
  font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:0; line-height:1;
  color:#3f2b0f; white-space:nowrap; }
.iv .glade .writ:hover .wr-paper { filter:brightness(1.12); }

/* the chosen writ has come loose and unfurled: the same stock, opened wide,
   still tied at the bough, ending on the bank well short of the water */
.iv .glade .writ.unfurled { z-index:6; }
.iv .glade .writ.unfurled .wr-paper { animation:none; padding:38px 0 20px;
  filter:drop-shadow(0 0 2px rgba(240,208,128,1)) drop-shadow(0 0 5px rgba(240,208,128,0.9))
         drop-shadow(0 0 12px rgba(240,208,128,0.55));
  border-left:2px solid #f6ead0; border-right:2px solid #8d7f5c; }
.iv .glade .writ.unfurled .wr-ink { letter-spacing:1px; color:#3d2a0e; }
.iv .glade .writ.unfurled .wr-roll { position:absolute; left:-3px; right:-3px; top:33px; height:9px; z-index:2;
  background:linear-gradient(180deg,#8d7a52 0 1px,#f5ecd4 1px 4px,#d3c19a 4px 7px,#7a6842 7px 9px); }
/* the stub left on the bough once the writ has been taken down */
.iv .glade .writ.stub .wr-paper { padding:33px 0 13px;
  clip-path:polygon(20% 0, 80% 0, 100% 7%, 97% 44%, 100% 78%, 82% 92%, 58% 100%, 34% 88%, 12% 99%, 0 80%, 3% 44%, 0 7%); }

/* ---------------- the reading / the sworn writ: a .rack panel with a tail ---------------- */
.iv .reading, .iv .sworn { margin:34px 4px 8px; padding:52px 14px 12px; z-index:20; }
.iv .reading .rk-title, .iv .sworn .rk-title { line-height:1.2; }
.iv .reading .asks, .iv .sworn .asks { margin:8px 0 0; color:var(--ink); }
.iv .pays { display:flex; flex-wrap:wrap; gap:4px 16px; margin:9px 0 0;
  padding:7px 9px; background:rgba(8,8,14,0.42); border:1px solid var(--edge); }
.iv .pays .pay { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.iv .pays .pay canvas { vertical-align:middle; }
.iv .keeps { margin-top:6px; color:var(--green); font-family:var(--font-fine); font-size:var(--type-fine); }
.iv .omens { margin-top:10px; padding:8px 10px; border:1px solid #4a3d20; background:rgba(24,16,10,0.55); }
.iv .omens .omens-title { font-family:var(--font-fine); font-size:var(--type-fine); letter-spacing:1.5px;
  color:var(--gold-bright); text-transform:uppercase; margin-bottom:4px; }
.iv .omens .omen-line { color:var(--dim-readable); margin:2px 0; }
.iv .seal-row { display:flex; align-items:center; gap:10px; margin-top:12px;
  padding-top:9px; border-top:1px solid var(--edge); }
.iv .seal-row .seal { background:none; border:none; padding:0; cursor:pointer; line-height:0; }
.iv .seal-row .seal canvas { filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.55)); }
.iv .seal-row .seal-cap { color:var(--dim-readable); font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.4; }
.iv .seal-row .seal-cap b { display:block; color:var(--ink); font-weight:400; }

/* the lanterns of the night watch, read as time remaining */
.iv .watch { display:flex; align-items:flex-end; gap:10px; margin-top:10px;
  padding:8px 10px; border:1px solid #4a3d20; background:rgba(8,8,14,0.42); }
.iv .watch .watch-cap { color:var(--dim-readable); font-family:var(--font-fine); font-size:var(--type-fine); line-height:1.45; }
.iv .watch .watch-cap b { display:block; color:var(--ink); font-weight:400; }
.iv .watch canvas { display:block; }
.iv .watch .out { opacity:0.6; }

/* corner glyphs — the X-close weight class: a 24px sprite and a fine caption */
.iv .glyph-raven  { right:6px; }
.iv .glyph-tally  { right:84px; }
.iv .glyph-untie  { left:6px; }
.iv .glyph-sage   { left:6px; }
.iv .sworn .glyph-sage { left:auto; right:6px; }
.iv .board-glyph .g-cap { white-space:nowrap; }

/* Elowen speaks only when her bust is tapped. The bubble hangs off her own
   corner of the panel, kept inside the frame, clear of the glyph it points at,
   and on the opposite side of the scene from where she is standing. */
.iv .reading .gbubble-wrap { width:288px; left:2px; right:auto; bottom:calc(100% + 12px); }
.iv .reading .gbubble::after { left:16px; right:auto; }
.iv .reading .gbubble::before { left:18px; right:auto; }
.iv .gbubble .fb-line { margin-bottom:4px; }

/* phone dressing */
.iv-phone .reading, .iv-phone .sworn { margin:28px 2px 6px; padding:48px 10px 10px; }
.iv-phone .pays { gap:3px 10px; }
`;
(function () {
  var el = document.createElement('style');
  el.id = 'iv-willow-styles';
  el.textContent = SCENE_CSS;
  document.head.appendChild(el);
})();

/* ===========================================================================
   3. THE TREE, DRAWN AS ONE CONNECTED OBJECT

   The trunk and the canopy are painted procedurally onto pixel canvases rather
   than hand-typed char maps, because both need things a 20-column char map
   cannot carry: real bark furrows, a root flare that spreads into the bank,
   boughs that leave the trunk and climb into the leaves, and a canopy whose
   silhouette is lobed and ragged instead of a stepped rectangle.
   The canopy's underside profile is a pure function, so the hanging strands
   and the painted leaves agree about where the foliage ends.
   =========================================================================== */

function hash2(x, y) {
  var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

/* ---- the trunk ------------------------------------------------------- */
var TRUNK_W = 64, TRUNK_H = 96, TRUNK_TOP = 0.55;
var BARK = ['#1d1206', '#2c1c0b', '#3d2a12', '#4f381a', '#634726', '#7a5a31', '#94713f', '#b08a4e',
            '#33421f', '#455a2a', '#c39a52'];

var TRUNK_BUF = (function () {
  var W = TRUNK_W, H = TRUNK_H;
  var buf = new Int8Array(W * H); buf.fill(-1);

  function put(x, y, s) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    buf[y * W + x] = s < 0 ? 0 : (s > 10 ? 10 : s);
  }
  function cxAt(t) { return W / 2 + 2.6 * Math.sin(t * 2.6 + 0.7) - 1.2 * t; }
  function hwAt(t) {
    if (t < TRUNK_TOP) return 0;
    var u = (t - TRUNK_TOP) / (1 - TRUNK_TOP);
    var w = 5.6 + 6.4 * Math.pow(u, 1.15);
    if (u > 0.70) w += 10.5 * Math.pow((u - 0.70) / 0.30, 2.0);
    return w;
  }
  function disc(cx, cy, r) {
    for (var y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (var x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
        var dx = (x - cx) / r, dy = (y - cy) / r;
        if (dx * dx + dy * dy > 1.0) continue;
        var s = 4 + Math.round(1.7 * (dx - 0.15));
        if (hash2(x, y) < 0.28) s -= 1;
        put(x, y, s);
      }
  }
  /* one bough, with a twig or two thrown off it partway along */
  function branch(x, y, a, len, w, bend, depth) {
    var ds = 0.6, n = Math.max(2, Math.round(len / ds));
    var spawn = Math.round(n * 0.55);
    for (var i = 0; i < n; i++) {
      var s = i / n;
      disc(x, y, Math.max(0.55, w * (1 - 0.80 * s)));
      if (depth > 0 && i === spawn) {
        branch(x, y, a + (depth % 2 ? -0.9 : 0.9), len * 0.45, w * 0.55, bend * 0.6, depth - 1);
      }
      a += bend / n;
      x += Math.cos(a) * ds; y += Math.sin(a) * ds;
    }
  }

  /* 1. the boughs first, so the trunk column later closes over their roots */
  [[0.58, -2.28, 0.40, 5.2, 0.60], [0.56, -0.88, 0.38, 5.0, -0.60],
   [0.54, -1.62, 0.42, 4.4, 0.16], [0.64, -2.72, 0.26, 3.8, 0.55],
   [0.62, -0.44, 0.26, 3.8, -0.55], [0.50, -2.05, 0.32, 3.0, 0.50],
   [0.49, -1.15, 0.32, 3.0, -0.50]].forEach(function (L) {
    branch(cxAt(L[0]), L[0] * H, L[1], L[2] * H, L[3], L[4], 2);
  });

  /* 2. the trunk column: rounded shading, vertical bark furrows, dark edges */
  for (var y = 0; y < H; y++) {
    var t = y / (H - 1), cx = cxAt(t), hw = hwAt(t);
    if (hw <= 0) continue;
    for (var x = Math.floor(cx - hw); x <= Math.ceil(cx + hw); x++) {
      var d = (x - cx) / hw;
      if (d < -1 || d > 1) continue;
      var lit = 1 - Math.abs(d - 0.30) * 1.05;
      var s = 1 + Math.round(4.6 * Math.max(0, Math.min(1, lit)));
      var u = Math.round(x - cx);
      var f = hash2(u, Math.floor(y / 7));
      if (f < 0.30) s -= 1; else if (f > 0.76) s += 1;
      if (hash2(u * 3 + 1, y) < 0.11) s -= 2;
      if (Math.abs(d) > 0.88) s -= 2;
      put(x, y, s);
    }
  }

  /* 3. the root flare, spreading sideways into the bank */
  [[-1, 0.90, 0.30, 3.0], [1, 0.92, 0.26, 2.8], [-1, 0.965, 0.17, 2.2],
   [1, 0.97, 0.19, 2.2], [-1, 0.85, 0.11, 1.8], [1, 0.86, 0.11, 1.8]].forEach(function (R) {
    var dir = R[0], t0 = R[1];
    var x0 = cxAt(t0) + dir * hwAt(t0) * 0.55;
    branch(x0, t0 * H, dir > 0 ? 0.20 : Math.PI - 0.20, R[2] * W, R[3], 0.55, 0);
  });

  /* 4. moss at the foot, and a warm rim down the lantern side */
  for (var yy = 0; yy < H; yy++) {
    var rightmost = -1;
    for (var xx = 0; xx < W; xx++) {
      if (buf[yy * W + xx] < 0) continue;
      rightmost = xx;
      if (yy / (H - 1) > 0.90 && hash2(xx * 5, yy * 3) > 0.55) buf[yy * W + xx] = 8;
      else if (yy / (H - 1) > 0.955 && hash2(xx * 3, yy) > 0.4) buf[yy * W + xx] = 9;
    }
    if (rightmost >= 0 && yy / (H - 1) > 0.52 && hash2(rightmost, yy * 7) > 0.30) {
      buf[yy * W + rightmost] = 10;
    }
  }
  return buf;
})();

function paintTrunk(ctx, s) {
  for (var y = 0; y < TRUNK_H; y++) for (var x = 0; x < TRUNK_W; x++) {
    var v = TRUNK_BUF[y * TRUNK_W + x];
    if (v < 0) continue;
    ctx.fillStyle = BARK[v];
    ctx.fillRect(x * s, y * s, s, s);
  }
}

/* ---- the canopy ------------------------------------------------------ */
/* a cluster of overlapping leaf lobes, not a stepped dome: the silhouette is
   broken at the top, arched up over the trunk underneath, and ragged with
   leaf tips along the bottom where the strands start */
var CAN_W = 120, CAN_H = 46;
var LOBES = [
  [18, 20, 17, 11], [36, 15, 20, 12], [60, 11, 21, 10], [84, 15, 20, 12],
  [102, 21, 16, 11], [26, 27, 15, 11], [94, 27, 14, 10], [10, 24, 9, 8],
  [110, 25, 9, 8], [46, 22, 14, 9], [74, 23, 14, 9], [60, 20, 10, 6],
];
var HOLES = [[50, 17, 3.4, 2.0], [86, 21, 3.0, 1.8], [32, 21, 2.8, 1.6], [66, 26, 2.6, 1.5]];
var GREENS = ['#111a0c', '#1a2611', '#243318', '#2f4321', '#3c552b', '#537043', '#6b8c48'];

var CAN = (function () {
  var top = [], bot = [], botR = [];
  for (var x = 0; x < CAN_W; x++) {
    var t = 1e9, b = -1e9;
    for (var i = 0; i < LOBES.length; i++) {
      var L = LOBES[i], dx = (x + 0.5 - L[0]) / L[2];
      if (dx <= -1 || dx >= 1) continue;
      var k = Math.sqrt(1 - dx * dx) * L[3];
      if (L[1] - k < t) t = L[1] - k;
      if (L[1] + k > b) b = L[1] + k;
    }
    if (b < t) { top.push(-1); bot.push(-1); botR.push(-1); continue; }
    var n1 = hash2(x, 3), n2 = hash2(x, 11);
    top.push(Math.round(t - (n1 < 0.30 ? 1 : 0) + (n1 > 0.82 ? 1 : 0)));
    bot.push(Math.round(b));
    botR.push(Math.round(b) + (n2 > 0.46 ? 1 + Math.floor(hash2(x, 19) * 4) : 0));
  }
  return { top: top, bot: bot, botR: botR };
})();

function paintCanopy(ctx, s) {
  for (var x = 0; x < CAN_W; x++) {
    if (CAN.top[x] < 0) continue;
    var t0 = CAN.top[x], b0 = CAN.bot[x], b1 = Math.min(CAN_H - 1, CAN.botR[x]);
    for (var y = t0; y <= b1; y++) {
      if (y < 0) continue;
      var hole = false;
      for (var i = 0; i < HOLES.length; i++) {
        var H = HOLES[i], dx = (x + 0.5 - H[0]) / H[2], dy = (y + 0.5 - H[1]) / H[3];
        if (dx * dx + dy * dy < 1) { hole = true; break; }
      }
      if (hole) continue;
      if (hash2(x * 7, y * 7) < 0.030) continue;              /* sky through the leaves */
      if (y > b0 && hash2(x * 2, y * 5) < 0.42) continue;     /* ragged leaf tips */
      var depth = (y - t0) / Math.max(1, b0 - t0);
      var idx = depth < 0.16 ? 4 : depth < 0.42 ? 3 : depth < 0.72 ? 2 : 1;
      var n = hash2(Math.floor(x / 2), Math.floor(y / 2));
      if (n < 0.24) idx -= 1; else if (n > 0.80) idx += 1;
      if (hash2(x * 5, Math.floor(y / 3)) > 0.82) idx += 1;
      if (y - t0 < 2 && x > CAN_W * 0.40) idx = 6;            /* moonlit rim */
      if (idx < 0) idx = 0; if (idx > 6) idx = 6;
      ctx.fillStyle = GREENS[idx];
      ctx.fillRect(x * s, y * s, s, s);
    }
  }
}

/* the hanging curtain, started from the canopy's own underside. Longest either
   side of the trunk, short directly over it — that envelope is what makes the
   silhouette read as a willow, and it keeps the bark and boughs visible. */
function curtain(n, left, top, s, base, amp, maxBottom) {
  var out = '';
  for (var i = 0; i < n; i++) {
    var t = (i + 0.5) / n;
    var col = Math.min(CAN_W - 1, Math.floor(t * CAN_W));
    if (CAN.bot[col] < 0) continue;
    var x = Math.round(left + t * CAN_W * s);
    var y0 = Math.round(top + (CAN.bot[col] - 2) * s);
    var s1 = Math.sin(Math.PI * t);
    var s2 = Math.sin(2 * Math.PI * t); s2 = s2 * s2;
    var jitter = (((i * 37) % 17) / 17 - 0.5) * 0.26;
    var len = Math.max(8, Math.round((base + amp * (0.10 + 0.90 * s2) * s1) * (1 + jitter)));
    if (y0 + len > maxBottom) len = Math.max(8, maxBottom - y0);
    var cls = ((i * 7) % 5 === 0) ? ' lit' : (((i * 11) % 4 === 0) ? ' deep' : '');
    out += '<i class="strand' + cls + '" style="left:' + x + 'px;top:' + y0 + 'px;height:' + len + 'px"></i>';
  }
  return out;
}

function paintTag(kind, lw, lh, s, extra) {
  return '<canvas data-paint="' + kind + '" data-s="' + s + '" width="' + (lw * s) + '" height="' + (lh * s)
    + '" style="width:' + (lw * s) + 'px;height:' + (lh * s) + 'px;' + (extra || '') + '"></canvas>';
}

/* ===========================================================================
   4. SCENE BUILDERS
   =========================================================================== */

function stars(w, h, n) {
  var out = '';
  for (var i = 0; i < n; i++) {
    var x = ((i * 7919) % 997) / 997 * w;
    var y = ((i * 5081) % 613) / 613 * h;
    out += '<i class="' + (i % 3 === 0 ? 'dim' : '') + '" style="left:' + Math.round(x) + 'px;top:' + Math.round(y) + 'px"></i>';
  }
  return '<div class="stars">' + out + '</div>';
}

function flies(spots) {
  return spots.map(function (s) {
    return '<i class="fly" style="left:' + s[0] + 'px;top:' + s[1] + 'px;animation-delay:' + s[2] + 's"></i>';
  }).join('');
}

function glyph(cls, sprite, cap, attrs) {
  return '<button type="button" class="board-glyph ' + cls + '" ' + (attrs || '') + '>'
    + IV.spriteTag(sprite, 24) + '<span class="g-cap">' + cap + '</span></button>';
}

/* a fence run: warm wood in the frame, and something for the bank to end at */
function fence(left, top, w, h, posts) {
  var out = '';
  for (var i = 0; i < posts; i++) {
    out += '<u style="left:' + Math.round(i * (w - 6) / (posts - 1)) + 'px"></u>';
  }
  out += '<i style="top:2px"></i><i style="top:' + Math.round(h * 0.55) + 'px"></i>';
  return '<div class="fence" style="left:' + left + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px">' + out + '</div>';
}

/* a writ: the bough, the paper folded over it, the cord round both, the name
   inked down the paper. `w` is the paper width; the paper sizes to its ink. */
function writ(o) {
  var w = o.w || 30, bw = o.branchW || 150;
  /* side -1: the writ hangs left of the trunk, so its bough runs back to the
     right, thick at the trunk end and thin under the paper. A bough that
     sticks out equally both ways reads as a crossbar on a post. */
  var side = o.side || -1;
  var bl = side < 0 ? Math.round(-w * 0.45) : Math.round(-(bw - w) + w * 0.45);
  var tilt = side < 0 ? 3.5 : -3.5;
  var cls = 'writ' + (side > 0 ? ' lean' : '') + (o.open ? ' unfurled' : '') + (o.stub ? ' stub' : '');
  var twigs = '<span class="wr-twig" style="left:' + Math.round(bl + bw * (side < 0 ? 0.52 : 0.18))
    + 'px;width:' + Math.round(bw * 0.22) + 'px;transform:rotate(' + (side < 0 ? -11 : 11) + 'deg)"></span>'
    + '<span class="wr-twig" style="left:' + Math.round(bl + bw * (side < 0 ? 0.74 : 0.06))
    + 'px;width:' + Math.round(bw * 0.18) + 'px;transform:rotate(' + (side < 0 ? 8 : -8) + 'deg)"></span>';
  return '<button type="button" class="' + cls + '" style="left:' + (o.cx - w / 2) + 'px;top:' + o.y
    + 'px;width:' + w + 'px;transform:rotate(' + tilt + 'deg)"' + (o.attrs || '') + '>'
    + twigs
    + '<span class="wr-flap"></span>'
    + '<span class="wr-branch" style="left:' + bl + 'px;width:' + bw + 'px"></span>'
    + '<span class="wr-cord"></span>'
    + (o.open ? '<span class="wr-roll"></span>' : '')
    + '<span class="wr-paper" style="width:' + w + 'px'
    + (o.maxH ? ';max-height:' + o.maxH + 'px;overflow:hidden' : '') + '">'
    + '<span class="wr-ink">' + (o.name || '') + '</span></span>'
    + '</button>';
}

/* nights kept, carved on a plank on a stake driven into the bank — the count
   lives on a real object instead of a black label floating over the scene */
function tallyBoard(left, top, w, stake, nights, headline, sub, attrs) {
  var post = stake ? '<span class="ty-post" style="height:' + stake + 'px"></span>' : '';
  return '<div class="tally" style="left:' + left + 'px;top:' + top + 'px;width:' + w + 'px"' + (attrs || '') + '>'
    + '<b>' + headline + '</b>' + (sub ? '<i>' + sub + '</i>' : '')
    + '<u style="width:' + (nights * 6) + 'px"></u>' + post + '</div>';
}

  +   '<div class="contact" style="left:256px;top:150px;width:58px;height:12px"></div>'

  + '<div class="willow">'
  +   paintTag('trunk', TRUNK_W, TRUNK_H, trS, 'left:' + trL + 'px;top:' + trT + 'px')
  +   paintTag('canopy', CAN_W, CAN_H, canS, 'left:' + canL + 'px;top:' + canT + 'px')
  +   curtain(80, canL, canT, canS, 34, 96, SKY + BANK - 54)
  +   lanternPools
  /* the bough the watch hangs from, drawn across the lanterns' rings */
  +   '<span class="prop" style="left:170px;top:202px;width:112px;height:6px;z-index:4;'
  +     'background:linear-gradient(180deg,#96703f 0 2px,#5e4220 2px 4px,#33210d 4px 6px);'

/* ===========================================================================
   8. THE GLADE'S OWN TILES AND CANVASES — night grass, still water, a warmed
      ridge line, and the two procedural tree canvases. Painted with the
      harness's tileURL() so they stay data-URIs and the page runs offline.
   =========================================================================== */
(function paintGlade() {
  var GRASS = IV.tileURL(24, 24, function (ctx, w, h) {
    ctx.fillStyle = '#232a1a'; ctx.fillRect(0, 0, w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var k = (x * 7 + y * 13 + ((x * x + y) % 5)) % 23;
      if (k === 0) { ctx.fillStyle = '#1a2013'; ctx.fillRect(x, y, 2, 1); }
      else if (k === 7) { ctx.fillStyle = '#2c3421'; ctx.fillRect(x, y, 1, 1); }
      else if (k === 14 && (y % 9 === 4)) { ctx.fillStyle = '#3d4526'; ctx.fillRect(x, y, 2, 2); }
      else if (k === 19 && (x % 11 === 3)) { ctx.fillStyle = '#4a4128'; ctx.fillRect(x, y, 1, 2); }
    }
  });
  var WATER = IV.tileURL(32, 16, function (ctx, w, h) {
    ctx.fillStyle = '#1a2130'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#212b3c';
    for (var y = 0; y < h; y += 4) ctx.fillRect((y * 7) % w, y, 15, 1);
    ctx.fillStyle = '#2f4258';
    ctx.fillRect(4, 2, 9, 1); ctx.fillRect(20, 9, 10, 1); ctx.fillRect(12, 13, 6, 1);
    ctx.fillStyle = '#4a3d24';
    ctx.fillRect(24, 5, 7, 1); ctx.fillRect(2, 11, 6, 1);
  });
  /* the harness's ridge tile is cold navy; the glade wears a warmed one so the
     horizon belongs to the same family as the rest of the set */
  var MTNS = IV.tileURL(120, 24, function (ctx, w, h) {
    var tri = function (t) { return 1 - Math.abs(2 * (t - Math.floor(t)) - 1); };
    for (var x = 0; x < w; x++) {
      var farTop = Math.round(12 - 9 * tri(x / 60));
      ctx.fillStyle = '#3d3040'; ctx.fillRect(x, farTop, 1, h - farTop);
      ctx.fillStyle = '#54424a'; ctx.fillRect(x, farTop, 1, 1);
      var nearTop = Math.round(23 - 13 * tri((x + 18) / 40));
      ctx.fillStyle = '#251c24'; ctx.fillRect(x, nearTop, 1, h - nearTop);
      ctx.fillStyle = '#3a2a2a'; ctx.fillRect(x, nearTop, 1, 1);
    }
  });
  document.querySelectorAll('.glade [data-fill="grass"]').forEach(function (el) {
    el.style.backgroundImage = GRASS; el.style.backgroundSize = '72px 72px';
  });
  document.querySelectorAll('.glade [data-fill="water"]').forEach(function (el) {
    el.style.backgroundImage = WATER; el.style.backgroundSize = '96px 48px';
  });
  document.querySelectorAll('.glade [data-fill="mtns"]').forEach(function (el) {
    el.style.backgroundImage = MTNS;
  });
  document.querySelectorAll('canvas[data-paint]').forEach(function (c) {
    var s = +c.dataset.s, ctx = c.getContext('2d');
    if (c.dataset.paint === 'trunk') paintTrunk(ctx, s);
    else if (c.dataset.paint === 'canopy') paintCanopy(ctx, s);
  });
  IV.layout();
})();
