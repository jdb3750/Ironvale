/* ===========================================================================
   3. SCENE BUILDERS
   =========================================================================== */

function stars(w, h, n) {
  var out = '';
  for (var i = 0; i < n; i++) {
    var x = ((i * 7919) % 997) / 997 * w;
    var y = ((i * 5081) % 613) / 613 * h;
    out += `<i class="${i % 3 === 0 ? 'dim' : ''}" style="left:${Math.round(x)}px;top:${Math.round(y)}px"></i>`;
  }
  return `<div class="stars">${out}</div>`;
}

/* the crown, as a stepped pixel dome of leaf-textured bars. The bars taper away
   again at the bottom, so the hanging boughs emerge from under a rounded mass
   instead of a hedge. `off` gives each row a little sideways wobble. */
var CROWN_W = [0.12, 0.24, 0.38, 0.52, 0.64, 0.74, 0.83, 0.90, 0.95, 0.99, 1.00, 0.98, 0.93, 0.84, 0.70];
var CROWN_OFF = [10, -6, 9, -7, 4, -9, 6, -3, 2, -6, 0, 7, -4, 9, -3];

/* x, y, w, h as fractions of the crown box — kept inside the dome's silhouette */
var CLUMPS = [
  [0.20, 0.26, 0.18, 0.28, 'dark'], [0.42, 0.12, 0.22, 0.26, 'pale'],
  [0.60, 0.30, 0.20, 0.30, 'dark'], [0.28, 0.50, 0.24, 0.26, 'pale'],
  [0.66, 0.56, 0.16, 0.24, 'dark'], [0.16, 0.44, 0.14, 0.22, 'pale'],
  [0.46, 0.62, 0.20, 0.22, 'dark'],
];

function crown(left, top, w, unit) {
  var out = '', y = top, h = CROWN_W.length * unit;
  for (var i = 0; i < CROWN_W.length; i++) {
    var bw = Math.round(w * CROWN_W[i]);
    var dx = Math.round(CROWN_OFF[i] * (w / 560));
    out += `<i class="${i < 4 ? 'top' : ''}" style="left:${Math.round(left + (w - bw) / 2 + dx)}px;top:${y}px;width:${bw}px;height:${unit}px"></i>`;
    y += unit;
  }
  CLUMPS.forEach(function (c) {
    out += `<u class="${c[4]}" style="left:${Math.round(left + c[0] * w)}px;top:${Math.round(top + c[1] * h)}px;`
      + `width:${Math.round(c[2] * w)}px;height:${Math.round(c[3] * h)}px"></u>`;
  });
  return { html: `<div class="crown">${out}</div>`, bottom: y };
}

/* how far down the crown still covers a point `dx` px out from its centre —
   the arched hairline the boughs hang from */
function crownBottomAt(top, unit, w, dx) {
  var last = 1;
  for (var i = 0; i < CROWN_W.length; i++) if (CROWN_W[i] * w / 2 >= dx) last = i + 1;
  return top + last * unit;
}

/* FULLNESS: the count of hanging strands IS the earned-rest reading. `n` is the
   only knob — at three nights kept the curtain is thin enough to see the ridge
   straight through it; at eleven it closes over the water.
   The length envelope is deliberately double-humped: longest either side of the
   trunk, shorter directly over it and at the edges, which is what makes the
   silhouette read as a willow rather than a hedge. */
function curtain(n, left, w, crownTop, unit, base, amp) {
  var out = '', cx = left + w / 2;
  for (var i = 0; i < n; i++) {
    var t = (i + 0.5) / n;
    var x = Math.round(left + t * w);
    var s1 = Math.sin(Math.PI * t);
    var s2 = Math.sin(2 * Math.PI * t); s2 = s2 * s2;
    var jitter = (((i * 37) % 17) / 17 - 0.5) * 0.24;
    var len = Math.max(10, Math.round((base + amp * (0.14 + 0.86 * s2) * s1) * (1 + jitter)));
    var top = Math.round(crownBottomAt(crownTop, unit, w, Math.abs(x - cx)) - 8);
    var cls = ((i * 7) % 5 === 0) ? ' lit' : (((i * 11) % 4 === 0) ? ' deep' : '');
    out += `<div class="bough${cls}" style="left:${x}px;top:${top}px;height:${len}px"></div>`;
  }
  return out;
}

function flies(spots) {
  return spots.map(function (s) {
    return `<i class="fly" style="left:${s[0]}px;top:${s[1]}px;animation-delay:${s[2]}s"></i>`;
  }).join('');
}

function glyph(cls, sprite, cap, attrs) {
  return `<button type="button" class="board-glyph ${cls}" ${attrs || ''}>${IV.spriteTag(sprite, 24)}<span class="g-cap">${cap}</span></button>`;
}

/* ===========================================================================
   7. THE GLADE'S OWN TILES — night grass and still water, painted with the
      harness's tileURL() so they stay data-URIs and the page runs offline.
   =========================================================================== */
(function paintGlade() {
  var GRASS = IV.tileURL(24, 24, function (ctx, w, h) {
    ctx.fillStyle = '#1e2a24'; ctx.fillRect(0, 0, w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var k = (x * 7 + y * 13 + ((x * x + y) % 5)) % 23;
      if (k === 0) { ctx.fillStyle = '#17211c'; ctx.fillRect(x, y, 2, 1); }
      else if (k === 7) { ctx.fillStyle = '#26342b'; ctx.fillRect(x, y, 1, 1); }
      else if (k === 14 && (y % 9 === 4)) { ctx.fillStyle = '#334839'; ctx.fillRect(x, y, 2, 2); }
    }
  });
  var WATER = IV.tileURL(32, 16, function (ctx, w, h) {
    ctx.fillStyle = '#14202e'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#1a2b3d';
    for (var y = 0; y < h; y += 4) ctx.fillRect((y * 7) % w, y, 15, 1);
    ctx.fillStyle = '#24405a';
    ctx.fillRect(4, 2, 9, 1); ctx.fillRect(20, 9, 10, 1); ctx.fillRect(12, 13, 6, 1);
  });
  document.querySelectorAll('[data-fill="grass"]').forEach(function (el) {
    el.style.backgroundImage = GRASS; el.style.backgroundSize = '72px 72px';
  });
  document.querySelectorAll('[data-fill="water"]').forEach(function (el) {
    el.style.backgroundImage = WATER; el.style.backgroundSize = '96px 48px';
  });
  IV.layout();
})();
