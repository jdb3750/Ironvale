<!doctype html>

<title>Iron Vale — Sage Elowen's willow, a scene</title>
<!-- Design mockup. Nothing here is app code: static/ is the app, this is drawing
     paper. Everything visual comes from docs/mockups/_harness.js (tokens, fonts,
     sprite engine, gallery chrome); this file adds only the willow's own close-up
     and the two states of the screen.

     REWORKED TO THE LEDGER FORMULA. The previous mockup was an establishing shot:
     a whole night glade with the writs as ribbons you tapped on the boughs. Joe
     rated it one of the two worst ("difficult to understand what's happening")
     and decreed the ledger the target: up-close on the work surface, everything
     in frame displaying state or doing work, the menu driving and the scene
     staging. This file is that redraw: Elowen's writing board under the willow. -->
<script src="_harness.js"></script>
<body>
<script>
IV.injectStyles();

/* ===========================================================================
   1. THE SCENE'S OWN STYLES — appended AFTER the harness sheet so these win.

   Materials, per the decree: iron, oak, stone, canvas, dark subtle fills.
   The night-exterior identity stands (exteriors track the town clock), but the
   frame is close now, so night reads as lantern-light on an oak board under
   the boughs — not a panorama.
   =========================================================================== */

/* ---------------- the giver idiom: portrait + typewriter dialogue ----------

   Elowen in exactly the way the app talks: a bordered portrait beside a black
   typewriter box. There is no tap-to-speak bust anywhere on this screen. */

/* ===========================================================================
   3. THE FOLIAGE FRINGE — the boughs dipping into the top of the frame.

   Painted procedurally so the underside is lobed and ragged instead of a
   stepped rectangle. The depth array is computed once per frame and shared
   with the strand placer, so leaves and strands agree about where the
   foliage ends. Fullness is the earned-rest reading: at eleven nights kept
   the fringe is heavy; at three it would thin to a few strands.
   =========================================================================== */

function hash2(x, y) {
  var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

var LEAFG = ['#0e1507', '#182310', '#223016', '#2c3f1e', '#3a5328', '#4c6b38', '#618748'];

/* full: 0..1 — the rest-kept reading. 1 = boughs came back thick. */
function fringeDepth(W, H, seed, full) {
  var d = [];
  for (var x = 0; x < W; x++) {
    var t = x / W;
    var v = 0.30 + 0.34 * full
      + 0.15 * Math.sin(t * 6.28 * 1.7 + seed)
      + 0.11 * Math.sin(t * 6.28 * 3.3 + seed * 2.1)
      + 0.06 * Math.sin(t * 6.28 * 7.1 + seed * 0.6)
      + (hash2(x, seed * 13) - 0.5) * 0.06;
    d.push(Math.max(4, Math.round(H * Math.min(0.96, v))));
  }
  return d;
}

/* Joe's own art shades in 2-3px clusters, never lone pixels. Every noise
   field below is therefore sampled per CLUMP — brick-laid blocks two cells
   tall and three cells wide, offset every other band — so sky holes, shade
   jitter and lamplit tips all land as grouped clumps, not 1px speckle. */
function clumpAt(x, y, seed) {
  var band = Math.floor(y / 2);
  var col = Math.floor((x + (band & 1)) / 3);
  return hash2(col * 17 + seed, band * 3 + seed);
}

function paintFringe(ctx, depth, H, s) {
  for (var x = 0; x < depth.length; x++) {
    var d = depth[x];
    for (var y = 0; y < d; y++) {
      if (clumpAt(x, y, 91) < 0.045) continue;                /* sky through the leaves, in clumps */
      var u = y / d;
      var idx = u < 0.30 ? 1 : u < 0.55 ? 2 : u < 0.78 ? 3 : 4;
      var n = clumpAt(x, y, 7);
      if (n < 0.22) idx -= 1; else if (n > 0.82) idx += 1;
      if (d - y <= 3 && clumpAt(x, y, 43) > 0.55) idx += 2;   /* lamplit leaf tips, clumped */
      if (idx < 0) idx = 0; if (idx > 6) idx = 6;
      ctx.fillStyle = LEAFG[idx];
      ctx.fillRect(x * s, y * s, s, s);
    }
    for (var e = 0; e < 4; e++) {                             /* ragged tufts below, two cells wide */
      var yy = d + e;
      if (yy >= H) break;
      if (hash2(Math.floor(x / 2) * 2, (yy >> 1) * 5) < 0.40 - e * 0.09) {
        ctx.fillStyle = LEAFG[1 + (e % 2)];
        ctx.fillRect(x * s, yy * s, s, s);
      }
    }
  }
}

/* the hanging curtain, started from the fringe's own underside */
function strands(depth, s, count, maxLen, bandH) {
  var out = '';
  for (var i = 0; i < count; i++) {
    var t = (i + 0.5) / count;
    var col = Math.min(depth.length - 1, Math.floor(t * depth.length));
    var x = Math.round(t * depth.length * s);
    var y0 = (depth[col] - 1) * s;
    var jitter = ((i * 37) % 17) / 17;
    var len = Math.round(maxLen * (0.30 + 0.70 * jitter));
    if (y0 + len > bandH - 4) len = bandH - 4 - y0;
    if (len < 8) continue;
    var cls = ((i * 7) % 5 === 0) ? ' lit' : (((i * 11) % 4 === 0) ? ' deep' : '');
    out += '<i class="strand' + cls + '" style="left:' + x + 'px;top:' + y0 + 'px;height:' + len + 'px"></i>';
  }
  return out;
}

function fringeTag(W, H, s, key, attrs) {
  return '<canvas class="leafcan" data-paint="' + key + '" width="' + (W * s) + '" height="' + (H * s)
    + '" style="width:' + (W * s) + 'px;height:' + (H * s) + 'px"' + (attrs || '') + '></canvas>';
}

/* depth arrays, one per frame — eleven nights kept, so both hang full */
var FR_D = { W: 270, H: 54, s: 2 };   /* desktop fringe: 540 x 108 px */
var FR_P = { W: 178, H: 46, s: 2 };   /* phone fringe:   356 x  92 px */
FR_D.depth = fringeDepth(FR_D.W, FR_D.H, 3.0, 1.0);
FR_P.depth = fringeDepth(FR_P.W, FR_P.H, 5.2, 1.0);

/* ===========================================================================
   4. SCENE BUILDERS
   =========================================================================== */

function stars(spots) {
  return '<div class="stars">' + spots.map(function (p) {
    return '<i class="' + (p[2] ? 'dim' : '') + '" style="left:' + p[0] + 'px;top:' + p[1] + 'px"></i>';
  }).join('') + '</div>';
}

function stands(key, px) {
  return '<span class="footed"><span class="fshade"></span>' + IV.spriteTag(key, px) + '</span>';
}

/* the giver idiom: Elowen's portrait beside her typewriter line */
function talkWin(opts) {
  return '<div class="win"'
    + ' data-seam="THE PORTRAIT" data-tag="HER PORTRAIT SPEAKS|The giver-screen idiom: portrait beside a typewriter line. Joe hand-drew the 32&times;32 at static/art/npcs/sage_elowen/; this char map is a stand-in approximating it. The old tap-to-speak bust is gone &mdash; this is the talking surface, always composed in.">'
    + '<div class="npc-head">'
    + IV.spriteTag('elowen_portrait', opts.px)
    + '<div class="dialog"><div class="npc-name">Sage Elowen &middot; Quests of Stillness</div>'
    + '<div class="dlg"><span class="cursor-blink">' + opts.line + '</span></div></div>'
    + '</div></div>';
}

/* the watch bough: hooks bare while nothing is sworn; lanterns hung while
   a writ runs, going dark one by one as its nights are kept */
function watchBough(o) {
  var out = '<div class="bough" style="right:-8px;top:' + o.top + 'px;width:' + o.w + 'px;transform:rotate(-4deg)"'
    + (o.attrs || '') + '></div>';
  (o.hooks || []).forEach(function (h) {
    out += '<span class="hook" style="left:' + h[0] + 'px;top:' + h[1] + 'px"></span>';
    if (h[2]) {
      out += '<span class="lamp-hang' + (h[2] === 'lantern_dark' ? ' out' : '') + '" style="left:' + (h[0] - 9) + 'px;top:' + (h[1] + 7) + 'px">'
        + IV.spriteTag(h[2], 24) + '</span>';
      if (h[2] === 'lantern_lit') {
        out += '<div class="nightpool" style="left:' + (h[0] - 42) + 'px;top:' + (h[1] + 26) + 'px;width:96px;height:64px"></div>';
      }
    }
  });
  return out;
}

/* the writ open on the board — the menu's selection, displayed */
function wpaper(o) {
  var pays = o.pays.map(function (p) { return '<span class="pay">' + p + '</span>'; }).join('');
  var seat;
  if (o.sealed) {
    seat = '<div class="sealseat"' + (o.sealAttrs || '') + '>'
      + '<span class="sealdone">' + IV.spriteTag('wax_seal', 42) + '</span>'
      + '<span class="sealcap"><b>' + o.sealHead + '</b>' + o.sealCap + '</span></div>';
  } else {
    seat = '<div class="sealseat"' + (o.sealAttrs || '') + '>'
      + '<span class="sealghost"></span>'
      + '<span class="sealcap"><b>' + o.sealHead + '</b>' + o.sealCap + '</span></div>';
  }
  return '<div class="wpaper"' + (o.attrs || '') + '>'
    + '<div class="wp-head"><span class="wp-title">' + o.title + '</span>'
    + '<span class="wp-hand">in Elowen&rsquo;s hand</span></div>'
    + '<p class="wp-asks">' + o.asks + '</p>'
    + '<div class="wpays">' + pays + '</div>'
    + '<div class="wruns">' + o.runs + '</div>'
    + '<div class="women">' + o.omen + '</div>'
    + seat
    + '</div>';
}

/* the close-up: night strip with boughs above, the oak board below */
function grove(o) {
  var fr = o.fr;
  return '<div class="grove"' + (o.attrs || '') + '>'
    + '<div class="nightband" style="height:' + o.bandH + 'px">'
    +   stars(o.stars)
    +   fringeTag(fr.W, fr.H, fr.s, o.paintKey, o.fringeAttrs)
    +   strands(fr.depth, fr.s, o.strandCount, o.strandLen, o.bandH)
    +   watchBough(o.bough)
    + '</div>'
    + '<div class="boardtop">'
    +   '<div class="board-floor">'
    +     '<div>' + o.paper + '</div>'
    +     '<div class="btools">'
    +       '<div class="btool">' + stands('board_lamp', o.phone ? 28 : 42) + '</div>'
    +       '<div class="btool">' + stands('inkstone', o.phone ? 32 : 48)
    +         '<span class="under"><span class="paper-tag">oak-gall ink</span></span></div>'
    +       '<div class="btool">' + stands('waxstick', o.phone ? 28 : 42)
    +         '<span class="under"><span class="paper-tag">sealing wax</span></span></div>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '</div>';
}

/* one row of the writ menu */
function wentry(o) {
  var cls = 'wentry' + (o.open ? ' open' : '') + (o.waits ? ' waits' : '');
  return '<div class="' + cls + '"' + (o.attrs || '') + '>'
    + '<span class="wname">' + o.name + '</span>'
    + '<span class="wterms">' + o.terms + '</span>'
    + '<span class="women">' + o.omen + '</span>'
    + (o.onboard ? '<span class="onboard">&#9656; ' + o.onboard + '</span>' : '')
    + (o.watchline ? '<span class="watchline">' + o.watchline + '</span>' : '')
    + (o.action ? '<button type="button" class="btn small wide">' + o.action + '</button>' : '')
    + '</div>';
}

/* ===========================================================================
   5. THE THREE OPEN WRITS — one source, shared by menu and board
   =========================================================================== */

var WRITS = {
  stillness: {
    name: 'A Day of Stillness',
    terms: 'asks a day of no hard work &middot; pays five-and-forty in learning and a purse of twenty &middot; runs until dawn',
    omen: 'her omen: your heart sits nine parts in a hundred beneath its usual song.',
  },
  evenings: {
    name: 'Three Quiet Evenings',
    terms: 'asks lamps out by the tenth bell &middot; pays a draught of vigor at every dawn kept &middot; runs three nights',
    omen: 'her omen: sleep has run thin all week &mdash; five hours and a half a night.',
  },
  slowroad: {
    name: 'The Slow Road',
    terms: 'asks tomorrow&rsquo;s miles at half your stride &middot; pays a purse of twelve, and the streak keeps itself &middot; runs one day',
    omen: 'her omen: your legs have done heavy work two days together.',
  },
};

/* ===========================================================================
   6. DESKTOP — THE CHOOSING STATE
      The menu holds three open writs; "A Day of Stillness" is the one being
      weighed, so that is the sheet lying open on the board. The watch bough's
      hooks hang empty: nothing is sworn.
   =========================================================================== */

function desktopScene() {
  var paper = wpaper({
    title: 'A Day of Stillness',
    asks: 'From the swearing until dawn: no hard work. A walk if the day wants one, a stretch if the hips ask, and a full night&rsquo;s sleep &mdash; that is the whole of it.',
    pays: [
      IV.spriteTag('icon_leaf', 15) + ' five-and-forty in learning',
      IV.spriteTag('icon_coin', 15) + ' a purse of twenty',
      '<span class="wvigor">&#9679;&#9679;</span> two draughts of vigor',
    ],
    runs: 'runs <b>from the swearing until dawn</b> &middot; walks and stretches never break it',
    omen: WRITS.stillness.omen,
    sealed: false,
    sealHead: 'the wax lands here when it is sworn',
    sealCap: 'the press is the flourish on the oath, not the oath &mdash; swearing happens in the menu',
    attrs: ' data-seam="THE BOARD" data-tag="THE BOARD DISPLAYS|Whichever writ the menu is weighing lies open here, terms inked on the sheet. Choose another entry and the sheet swaps. It displays; it never gates &mdash; the paper is not a button."',
    sealAttrs: ' data-seam="THE SEAL" data-tag="THE SEAL DECORATES|On swearing, the wax stick melts and the leaf-cut seal presses into this circle. Animation decorating a state change, never gating one &mdash; the swear itself is the menu action."',
  });

  var scene = grove({
    fr: FR_D, paintKey: 'fringe_d', bandH: 148, phone: false,
    stars: [[36, 96, 0], [88, 118, 1], [150, 104, 0], [204, 126, 1], [258, 112, 0], [318, 130, 1], [368, 120, 0]],
    strandCount: 40, strandLen: 64,
    fringeAttrs: ' data-seam="REST KEPT" data-tag="FOLIAGE = REST KEPT|Eleven nights kept, so the boughs dip in heavy; at three this would thin to a few strands. One of the two ambient state displays kept from the old glade. Shading is dithered in 2&ndash;3px clusters, after Joe&rsquo;s own hand &mdash; never 1px speckle."',
    bough: {
      top: 66, w: 300,
      attrs: ' data-seam="THE WATCH BOUGH" data-tag="LANTERNS = NIGHTS REMAINING|Three iron hooks on the low bough, all bare: nothing is sworn. Swear a writ and a lantern is hung for every night it runs. The other surviving ambient display."',
      hooks: [[336, 80], [406, 77], [476, 74]],
    },
    paper: paper,
    attrs: ' data-seam="THE CLOSE CROP" data-tag="UP CLOSE, NOT ESTABLISHING|The frame is Elowen&rsquo;s writing board, not the glade. No pond, no ridge, no moon &mdash; a strip of night, the boughs that carry state, and the oak the work happens on. Everything in frame displays state or does work."',
  });

  var menu = '<div class="win writmenu"'
    + ' data-seam="THE MENU DRIVES" data-tag="THE MENU DRIVES|Choosing and swearing happen in this bordered panel: one entry per open writ &mdash; what it asks, pays and runs, Elowen&rsquo;s omen as one line &mdash; and the swear action. The scene stages the choice; it never takes the tap."><span class="win-title">The Open Writs</span>'
    + wentry({ open: true, name: WRITS.stillness.name, terms: WRITS.stillness.terms, omen: WRITS.stillness.omen,
        onboard: 'lies open on the board', action: 'SWEAR THE WRIT' })
    + wentry({ name: WRITS.evenings.name, terms: WRITS.evenings.terms, omen: WRITS.evenings.omen })
    + wentry({ name: WRITS.slowroad.name, terms: WRITS.slowroad.terms, omen: WRITS.slowroad.omen })
    + '<div class="menu-foot">the board shows whichever writ you are weighing &middot; one writ sworn at a time</div>'
    + '</div>';

  return '<div class="app-pad">' + IV.header({ phone: false })
    + talkWin({ px: 128, line: '&ldquo;Three writs tonight, and none heavier than a blanket. Whichever you weigh in the list, I lay open on the board &mdash; swear it there, and I will seal it here.&rdquo;' })
    + '<div class="stagegrid">' + scene + menu + '</div>'
    + IV.footer() + '</div>';
}

/* ===========================================================================
   7. PHONE — THE SWORN STATE
      "Three Quiet Evenings" was sworn at dusk yesterday. The board holds the
      sworn sheet, sealed; three lanterns went up on the bough, the first has
      gone dark (a night kept), two still burn. Renounce is a menu action.
   =========================================================================== */

function phoneScene() {
  var paper = wpaper({
    title: 'Three Quiet Evenings',
    asks: 'Lamps out by the tenth bell, three evenings running. Read if you like, stretch if you like &mdash; but the lamps go out, and sleep takes the rest.',
    pays: [
      '<span class="wvigor">&#9679;</span> a draught of vigor at every dawn kept',
      IV.spriteTag('icon_leaf', 15) + ' thirty in learning at the end',
    ],
    runs: 'runs <b>three nights</b> &middot; this is the second',
    omen: WRITS.evenings.omen,
    sealed: true,
    sealHead: 'sworn at dusk, sealed with the willow leaf',
    sealCap: 'the first lantern went dark at dawn &mdash; a night kept',
    attrs: ' data-seam="SEALED ON THE BOARD" data-tag="THE SWORN SHEET|The board holds the sworn writ, sealed. The wax pressed when the oath was taken in the menu &mdash; the flourish that decorated the change, still sitting on the paper as its state."',
  });

  var scene = grove({
    fr: FR_P, paintKey: 'fringe_p', bandH: 132, phone: true,
    stars: [[28, 84, 0], [70, 104, 1], [122, 92, 0], [168, 110, 1], [214, 98, 0]],
    strandCount: 26, strandLen: 52,
    fringeAttrs: ' data-seam="REST KEPT" data-tag="FOLIAGE = REST KEPT|Same reading as the desktop frame: eleven nights kept, boughs heavy."',
    bough: {
      top: 52, w: 252,
      attrs: ' data-seam="THE NIGHT WATCH" data-tag="LANTERNS = NIGHTS REMAINING|Three went up when the writ was sworn. One has guttered dark &mdash; a night kept; two still burn. When the last goes dark it is dawn and the writ is kept."',
      hooks: [[148, 66, 'lantern_dark'], [208, 63, 'lantern_lit'], [268, 60, 'lantern_lit']],
    },
    paper: paper,
    attrs: ' data-seam="THE CLOSE CROP, SWORN" data-tag="SAME BOARD, DIFFERENT STATE|The identical close-up. Only what the frame displays changed: the sealed sheet, and the lanterns on the bough."',
  });

  var menu = '<div class="win writmenu"'
    + ' data-seam="RENOUNCE, IN THE MENU" data-tag="RENOUNCE IS A MENU ACTION|Setting a sworn writ aside is an ordinary entry action in the same panel that swore it &mdash; no red DANGER control, no scolding, and nothing in the scene to find and tap."><span class="win-title">The Sworn Writ</span>'
    + wentry({ open: true, name: WRITS.evenings.name, terms: WRITS.evenings.terms, omen: WRITS.evenings.omen,
        onboard: 'sworn at dusk &middot; sealed on the board',
        watchline: 'two of three lanterns still burn &mdash; the last goes dark at dawn after next',
        action: 'RENOUNCE THE WRIT' })
    + wentry({ waits: true, name: WRITS.stillness.name, terms: WRITS.stillness.terms, omen: WRITS.stillness.omen })
    + wentry({ waits: true, name: WRITS.slowroad.name, terms: WRITS.slowroad.terms, omen: WRITS.slowroad.omen })
    + '<div class="menu-foot">the willow does not scold &mdash; renounce whenever the body disagrees &middot; the others wait for a clear board</div>'
    + '</div>';

  return '<div class="app-pad">' + IV.header({ phone: true })
    + talkWin({ px: 96, line: '&ldquo;Sworn and sealed. Two lanterns yet burn on the bough &mdash; sleep them dark, and the willow keeps the third night for you.&rdquo;' })
    + scene + menu
    + IV.footer() + '</div>' + IV.dock();
}

/* ===========================================================================
   8. THE WALL
   =========================================================================== */

IV.page({
  title: "Iron Vale — Sage Elowen's willow, a scene",
  subtitle: 'visual mockup, nothing wired up &middot; replaces the ribbon-glade mockup for giver=recovery (giver.js:185), redrawn to the ledger formula',
  legend: [
    { label: 'THE CROP', text: 'the writing board, up close &mdash; not the glade' },
    { label: 'THE MENU', text: 'a bordered panel chooses and swears; the scene never gates' },
    { label: 'THE BOARD', text: 'the weighed writ lies open, terms inked &mdash; the menu&rsquo;s selection, displayed' },
    { label: 'THE SEAL', text: 'wax pressed on swearing &mdash; decoration on a state change, never a gate' },
    { label: 'ELOWEN', text: 'her portrait and a typewriter line, the giver-screen idiom' },
    { label: 'THE BOUGHS', text: 'lanterns count nights remaining; foliage fullness is rest kept' },
  ],
  note: '<b>The ledger formula, applied to the willow.</b> The old screen was an establishing shot &mdash; sky, ridge, pond and the whole tree, with the writs as ribbons tapped on the boughs &mdash; and it was hard to tell what was happening. This redraw frames the work surface instead: Elowen&rsquo;s writing board under the willow. The <b>menu drives</b> &mdash; open writs are chosen and sworn in the bordered panel, never by touching the scene. The <b>board stages</b> &mdash; whichever writ the menu holds lies open on the oak with its terms inked, and swearing is decorated by the wax pressing onto the sheet: animation on a state change, never a gate. Elowen talks through the giver idiom &mdash; her hand-drawn portrait beside a typewriter line &mdash; not a tap-to-speak bust. Of the old glade only the two working state displays survive, moved onto the boughs that dip into frame: <b>lanterns hung for the nights remaining</b> on a sworn writ, and <b>the fullness of the foliage for rest kept</b>. It is still night out there &mdash; exteriors keep the town clock &mdash; but night is now lantern-light on oak, not a panorama.',
  frames: {
    phone: {
      title: 'Phone — 414px bezel — THE SWORN STATE',
      sub: 'the sworn writ sealed on the board; three lanterns on the bough, one dark for the night already kept; renounce is a menu action',
      chips: ['sealed on the board', 'two lanterns burn', 'renounce, in the menu', 'portrait + typewriter'],
      html: phoneScene(),
    },
    desktop: {
      title: 'Desktop — 900px viewport, scaled to fit — THE CHOOSING STATE',
      sub: 'the menu weighs three writs; the weighed one lies open on the board with its terms inked; the watch bough&rsquo;s hooks hang bare',
      chips: ['menu drives', 'the sheet on the board', 'empty hooks', 'wax waits in its circle', 'Elowen, composed in'],
      url: "ironvale.local:8322 — Sage Elowen's willow",
      html: desktopScene(),
    },
  },
});

IV.boot();

/* paint the two foliage fringes, then relayout so the gutter tags land */
(function paintGrove() {
  document.querySelectorAll('canvas[data-paint]').forEach(function (c) {
    var ctx = c.getContext('2d');
    if (c.dataset.paint === 'fringe_d') paintFringe(ctx, FR_D.depth, FR_D.H, FR_D.s);
    else if (c.dataset.paint === 'fringe_p') paintFringe(ctx, FR_P.depth, FR_P.H, FR_P.s);
  });
  IV.layout();
})();
</script>
